[package]
name = "aster-effect"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Effect-style actor runtime for projecting an Aster Code harness from an immutable event log"
repository = "https://github.com/aster-ai-lab/Effect"
homepage = "https://github.com/aster-ai-lab/Effect"
documentation = "https://docs.rs/aster-effect"
readme = "README.md"
keywords = ["effect", "actor", "agent", "harness", "aster"]
categories = ["asynchronous", "development-tools"]
rust-version = "1.85"
include = [
    "src/**/*",
    "tests/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "README.zh-CN.md",
]
publish = false

[dependencies]
cap-fs-ext = "=4.0.2"
cap-std = "=4.0.2"
fs2 = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {workspace = true}
thiserror = {workspace = true}
tokio = {version = "1", features = ["macros", "rt", "sync", "time"]}
tokio-util = {workspace = true}

[dev-dependencies]
tempfile = {workspace = true}
tokio = {version = "1", features = ["macros", "rt-multi-thread", "time"]}
