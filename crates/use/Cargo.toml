


[package]
name = "aster-use"
publish = false
version = "0.3.3"
edition = "2021"
license = "MIT"
rust-version = "1.85"
description = "Package install and machine-local tool acquire for Aster"

[lib]
name = "aster_use"
path = "src/lib.rs"

[[bin]]
name = "aster-use"
path = "src/main.rs"

[features]
default = ["extensions", "mcp"]
extensions = [
    "dep:aster-use-extension",
    "dep:aster-runtime",
    "dep:async-trait",
    "dep:fs2",
    "dep:olpc-cjson",
    "dep:pulldown-cmark",
    "dep:rusqlite",
    "dep:semver",
    "dep:tempfile",
]
mcp = [
    "dep:axum",
    "dep:base64",
    "dep:fs2",
    "dep:getrandom",
    "dep:rmcp",
    "dep:schemars",
    "dep:tokio-util",
    "dep:windows-sys",
]
tool-acquire = ["dep:aster-use-tool-acquire"]
reconcile = ["dep:aster-use-reconcile"]

[dependencies]
aster-use-core = { version = "0.2.4", path = "core" }
aster-use-tool-acquire = { version = "0.2.4", path = "tool-acquire", optional = true }
aster-use-reconcile = { version = "0.2.4", path = "reconcile", optional = true }
aster-use-extension = { version = "0.3.3", path = "extension", optional = true }
aster-runtime = { version = "=0.8.0", path = "../runtime", optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
olpc-cjson = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
semver = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["signal"] }
url.workspace = true
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console"], optional = true }

[dev-dependencies]
reqwest.workspace = true
flate2.workspace = true
olpc-cjson.workspace = true
ring = "0.17"
tar.workspace = true
tempfile.workspace = true
zip.workspace = true
