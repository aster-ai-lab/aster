[package]
name = "aster-use-tool-acquire"
description = "Machine-local installer for the command-line tools Studio already names"
version = "0.2.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/aster-ai-lab/Use"
authors = ["Aster"]
rust-version = "1.82"
publish = false

[dependencies]
aster-acl = {path = "../../acl"}
aster-use-core = {path = "../core"}
zip = {version = "2", default-features = false, features = ["deflate"]}
tokio = {version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "process", "sync", "time"]}
thiserror = {version = "2"}
tar = {version = "0.4"}
sha2 = {version = "0.10"}
serde_json = {version = "1"}
serde = {version = "1", features = ["derive"]}
reqwest = {version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking", "json"]}
fs2 = {version = "0.4"}
flate2 = {version = "1"}
base64 = {version = "0.22"}
[dev-dependencies]
tempfile = {version = "3"}
