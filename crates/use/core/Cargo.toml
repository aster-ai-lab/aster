[package]
name = "aster-use-core"
description = "Shared typed contracts for Aster Use domains"
version = "0.2.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/aster-ai-lab/Use"
authors = ["Aster"]
rust-version = "1.82"
publish = false

[dependencies]
async-trait = {workspace = true}
olpc-cjson = {version = "0.1"}
percent-encoding = {version = "2"}
pulldown-cmark = {version = "0.13", default-features = false}
semver = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
serde_yaml_ng = {version = "0.10"}
sha2 = {workspace = true}
thiserror = {workspace = true}
url = {workspace = true}

[dev-dependencies]
tempfile = {version = "3.27"}
