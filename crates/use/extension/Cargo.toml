[package]
name = "aster-use-extension"
version = "0.3.3"
description = "ACL manifest and native surface contracts for Aster Use extensions"
edition = "2021"
license = "MIT"
repository = "https://github.com/aster-ai-lab/Use"
authors = ["Aster"]
rust-version = "1.82"
publish = false

[dependencies]
olpc-cjson = "0.1"
aster-use-core = {path = "../core"}
aster-acl = {path = "../../acl"}
zip = {version = "2", default-features = false, features = ["deflate"]}
url = {version = "2"}
tough = {version = "0.24", default-features = false, features = ["http"]}
tokio = {version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "process", "sync", "time"]}
tempfile = {version = "3"}
tar = {version = "0.4"}
sha2 = {version = "0.10"}
semver = {version = "1"}
serde_json = {version = "1"}
serde = {version = "1", features = ["derive"]}
reqwest = {version = "0.12", default-features = false, features = ["rustls-tls", "stream"]}
futures-util = {version = "0.3"}
flate2 = {version = "1"}
fs2 = {version = "0.4"}
async-trait = {version = "0.1"}
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ring = "0.17"
