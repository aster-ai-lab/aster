name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      qualification:
        description: Build and independently reproduce main without publishing
        required: true
        default: false
        type: boolean
      release_tag:
        description: Existing version tag to rebuild or recover
        required: false
        type: string

permissions:
  contents: read

env:
  ASTER_RELEASE_COSIGN_VERSION: v3.1.3
  ASTER_RELEASE_PYTHON_VERSION: 3.13.7
  ASTER_RELEASE_RUST_TOOLCHAIN: 1.96.0
  ASTER_RELEASE_SYFT_VERSION: v1.50.0

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_date_epoch: ${{ steps.version.outputs.source_date_epoch }}
      source_revision: ${{ steps.version.outputs.source_revision }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.qualification && inputs.release_tag || github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.ASTER_RELEASE_RUST_TOOLCHAIN }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "aster-use"))')
          source_date_epoch=$(git show -s --format=%ct HEAD)
          source_revision=$(git rev-parse HEAD)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "source_date_epoch=${source_date_epoch}" >> "${GITHUB_OUTPUT}"
          echo "source_revision=${source_revision}" >> "${GITHUB_OUTPUT}"
          test "${source_date_epoch}" -ge 315532800
          test "${#source_revision}" -eq 40
          if test "${GITHUB_EVENT_NAME}" = "push"; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          elif test "${{ inputs.qualification }}" = "true"; then
            test -z "${{ inputs.release_tag }}"
            test "${GITHUB_REF_TYPE}" = "branch"
            test "${GITHUB_REF_NAME}" = "main"
          else
            test -n "${{ inputs.release_tag }}"
            test "${{ inputs.release_tag }}" = "v${version}"
            test "${GITHUB_REF_TYPE}" = "branch"
            test "${GITHUB_REF_NAME}" = "main"
            test "$(git rev-list -n 1 "refs/tags/${{ inputs.release_tag }}")" = "${source_revision}"
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${source_revision}" refs/remotes/origin/main; then
            echo "Release source ${source_revision} is not reachable from origin/main" >&2
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked -- --test-threads=1
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  binaries:
    needs: validate
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_STRIP: symbols
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: darwin-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.source_revision }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.ASTER_RELEASE_PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.ASTER_RELEASE_RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Enable deterministic PE/COFF linking
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=/Brepro" >> "${GITHUB_ENV}"
      - name: Disable nondeterministic ELF build IDs
        if: runner.os == 'Linux'
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=-Wl,--build-id=none" >> "${GITHUB_ENV}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build Use binaries
        run: cargo build --release --locked --target "${{ matrix.target }}" -p aster-use
      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          archive="aster-use-${version}-${{ matrix.name }}.tar.gz"
          stage="${RUNNER_TEMP}/aster-use-${version}-${{ matrix.name }}"
          install -d "${stage}"
          install -m 0755 "target/${{ matrix.target }}/release/aster-use" "${stage}/aster-use"
          install -m 0644 LICENSE README.md THIRD_PARTY_NOTICES.md "${stage}/"
          python scripts/package-release.py \
            --format tar.gz \
            --source "${stage}" \
            --output "${archive}" \
            --epoch "${SOURCE_DATE_EPOCH}"
          echo "ARCHIVE=${archive}" >> "${GITHUB_ENV}"
          echo "RELEASE_STAGE=${stage}" >> "${GITHUB_ENV}"
          echo "SBOM=aster-use-${version}-${{ matrix.name }}.spdx.json" >> "${GITHUB_ENV}"
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.validate.outputs.version }}"
          $archive = "aster-use-$version-${{ matrix.name }}.zip"
          $stage = Join-Path $env:RUNNER_TEMP "aster-use-$version-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aster-use.exe" "$stage/aster-use.exe"
          Copy-Item LICENSE,README.md,THIRD_PARTY_NOTICES.md $stage
          python scripts/package-release.py `
            --format zip `
            --source $stage `
            --output $archive `
            --epoch $env:SOURCE_DATE_EPOCH
          if ($LASTEXITCODE -ne 0) { throw "Deterministic release packaging failed" }
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SBOM=aster-use-$version-${{ matrix.name }}.spdx.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          install_root="${RUNNER_TEMP}/installed-${{ matrix.name }}"
          install -d "${install_root}"
          tar xzf "${ARCHIVE}" -C "${install_root}"
          python3 "${GITHUB_WORKSPACE}/scripts/verify-release-portability.py" \
            --release-root "${install_root}" \
            --forbid-path "${GITHUB_WORKSPACE}"
          export ASTER_USE_HOME="${RUNNER_TEMP}/release-smoke-home-${{ matrix.name }}"
          smoke_cwd="${RUNNER_TEMP}/release-smoke-cwd-${{ matrix.name }}"
          install -d "${ASTER_USE_HOME}" "${smoke_cwd}"
          cd "${smoke_cwd}"
          test -x "${install_root}/aster-use"
          test -f "${install_root}/LICENSE"
          test -f "${install_root}/README.md"
          test -f "${install_root}/THIRD_PARTY_NOTICES.md"
          test ! -e "${install_root}/aster-use-browser-driver"
          test ! -e "${install_root}/ocr-models"
          test ! -e "${install_root}/ocr-skills"
          test ! -e "${install_root}/skills"
          test ! -e "${install_root}/skill-data"
          test ! -e "${install_root}/dashboard"
          test ! -e "${install_root}/extensions"
          "${install_root}/aster-use" --version
          for route in browser ocr box; do
            if "${install_root}/aster-use" "${route}" --json > "${RUNNER_TEMP}/removed-${route}.json"; then
              echo "removed built-in route ${route} succeeded" >&2
              exit 1
            fi
            python3 - "${RUNNER_TEMP}/removed-${route}.json" "${route}" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["ok"] is False
          assert value["error"]["code"] == "use.builtin_removed"
          assert sys.argv[2] in value["error"]["message"]
          PY
          done
          "${install_root}/aster-use" capabilities --json > "${RUNNER_TEMP}/capabilities.json"
          python3 - "${RUNNER_TEMP}/capabilities.json" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["ok"] is True
          assert value["data"]["domains"] == []
          surfaces = value["data"]["externalSurfaces"]
          assert surfaces == ["tool", "mcp", "okf", "skill", "ui"]
          assert "flow" not in surfaces
          PY
          "${install_root}/aster-use" capability snapshot --json > "${RUNNER_TEMP}/snapshot.json"
          python3 - "${RUNNER_TEMP}/snapshot.json" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          identifiers = {
              capability["id"]
              for capability in value["data"]["registry"]["capabilities"]
          }
          assert identifiers.isdisjoint({"use/browser", "use/ocr", "use/box"})
          PY
      - name: Verify installed Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "installed-${{ matrix.name }}"
          Expand-Archive -Path $env:ARCHIVE -DestinationPath $root
          python "$env:GITHUB_WORKSPACE/scripts/verify-release-portability.py" `
            --release-root $root `
            --forbid-path $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "Release tree contains repository-local paths" }
          $env:ASTER_USE_HOME = Join-Path $env:RUNNER_TEMP "release-smoke-home-${{ matrix.name }}"
          $smokeCwd = Join-Path $env:RUNNER_TEMP "release-smoke-cwd-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $env:ASTER_USE_HOME,$smokeCwd | Out-Null
          Set-Location $smokeCwd
          $PSNativeCommandUseErrorActionPreference = $false
          @(
            "$root/aster-use.exe",
            "$root/LICENSE",
            "$root/README.md",
            "$root/THIRD_PARTY_NOTICES.md"
          ) | ForEach-Object { if (-not (Test-Path $_ -PathType Leaf)) { throw "Missing release file $_" } }
          foreach ($removed in @(
            "$root/aster-use-browser-driver.exe",
            "$root/ocr-models",
            "$root/ocr-skills",
            "$root/skills",
            "$root/skill-data",
            "$root/dashboard",
            "$root/extensions"
          )) {
            if (Test-Path $removed) { throw "Release archive contains removed path $removed" }
          }
          & "$root/aster-use.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "aster-use --version failed" }
          foreach ($route in @("browser", "ocr", "box")) {
            $removedRoute = & "$root/aster-use.exe" $route --json | ConvertFrom-Json
            if ($LASTEXITCODE -eq 0 -or $removedRoute.ok -or $removedRoute.error.code -ne "use.builtin_removed") {
              throw "removed built-in route $route did not fail closed"
            }
          }
          $capabilities = & "$root/aster-use.exe" capabilities --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $capabilities.ok -or @($capabilities.data.domains).Count -ne 0) {
            throw "capabilities smoke failed"
          }
          $surfaces = @($capabilities.data.externalSurfaces) -join ","
          if ($surfaces -ne "tool,mcp,okf,skill,ui") { throw "package surfaces drifted: $surfaces" }
          $snapshot = & "$root/aster-use.exe" capability snapshot --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "capability snapshot smoke failed" }
          $removedIds = @($snapshot.data.registry.capabilities | Where-Object { $_.id -in @("use/browser", "use/ocr", "use/box") })
          if ($removedIds.Count -ne 0) { throw "capability snapshot still publishes a removed built-in" }
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ${{ env.RELEASE_STAGE }}
          artifact-name: ${{ env.SBOM }}
          output-file: ${{ env.SBOM }}
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
          syft-version: ${{ env.ASTER_RELEASE_SYFT_VERSION }}
      - name: Validate SPDX SBOM
        shell: bash
        run: |
          python - "${SBOM}" <<'PY'
          import json
          import pathlib
          import sys

          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert value["spdxVersion"].startswith("SPDX-")
          assert value["SPDXID"] == "SPDXRef-DOCUMENT"
          assert value.get("packages") or value.get("files")
          PY
      - name: Attest archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Attest archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ env.ARCHIVE }}
          sbom-path: ${{ env.SBOM }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aster-use-${{ matrix.name }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.SBOM }}
          if-no-files-found: error

  reproducibility:
    name: independent-rebuild (${{ matrix.name }})
    needs: [validate, binaries]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_STRIP: symbols
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: darwin-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.source_revision }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.ASTER_RELEASE_PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.ASTER_RELEASE_RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Enable deterministic PE/COFF linking
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=/Brepro" >> "${GITHUB_ENV}"
      - name: Disable nondeterministic ELF build IDs
        if: runner.os == 'Linux'
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=-Wl,--build-id=none" >> "${GITHUB_ENV}"
      - name: Require clean independent target directories
        shell: bash
        run: |
          test ! -e target
      - name: Independently rebuild Use binaries without a build cache
        run: cargo build --release --locked --target "${{ matrix.target }}" -p aster-use
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: aster-use-${{ matrix.name }}
          path: primary-release
      - name: Compare independent Unix rebuild with the primary archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          archive="primary-release/aster-use-${version}-${{ matrix.name }}.tar.gz"
          evidence="aster-use-${version}-${{ matrix.name }}.reproducibility.json"
          python scripts/verify-release-rebuild.py \
            --archive "${archive}" \
            --platform "${{ matrix.name }}" \
            --source-revision "${{ needs.validate.outputs.source_revision }}" \
            --output "${evidence}" \
            --binary aster-use "target/${{ matrix.target }}/release/aster-use"
          echo "EVIDENCE=${evidence}" >> "${GITHUB_ENV}"
      - name: Compare independent Windows rebuild with the primary archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.validate.outputs.version }}"
          $archive = "primary-release/aster-use-$version-${{ matrix.name }}.zip"
          $evidence = "aster-use-$version-${{ matrix.name }}.reproducibility.json"
          python scripts/verify-release-rebuild.py `
            --archive $archive `
            --platform "${{ matrix.name }}" `
            --source-revision "${{ needs.validate.outputs.source_revision }}" `
            --output $evidence `
            --binary aster-use.exe "target/${{ matrix.target }}/release/aster-use.exe"
          if ($LASTEXITCODE -ne 0) { throw "Independent release rebuild did not match" }
          "EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Attest independent rebuild evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ env.EVIDENCE }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aster-use-${{ matrix.name }}-reproducibility
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error

  publish-crates:
    name: Publish typed Rust crates
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.qualification }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.source_revision }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.ASTER_RELEASE_RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Publish Use-owned Core, Extension, and facade crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          package_version() {
            local package="$1"
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er --arg package "${package}" \
                '.packages[] | select(.name == $package) | .version'
          }

          is_published() {
            local package="$1"
            local version="$2"
            curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL \
              -A "aster-use-release-check/1.0" \
              "https://crates.io/api/v1/crates/${package}/${version}" >/dev/null
          }

          publish_once() {
            local package="$1"
            local version
            version="$(package_version "${package}")"
            if is_published "${package}" "${version}"; then
              echo "${package} ${version} is already published"
              return
            fi
            cargo publish --locked -p "${package}"
          }

          wait_until_visible() {
            local package="$1"
            local version
            version="$(package_version "${package}")"
            for attempt in $(seq 1 30); do
              if is_published "${package}" "${version}"; then
                return
              fi
              echo "Waiting for ${package} ${version} on crates.io (${attempt}/30)"
              sleep 10
            done
            echo "${package} ${version} did not become visible in time" >&2
            exit 1
          }

          publish_once aster-use-core
          wait_until_visible aster-use-core
          publish_once aster-use-extension
          wait_until_visible aster-use-extension
          publish_once aster-use
          wait_until_visible aster-use

  release:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.qualification }}
    needs: [validate, binaries, reproducibility, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.source_revision }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          merge-multiple: true
      - name: Stage verified installers
        shell: bash
        run: |
          install -m 0755 install.sh artifacts/install.sh
          install -m 0644 install.ps1 artifacts/install.ps1
      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          mapfile -d '' release_files < <(
            find . -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.spdx.json' \
                 -o -name '*.reproducibility.json' \
                 -o -name 'install.sh' -o -name 'install.ps1' \) \
              -print0 | LC_ALL=C sort -z
          )
          test "${#release_files[@]}" -eq 17
          sha256sum "${release_files[@]}" | sed 's#  \./#  #' > checksums.txt
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: ${{ env.ASTER_RELEASE_COSIGN_VERSION }}
      - name: Keyless-sign and verify checksum evidence
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_REVISION: ${{ needs.validate.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          remote_revision="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 { print $1 }')"
          if test -z "${remote_revision}"; then
            remote_revision="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')"
          fi
          test "${remote_revision}" = "${RELEASE_REVISION}"
          if test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"; then
            expected_ref="${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
          else
            expected_ref="${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          fi
          test "${GITHUB_WORKFLOW_REF}" = "${expected_ref}"
          certificate_identity="https://github.com/${expected_ref}"
          cd artifacts
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/install.sh
            artifacts/install.ps1
            artifacts/checksums.txt
            artifacts/checksums.txt.sigstore.json
            artifacts/*.spdx.json
            artifacts/*.reproducibility.json
