[package]
name = "aster-sag"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Local event-entity retrieval over aster-vec with query-time expansion and original evidence"

[dependencies]
aster-vec = { path = "../vec" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
