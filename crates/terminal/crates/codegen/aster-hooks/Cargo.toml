[package]
license = "Apache-2.0"
name = "aster-hooks"
version = "0.1.0"
description = "Runtime hook system for Aster Code — file-based discovery, command execution, and policy enforcement"
edition = "2024"
publish = false

[dependencies]
fastrand = {version = "2"}
regex = {workspace = true}
reqwest = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
shellexpand = {workspace = true}
strum = {workspace = true}
thiserror = {workspace = true}
tokio = {version = "1", features = ["full", "process", "rt", "macros", "time"]}
toml = {workspace = true}
tracing = {workspace = true}
url = {workspace = true}
# Child-network restriction on hook command spawns; enforce is feature-unified
# from the binary crate, matching the other consumers.
aster-tools = {path = "../aster-tools"}
aster-sandbox = {default-features = false, path = "../aster-sandbox"}
aster-config = {path = "../aster-config"}
aster-dirs = {path = "../aster-dirs"}
aster-extra-ca = {path = "../aster-extra-ca"}

[dev-dependencies]
tempfile = {workspace = true}
tokio = {workspace = true}

[lints]
workspace = true