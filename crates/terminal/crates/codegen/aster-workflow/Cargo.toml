[package]
license = "Apache-2.0"
name = "aster-workflow"
version = "0.1.0"
description = "Rhai-scripted dynamic workflow engine: scripts orchestrate agents through a host channel"
edition = "2024"
publish = false

[dependencies]
rhai = {version = "1.25", features = ["serde"]}
serde = {workspace = true}
serde_json = {workspace = true}
sha2 = {version = "0.10", features = ["force-soft"]}
strum = {workspace = true}
thiserror = {workspace = true}
tokio = {version = "1", features = ["full", "sync", "rt"]}
tokio-util = {workspace = true}
tracing = {workspace = true}

[target.'cfg(unix)'.dependencies]
libc = {workspace = true}

[dev-dependencies]
tempfile = {workspace = true}
tokio = {workspace = true}

[lints]
workspace = true
