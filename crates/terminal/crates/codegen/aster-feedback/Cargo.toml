[package]
license = "Apache-2.0"
name = "aster-feedback"
version = "0.1.0"
description = "Shared feedback taxonomy, durable local draft storage, and the session trace archive builder for Aster Code"
edition = "2024"
publish = false

[dependencies]
flate2 = {workspace = true}
fs2 = {workspace = true}
same-file = {version = "1"}
schemars = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
strum = {workspace = true}
tar = {workspace = true}
tempfile = {workspace = true}
thiserror = {workspace = true}
uuid = {version = "1", features = ["serde", "v4", "v5", "v7"]}
walkdir = {workspace = true}

[target.'cfg(unix)'.dependencies]
libc = {workspace = true}

[lints]
workspace = true
