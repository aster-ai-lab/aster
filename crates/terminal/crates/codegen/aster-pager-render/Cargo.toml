[package]
name = "aster-pager-render"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
publish = false

[dependencies]
# TTY safety
dunce = {workspace = true}

# Rendering
ratatui = {version = "0.29", features = ["crossterm", "unstable-widget-ref", "unstable-backend-writer"]}
ratatui-core = {version = "0.1"}
crossterm = {workspace = true}
textwrap = {workspace = true}
regex = {workspace = true}
unicode-bidi = {version = "0.3"}
unicode-bidi-mirroring = {version = "0.4"}
unicode-width = {workspace = true}
unicode-segmentation = {workspace = true}
linkify = {version = "0.10"}
tui-scrollbar = {version = "0.2"}

# Markdown / syntax highlighting
syntect = {workspace = true}
anstyle = {version = "1.0"}
supports-color = {version = "3.0"}

# Data
serde = {workspace = true}
serde_json = {workspace = true}
chrono = {workspace = true}
toml = {workspace = true}
toml_edit = {version = "0.22", features = ["serde"]}
documented = {version = "0.9"}

# VTE terminal emulation for native rendering of command output (SGR, cursor, \r)
vte = {version = "0.15.0"}

# System appearance detection (dark/light mode)
dark-light = "2"

# Utilities
strum = {workspace = true}
anyhow = {workspace = true}
tokio = {version = "1", features = ["full", "sync", "rt", "macros", "rt-multi-thread", "signal", "io-util", "io-std"]}
tracing = {workspace = true}

# Prompt text input

# ACP
agent-client-protocol = {workspace = true}

# Base64 encoding for image data
base64 = {workspace = true}

# Content fingerprint of pasted rasters for the clipboard_image_paste event
blake3 = {workspace = true}

# Image decoding/resizing for clipboard image validation before send
image = {version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "gif", "webp"]}

# ID generation
uuid = {workspace = true}

# Path computation
shellexpand = {workspace = true}

# Parsing
url = {workspace = true}

# Hot-reload config (dev mode)
notify = {workspace = true, optional = true}

# libc: poll/read for non-blocking terminal reads in theme/osc11.rs.
aster-dirs = {path = "../aster-dirs"}
aster-gboom = {path = "../aster-gboom"}
aster-paths = {path = "../aster-paths"}
aster-tools = {path = "../aster-tools"}
aster-telemetry = {path = "../aster-telemetry"}
aster-workspace = {default-features = false, path = "../aster-workspace"}
aster-shared = {path = "../aster-shared"}
aster-config = {path = "../aster-config"}
aster-ratatui-inline = {path = "../aster-ratatui-inline"}
aster-ratatui-textarea = {path = "../aster-ratatui-textarea"}
aster-markdown = {path = "../aster-markdown"}
aster-tty-utils = {path = "../aster-tty-utils"}
[target.'cfg(unix)'.dependencies]
libc = {workspace = true}

# EnumDisplaySettingsW for primary-display refresh probe (host/display_refresh);
# ShellExecuteW for opening URLs without cmd.exe (link_opener).
[target.'cfg(windows)'.dependencies]
windows-sys = {version = "0.59", features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]}

[dev-dependencies]
pretty_assertions = {workspace = true}
serial_test = {workspace = true}
tempfile = {workspace = true}

[features]
# Exposes `#[cfg(test)]` test-only helpers (mock setters, test guards,
# deterministic pinning) to downstream crates' test builds. Enabled by
test-support = []
# CI builds a single shared rlib variant per crate, so the pager's CI
# test target links the same render lib as production. Enabling the test-only
# helpers in the CI default set keeps them present for the pager test while
# leaving cargo's `default` (and thus cargo production builds) without them.
# The helpers are inert unless their mock setters are called.
default-bazel = ["test-support"]
