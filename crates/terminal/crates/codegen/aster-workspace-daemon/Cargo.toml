[package]
license = "Apache-2.0"
name = "aster-workspace-daemon"
version = "0.1.0"
description = "Process lifecycle for the workspace-server daemon: self-daemonization, single-instance pidfile locking, and preview-proxy child supervision"
edition = "2024"
publish = false

[dependencies]
clap = {workspace = true}
fs2 = {workspace = true}
prometheus = {workspace = true}
reqwest = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
strum = {workspace = true}
tokio = {version = "1", features = ["full", "macros", "process", "rt", "sync", "time"]}
tracing = {workspace = true}
# Metric donation sink for the preview-proxy metrics scraper.
# reset_oom_score_adj in the preview-proxy pre_exec hook.

# fork/setsid/dup2/chdir on the self-daemonize path, and PDEATHSIG on the
# supervised preview-proxy child.
aster-tty-utils = {path = "../aster-tty-utils"}
aster-computer-hub-sdk = {features = ["metrics"], path = "../../common/aster-computer-hub-sdk"}
[target.'cfg(unix)'.dependencies]
libc = {workspace = true}

# SetStdHandle on the Windows self-daemonize path, plus the predecessor
# open/terminate calls behind the pidfile takeover.
[target.'cfg(windows)'.dependencies]
windows = {workspace = true}

[dev-dependencies]
tempfile = {workspace = true}
tokio = {version = "1", features = ["full", "io-util", "net", "rt-multi-thread"]}

[lints]
workspace = true
