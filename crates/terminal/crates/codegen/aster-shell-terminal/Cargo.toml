[package]
license = "Apache-2.0"
name = "aster-shell-terminal"
version = "0.1.0"
description = "Local, ACP, and PTY terminal runners extracted from aster-shell so they compile in parallel."
edition = "2024"
publish = false

[dependencies]
agent-client-protocol = {workspace = true}
async-trait = {workspace = true}
base64 = {workspace = true}
chrono = {workspace = true}
futures = {workspace = true}
portable-pty = {workspace = true}
process-wrap = {version = "=9.0.0", features = ["tokio1", "job-object", "creation-flags"]}
serde = {workspace = true}
serde_json = {workspace = true}
shlex = {version = "1"}
thiserror = {workspace = true}
tokio = {version = "1", features = ["full", "fs", "io-util", "macros", "process", "sync", "time"]}
tracing = {workspace = true}
uuid = {version = "1", features = ["serde", "v4", "v5", "v7"]}
aster-tty-utils = {path = "../aster-tty-utils"}
aster-workspace = {default-features = false, path = "../aster-workspace"}
aster-tools = {path = "../aster-tools"}
aster-sandbox = {default-features = false, path = "../aster-sandbox"}
aster-paths = {path = "../aster-paths"}
aster-config = {path = "../aster-config"}
aster-acp-lib = {path = "../aster-acp-lib"}

[target.'cfg(unix)'.dependencies]
libc = {workspace = true}

[target.'cfg(windows)'.dependencies]
windows = {workspace = true}

[dev-dependencies]
tempfile = {workspace = true}
tokio = {version = "1", features = ["full", "test-util"]}

[lints]
workspace = true
