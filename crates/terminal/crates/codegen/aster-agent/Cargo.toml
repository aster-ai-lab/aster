[package]
license = "Apache-2.0"
name = "aster-agent"
version = "0.1.0"
description = "Agent builder, definition parsing, and system prompt assembly"
edition = "2024"
publish = false

[dependencies]
dunce = {workspace = true}
minijinja = {version = "2", features = ["custom_syntax"]}
git2 = {workspace = true}
regex = {workspace = true}
serde = {workspace = true}
serde_yaml = {workspace = true}
serde_json = {workspace = true}
tokio = {version = "1", features = ["full", "rt", "macros", "sync"]}
tracing = {workspace = true}
chrono = {workspace = true}
fs2 = {workspace = true}
ignore = {workspace = true}
sha2 = {version = "0.10", features = ["force-soft"]}
strum = {workspace = true}
thiserror = {workspace = true}
zeroize = "1"
aster-tool-types = {path = "../../common/aster-tool-types"}
aster-dirs = {path = "../aster-dirs"}
aster-config = {path = "../aster-config"}
aster-token-estimation = {path = "../aster-token-estimation"}
aster-tty-utils = {path = "../aster-tty-utils"}
aster-tools = {path = "../aster-tools"}
aster-telemetry = {path = "../aster-telemetry"}
aster-sampling-types = {path = "../aster-sampling-types"}
aster-hooks = {path = "../aster-hooks"}

[features]
default = []
default-bazel = []

[dev-dependencies]
tempfile = {workspace = true}
serde_json = {workspace = true}
serial_test = {workspace = true}

[lints]
workspace = true
