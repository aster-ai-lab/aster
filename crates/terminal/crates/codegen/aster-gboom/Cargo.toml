[package]
name = "aster-gboom"
version = "0.1.0"
license = "Apache-2.0"
description = "The /gboom easter-egg raycaster game for the grok CLI pager"
edition = "2024"
publish = false

[dependencies]
crossterm = {version = "0.28"}
image = {workspace = true}

[features]
# Exposes test-only helpers (e.g. `GboomState::any_movement_held`) to
# downstream crates' test builds. Enabled by `aster-pager`'s
test-support = []
# CI builds a single shared rlib variant per crate; keep the test-only
# helpers present for the pager's CI test target (see aster-pager-render
# for the full rationale). The helpers are inert unless called.
default-bazel = ["test-support"]

[lints]
workspace = true
