[package]
license = "Apache-2.0"
name = "aster-sampler"
version = "0.1.0"
description = "Actor-based sampling/inference layer for Aster grok (HTTP streaming + retry, no shell coupling)"
edition = "2024"
publish = false

[dependencies]
# Internal

# External
async-openai = {workspace = true}
async-stream = {workspace = true}
blake3 = {workspace = true}
chrono = {version = "0.4", features = ["serde"]}
eventsource-stream = {version = "0.2"}
futures-util = {workspace = true}
indexmap = {workspace = true}
reqwest = {version = "0.12", features = ["rustls-tls", "stream", "json", "multipart", "http2", "blocking", "socks", "rustls-tls-native-roots"], default-features = false}
serde = {workspace = true}
serde_json = {workspace = true}
strum = {workspace = true}
tokio = {version = "1", features = ["full", "rt", "macros", "time", "sync"]}
tokio-util = {workspace = true}
tracing = {workspace = true}
uuid = {workspace = true}
zstd = {workspace = true}
aster-version = {path = "../aster-version"}
aster-sampling-types = {path = "../aster-sampling-types"}
aster-extra-ca = {path = "../aster-extra-ca"}
aster-auth = {path = "../aster-auth"}

[dev-dependencies]
# Mock HTTP server for actor / request_task integration tests.
axum = {workspace = true}
axum-server = {workspace = true}
rcgen = {workspace = true}
rustls = {workspace = true}
tracing-subscriber = {version = "0.3.23", default-features = false, features = ["env-filter", "smallvec", "tracing-log", "std", "ansi", "registry"]}
# Shared SSE generators for the happy-path mock payloads.
# `start_paused = true` for deterministic timeout testing; `net` for
# `TcpListener::bind` in the mock server harness.
tokio = {version = "1", features = ["full", "rt", "macros", "time", "sync", "test-util", "net", "rt-multi-thread"]}
aster-test-support = {path = "../aster-test-support"}

[features]
# Cargo release builds omit the mock constructor. Bazel enables this via
# `default-bazel` so shell tests link the same rlib.
test-support = []
default-bazel = ["test-support"]

[lints]
workspace = true
