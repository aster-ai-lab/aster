[package]
name = "aster-tty-utils"
version = "0.1.0"
license = "Apache-2.0"
description = "Lightweight process-spawning utilities for TTY safety — detach from controlling terminal, suppress interactive pagers, process-group lifecycle"
edition = "2024"
publish = false

[dependencies]
tokio = {version = "1", features = ["full", "process", "rt", "time"]}

[target.'cfg(unix)'.dependencies]
nix = {workspace = true}
libc = {workspace = true}

[target.'cfg(windows)'.dependencies]
windows = {workspace = true}

[lints]
workspace = true
