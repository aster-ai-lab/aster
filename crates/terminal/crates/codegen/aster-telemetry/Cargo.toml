[package]
license = "Apache-2.0"
name = "aster-telemetry"
version = "0.1.0"
description = "Telemetry engine: product events + Mixpanel emission + Sentry error reporting for Aster Code sessions"
authors = ["Aster"]
edition = "2024"
publish = false

[features]
default = []
default-bazel = []
memory-log = []

[dependencies]
anyhow = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
strum = {workspace = true}
tracing = {workspace = true}
tracing-appender = "0.2.4"
tracing-chrome = "0.7.2"
tracing-subscriber = {version = "0.3.23", default-features = false, features = ["env-filter", "smallvec", "tracing-log", "std", "ansi", "fmt", "json", "time"]}
chrono = {workspace = true}
git2 = {workspace = true}
reqwest = {workspace = true}
sentry = {version = "0.42.0", default-features = false, features = [
    "panic",
    "anyhow",
    "tracing",
    "backtrace",
    "contexts",
    "reqwest",
    "rustls",
    "debug-images",
]}
# Single cross-edge: `events::ToolCallCompleted.outcome` reuses
# `aster_session_events::types::ToolOutcome` so the local event log and
# the product telemetry event share the same enum surface.
# `session_metrics::TraceUploadReason::from_upload_method` matches on the shared
# `UploadMethod` enum (small, dependency-light types crate) so the reason->wire
# mapping lives next to the trace-upload lifecycle events it labels.
whoami = {version = "1.4"}
uuid = {version = "1", features = ["serde", "v4", "v5", "v7"]}
obfstr = {workspace = true, optional = true}
mid = "4.0.0"
tokio = {version = "1", features = ["full", "macros", "sync", "rt", "time"]}
parking_lot = {workspace = true}
# OTEL foundation: OTLP HTTP client + span layer/provider + trace-context + shared redaction.
opentelemetry = {workspace = true}
opentelemetry_sdk = {version = "0.32.1", features = ["spec_unstable_metrics_views", "experimental_logs_batch_log_processor_with_async_runtime", "experimental_metrics_periodicreader_with_async_runtime", "rt-tokio-current-thread"]}
# `tls-aws-lc` compiles opentelemetry-otlp's TLS support for the gRPC
# transport. The workspace default is only `tls-roots`, which since otlp 0.32
# no longer implies a TLS provider feature — without one, every `https://`
# gRPC collector endpoint is rejected at exporter build time (GB-4580).
# aws-lc matches the TLS backend the workspace `tonic` already uses.
opentelemetry-otlp = {version = "0.32", features = ["grpc-tonic", "reqwest-blocking-client", "tls-roots", "tls-aws-lc"]}
# Embedded Mozilla trust anchors for the gRPC TLS fallback: keeps `https://`
# collectors working on hosts with no readable system CA store (parity with
# the HTTP transport's embedded-roots reqwest client in `otlp_http.rs`).
webpki-roots = {version = "0.26"}
# Re-encodes the validated GROK_EXTRA_CA_BUNDLE DERs as PEM for tonic's
# `Certificate::from_pem` (the gRPC transport's extra-CA parity with HTTP).
base64 = {workspace = true}
http = {workspace = true}
tokio-stream = {workspace = true}
aster-otel = {path = "../aster-otel"}
aster-auth = {path = "../aster-auth"}
aster-version = {path = "../aster-version"}
aster-tty-utils = {path = "../aster-tty-utils"}
aster-file-utils = {path = "../aster-file-utils"}
aster-session-events = {path = "../aster-session-events"}
aster-env = {path = "../aster-env"}
aster-dirs = {path = "../aster-dirs"}
aster-token-estimation = {path = "../aster-token-estimation"}
aster-sampler = {path = "../aster-sampler"}
aster-extra-ca = {path = "../aster-extra-ca"}
aster-config = {path = "../aster-config"}
aster-mixpanel = {path = "../aster-mixpanel"}
aster-secrets = {path = "../aster-secrets"}

[dev-dependencies]
# `#[async_trait]` on the in-process OTLP collector test fixture.
async-trait = {workspace = true}
# Pre-main unified-log redirect for this crate's own test binary.
ctor = {version = "0.4"}
tonic = {version = "0.14", features = ["tls-aws-lc", "gzip", "deflate", "zstd", "transport"]}
# Self-signed CA + server cert for the TLS collector fixture
# (tests/external_otlp_grpc_tls.rs). `rustls` pins the process-default crypto
# provider there: the test binary links both ring and aws-lc-rs, so rustls
# can't auto-select one for the server-side acceptor.
rcgen = {workspace = true}
rustls = {workspace = true}
# In-memory log/metric exporters for the external-stream wire-shape tests.
opentelemetry_sdk = {workspace = true}
# The gRPC, TLS, and HTTP over mutual TLS collector transports (tests/otlp_collector/mod.rs).
axum = {workspace = true}
axum-server = {workspace = true}
opentelemetry-proto = {version = "0.32", features = ["gen-tonic"]}
prost = {workspace = true}
tokio = {version = "1", features = ["full", "macros", "net", "rt-multi-thread", "time"]}
# The shared OTLP/HTTP collector double and its recorder (tests/external_otlp*.rs).
# Sets a symlink's own mtime (std's `set_modified` follows links) for prune tests.
filetime = {workspace = true}
tempfile = {workspace = true}
aster-test-support = {path = "../aster-test-support"}

[lints]
workspace = true
