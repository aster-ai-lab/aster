[package]
license = "Apache-2.0"
name = "aster-config"
version = "0.1.0"
description = "Shared config loading for Aster Code — grok_home, effective config (requirements > user > managed), TOML merge"
edition = "2024"
publish = false

[dependencies]
base64 = {workspace = true}
blake3 = {workspace = true}
dunce = {workspace = true}
# Shared signed deployment-config envelope contract with the cli-chat-proxy signer.
prod-mc-cli-chat-proxy-types = {path = "../../../prod/mc/cli-chat-proxy-types"}
ring = {version = "0.17"}
semver = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
shellexpand = {workspace = true}
strum = {workspace = true}
thiserror = {workspace = true}
toml = {workspace = true}
tracing = {workspace = true}
urlencoding = {workspace = true}
which = {workspace = true}

# core-foundation: read macOS MDM managed preferences (`ai.x.aster`) for the
# admin-deployed requirements layer.
aster-version = {path = "../aster-version"}
aster-tty-utils = {path = "../aster-tty-utils"}
aster-env = {path = "../aster-env"}
aster-dirs = {path = "../aster-dirs"}
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = {version = "0.10"}

[dev-dependencies]
tempfile = {workspace = true}

[features]

[lints]
workspace = true