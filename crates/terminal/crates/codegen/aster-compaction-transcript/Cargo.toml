[package]
license = "Apache-2.0"
name = "aster-compaction-transcript"
version = "0.1.0"
description = "Markdown rendering of compacted conversation segments and the on-disk segment-store naming convention"
edition = "2024"
publish = false

[dependencies]
# Section-8 scoping and keyword tokenizing for the INDEX rows.
regex = {workspace = true}
# Tool-call arguments arrive as JSON strings and are rendered per key.
serde_json = {workspace = true}
# `Display` for the detail level and the segment-read artifact kind.
strum = {workspace = true}
# `ConversationItem`, the segment view that gets rendered.
aster-sampling-types = {path = "../aster-sampling-types"}

[lints]
workspace = true
