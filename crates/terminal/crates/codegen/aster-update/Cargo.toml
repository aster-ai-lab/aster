[package]
license = "Apache-2.0"
name = "aster-update"
version = "0.1.220-alpha.4"
edition = "2024"
publish = false

[dependencies]
dunce = {workspace = true}
anyhow = {workspace = true}
futures = {workspace = true}
indicatif = {version = "0.18"}
reqwest = {workspace = true}
semver = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
time = {version = "0.3", features = ["serde"]}
tokio = {version = "1", features = ["full", "fs", "process", "io-util", "macros", "time"]}
tracing = {workspace = true}
url = {workspace = true}
flate2 = {workspace = true}
zstd = {workspace = true}
sha2 = {version = "0.10", features = ["force-soft"]}
# MinGit archive extraction. Not `workspace = true`: the workspace pin has
# default features on (aes/bzip2/lzma/zstd); MinGit entries are only deflated.
zip = {version = "3", default-features = false, features = ["deflate-flate2"]}
aster-tty-utils = {path = "../aster-tty-utils"}
aster-version = {path = "../aster-version"}
aster-tools = {path = "../aster-tools"}
aster-telemetry = {path = "../aster-telemetry"}
aster-shell = {path = "../aster-shell"}
aster-login = {path = "../aster-login"}
aster-dirs = {path = "../aster-dirs"}
aster-extra-ca = {path = "../aster-extra-ca"}

[target.'cfg(target_os = "macos")'.dependencies]
libc = {workspace = true}

[dev-dependencies]
semver = {workspace = true}
serde_json = {workspace = true}
serial_test = {workspace = true}
tempfile = {workspace = true}
time = {version = "0.3", features = ["serde"]}
tokio = {version = "1", features = ["full", "fs", "macros", "rt-multi-thread", "test-util"]}
wiremock = {workspace = true}
