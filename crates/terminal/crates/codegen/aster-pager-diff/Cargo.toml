[package]
name = "aster-pager-diff"
version = "0.1.0"
license = "Apache-2.0"
authors = ["Aster"]
description = "Diff hunk construction for the Aster Code TUI"
edition = "2024"
publish = false

[dependencies]
# Line-level diffing (`TextDiff`) and the `ChangeTag` carried by every hunk line.
similar = {workspace = true}
# `SearchReplaceEditDetail` / `SearchReplaceOutput`: the edit-tool output shapes
# the hunk builder reads.
# ACP `ToolCall` inspection for `extract_edit_hunks`.
agent-client-protocol = {workspace = true}
# Parsing `raw_output` / `Diff.meta` JSON payloads on ACP tool calls.
serde_json = {workspace = true}
# One warning when a tool call's `raw_output` fails to deserialize.
tracing = {workspace = true}
aster-tools = {path = "../aster-tools"}

[lints]
workspace = true
