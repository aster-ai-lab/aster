[package]
license = "Apache-2.0"
name = "aster-diag-server"
version = "0.1.0"
description = "In-guest diagnostics HTTP server (/ready, /statusz, /logs) for the standalone workspace-server"
edition = "2024"
publish = false

[dependencies]
anyhow = {workspace = true}
# Router/handlers for the three endpoints; pinned to the workspace version
# already used by the sibling preview proxy.
axum = {workspace = true}
serde = {workspace = true}
# `net` for the TCP/Unix listeners, `rt` for the server task and the blocking
# log tail.
tokio = {version = "1", features = ["full", "net", "rt"]}
tracing = {workspace = true}
# Build version reported on `/statusz`.
aster-version = {path = "../aster-version"}

[dev-dependencies]
# HTTP client for the endpoint contract tests.
reqwest = {workspace = true}
# JSON assertions on the endpoint response bodies; production code goes through
# `axum::Json`, which carries its own serde_json.
serde_json = {workspace = true}
tempfile = {workspace = true}
# `io-util` for the Unix-socket request the socket-mode test writes by hand,
# `macros` for `#[tokio::test]`.
tokio = {version = "1", features = ["full", "io-util", "macros"]}

[lints]
workspace = true
