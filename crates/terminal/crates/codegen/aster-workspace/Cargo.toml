[package]
license = "Apache-2.0"
name = "aster-workspace"
version = "0.1.220-alpha.4"
description = "Core host-local workspace library (FS, VCS, execution, discovery) for aster-shell and remote sampler"
edition = "2024"
publish = false

[dependencies]
anyhow = {workspace = true}
arc-swap = {workspace = true}
dunce = {workspace = true}
async-stream = {workspace = true}
async-trait = {workspace = true}
futures = {workspace = true}
fs2 = {workspace = true}
parking_lot = {workspace = true}
git2 = {workspace = true}
ignore = {workspace = true}
regex = {workspace = true}
rand = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
strum = {workspace = true}
tokio = {version = "1", features = ["full", "fs", "io-std", "macros", "process", "rt", "rt-multi-thread", "sync", "time"]}
tracing = {workspace = true}
uuid = {version = "1", features = ["serde", "v4", "v5", "v7"]}
# `DiagHandle`, held by the hub config and threaded through `connect_hub`.
# Daemon/process-lifecycle machinery for `bin/workspace_server.rs` only; the
# library never references it.
# Leaf config value types (RemoteSettings, BoolFlag) for the folder-trust decision.
toml = {version = "0.9", features = ["preserve_order"]}
dashmap = {workspace = true}
agent-client-protocol = {workspace = true}
base64 = {workspace = true}
infer = {version = "0.19.0"}
sha2 = {version = "0.10", features = ["force-soft"]}
bstr = "1.12.1"
hashbrown = "0.16.1"
nohash-hasher = "0.2.0"
rustc-hash = "2.1.1"
# Backs `file_system`'s fuzzy path picker (matcher + background daemon).
indexmap = {workspace = true}
smallvec = {version = "1"}
chrono = {workspace = true}
tree-sitter = {version = "0.26"}
tree-sitter-bash = "0.25"
url = {workspace = true}
humantime-serde = {version = "1"}
prometheus = {workspace = true}
glob = {workspace = true}
# `metrics` enables the SDK's metric-donation client (periodic Prometheus
# registry gather → OTLP → hub donation pump); see metric_donation_reporter.
reqwest = {workspace = true}
tokio-util = {workspace = true}
urlencoding = {workspace = true}
# tonic: Status/Code mapping for deploy errors in workspace_ops.
tonic = {workspace = true}
sha1 = {version = "0.10", optional = true}
zip = {version = "3", optional = true}

clap = {workspace = true}
tracing-subscriber = {workspace = true}
# "enable" required for the SDK's spans to record at all.
fastrace = {version = "0.7", features = ["enable"]}
tokio-tungstenite = {version = "0.28", features = ["rustls-tls-webpki-roots"]}
tempfile = {workspace = true}
zstd = {workspace = true}
wait-timeout = {version = "0.2"}

# Raw fd/dirent/poll calls in foreign-session capability probes, the fuzzy
# walker's rlimit guard, and the envrc reader.
aster-extra-ca = {path = "../aster-extra-ca"}
aster-tracing = {path = "../../common/aster-tracing"}
aster-fsnotify = {path = "../aster-fsnotify"}
aster-fast-worktree = {features = ["metadata"], path = "../aster-fast-worktree"}
aster-tool-types = {path = "../../common/aster-tool-types"}
aster-tool-runtime = {path = "../../common/aster-tool-runtime"}
aster-tool-protocol = {path = "../../common/aster-tool-protocol"}
aster-tty-utils = {path = "../aster-tty-utils"}
aster-telemetry = {path = "../aster-telemetry"}
aster-auth = {path = "../aster-auth"}
aster-session-events = {path = "../aster-session-events"}
aster-file-utils = {path = "../aster-file-utils"}
aster-mcp = {path = "../aster-mcp"}
aster-computer-hub-mcp-adapter = {path = "../../common/aster-computer-hub-mcp-adapter"}
aster-computer-hub-sdk = {features = ["metrics"], path = "../../common/aster-computer-hub-sdk"}
aster-hunk-tracker = {path = "../aster-hunk-tracker"}
aster-hooks = {path = "../aster-hooks"}
aster-sandbox = {default-features = false, path = "../aster-sandbox"}
aster-env = {path = "../aster-env"}
aster-fuzzy-file-search = {path = "../aster-fuzzy-file-search"}
aster-paths = {path = "../aster-paths"}
aster-codebase-graph = {path = "../aster-codebase-graph"}
aster-acp-lib = {path = "../aster-acp-lib"}
aster-config-types = {path = "../aster-config-types"}
aster-dirs = {path = "../aster-dirs"}
aster-config = {path = "../aster-config"}
aster-workspace-types = {path = "../aster-workspace-types"}
aster-workspace-daemon = {path = "../aster-workspace-daemon"}
aster-workspace-client = {path = "../aster-workspace-client"}
aster-diag-server = {path = "../aster-diag-server"}
aster-tools-api = {path = "../aster-tools-api"}
aster-tools = {path = "../aster-tools"}
aster-agent = {path = "../aster-agent"}
aster-version = {path = "../aster-version"}
[target.'cfg(unix)'.dependencies]
libc = {workspace = true}

[target.'cfg(unix)'.dev-dependencies]
nix = {workspace = true}

[[bin]]
name = "aster-workspace-server"
path = "src/bin/workspace_server.rs"

[[bin]]
name = "workspace-server-probe"
path = "src/bin/workspace_server_probe.rs"

[features]
default = ["sandbox-enforce"]
compression = []
test-support = []
test-util = []
sandbox-enforce = ["aster-sandbox/enforce"]
default-bazel = [
    "sandbox-enforce",
    ]

[dev-dependencies]
tempfile = {workspace = true}
axum = {workspace = true}
tokio = {version = "1", features = ["full", "test-util"]}
# Decode tar.gz archives produced by workspace upload helpers in tests.
flate2 = {workspace = true}
tar = {workspace = true}
aster-test-utils = {path = "../../common/aster-test-utils"}

[package.metadata.cargo-shear]
ignored = ["tokio-tungstenite"]

[lints]
workspace = true
