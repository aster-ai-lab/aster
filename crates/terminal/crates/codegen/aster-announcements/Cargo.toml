[package]
license = "Apache-2.0"
name = "aster-announcements"
version = "0.1.0"
description = "Shared announcement types, persistence, and formatting for Aster Code CLI apps"
edition = "2024"
publish = false

[features]
# TS bindings generation only (aster-work consumes the committed output);
# off by default so Bazel/CI builds never compile ts-rs. See generate.sh.
ts = ["dep:ts-rs"]

[dependencies]
chrono = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {version = "1", features = ["full", "fs"]}
tracing = {workspace = true}
ts-rs = {version = "12.0", optional = true}
aster-tools = {path = "../aster-tools"}

[dev-dependencies]
tokio = {version = "1", features = ["full", "macros", "rt"]}

[lints]
workspace = true
