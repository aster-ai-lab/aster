[package]
license = "Apache-2.0"
name = "aster-circuit-breaker"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Exposes force_half_open() and other test hooks for cross-crate tests.
test-hooks = []
# Adds `GrpcRetryPolicy` for classifying `tonic::Code` (pulls in tonic).
grpc = ["dep:tonic"]

[dependencies]
log = {workspace = true}
tonic = {workspace = true, optional = true}

[lints]
workspace = true
