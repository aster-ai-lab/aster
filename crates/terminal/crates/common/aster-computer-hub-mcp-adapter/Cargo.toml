[package]
license = "Apache-2.0"
name = "aster-computer-hub-mcp-adapter"
version = "0.1.0"
description = "Bridge between MCP servers and the Aster Computer Hub, registering MCP-discovered tools as native hub tools."
edition = "2024"
publish = false

[features]
metrics = ["dep:prometheus"]

[dependencies]
async-trait = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
tokio = {version = "1", features = ["full", "sync"]}
tracing = {workspace = true}
prometheus = {workspace = true, optional = true}
aster-computer-hub-sdk = {path = "../aster-computer-hub-sdk"}
aster-tool-types = {path = "../aster-tool-types"}
aster-tool-runtime = {path = "../aster-tool-runtime"}
aster-tool-protocol = {path = "../aster-tool-protocol"}


[dev-dependencies]
tokio = {version = "1", features = ["full", "test-util"]}
futures = {workspace = true}

[lints]
workspace = true
