[package]
license = "Apache-2.0"
name = "aster-tool-types"
version = "0.1.0"
description = "Canonical tool-description types for the Aster platform"
edition = "2024"
publish = false

[features]
# Enables `BuiltinSubagent::render_prompt` (MiniJinja rendering of the
# built-in subagent prompt bodies).
prompt-render = ["dep:minijinja"]

[dependencies]
minijinja = {version = "2.9", features = ["custom_syntax"], optional = true}
schemars = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}

[lints]
workspace = true
