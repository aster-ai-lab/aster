[package]
publish = false
name = "aster-oci-runtime"
version = "0.3.6"
edition = "2021"
license = "MIT"
description = "Cross-platform host runtime for Aster OCI workloads"

[dependencies]
aster-oci-agent-protocol = { path = "../agent-protocol" }
aster-oci-core = { path = "../core" }
aster-oci-sdk = { path = "../sdk" }
base64.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
fs2.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(target_os = "linux")'.dependencies]
aster-oci-agent = { path = "../agent" }

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
