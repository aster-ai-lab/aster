[package]
publish = false
name = "aster-oci-agent"
version = "0.3.6"
edition = "2021"
license = "MIT"
description = "Linux guest agent for Aster OCI Runtime"

[[bin]]
name = "aster-oci-agent"
path = "src/main.rs"

[dependencies]
aster-oci-agent-protocol = { path = "../agent-protocol" }
aster-oci-sdk = { path = "../sdk" }
base64.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["dir", "fs", "term"] }
seccompiler = "0.5"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syscalls = { version = "0.8", default-features = false, features = ["std", "aarch64", "arm", "x86", "x86_64"] }
tokio = { workspace = true, features = ["process", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3.20"

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
