[package]
publish = false
name = "aster-oci-krun"
version = "0.3.6"
edition = "2021"
license = "MIT"
description = "Isolated libkrun platform boundary for Aster OCI Runtime"
build = "build.rs"

[[bin]]
name = "aster-oci-krun-shim"
path = "src/main.rs"

[dependencies]
aster-oci-agent-protocol = { path = "../agent-protocol" }
aster-oci-core = { path = "../core" }
aster-oci-sdk = { path = "../sdk" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
aster-libkrun-sys.workspace = true
sha2.workspace = true
windows-sys.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = "0.2"
libloading.workspace = true
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
libc = "0.2"
libloading.workspace = true
sha2.workspace = true

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = "0.4"
xz2 = "0.1"

[dev-dependencies]
sha2.workspace = true
tar = "0.4"
tempfile = "3.20"
xz2 = "0.1"

[lints]
workspace = true
