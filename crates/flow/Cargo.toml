[package]
name = "aster-flow"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Aster"]
license = "MIT"
description = "Durable workflow engine and Rust SDK for Aster"
repository = "https://github.com/aster-ai-lab/Flow"
documentation = "https://docs.rs/aster-flow"
readme = "README.md"
keywords = ["workflow", "durable", "event-sourcing", "async", "sdk"]
categories = ["asynchronous", "development-tools"]
publish = false

[package.metadata.docs.rs]
all-features = true

[lib]
name = "aster_flow"
path = "src/lib.rs"

[features]
default = ["native-ts"]
native-ts = []
aster-event = ["dep:aster-event"]
boot = ["dep:aster-boot"]
sqlite = ["dep:aster-orm", "aster-orm/sqlite"]
postgres = ["dep:aster-orm", "aster-orm/postgres"]

[dependencies]
async-trait = "0.1"
chrono = {version = "0.4", features = ["serde"]}
futures-util = "0.3"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
serde_yaml_ng = "0.10"
semver = "1"
sha2 = "0.10"
ryu-js = "1"
thiserror = "1"
tracing = "0.1"
uuid = {version = "1", features = ["serde", "v4", "v5"]}
tokio = {version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"]}
aster-orm = {optional = true, default-features = false, path = "../orm"}
aster-event = {optional = true, default-features = false, path = "../event"}
aster-boot = {optional = true, default-features = false, features = ["queue"], path = "../boot"}

[dev-dependencies]
sha2 = "0.10"
tokio = {version = "1", features = ["macros", "rt", "sync", "time"]}
tempfile = "3"
