[package]
name = "aster-box-sdk"
version = "3.2.7"
edition = "2021"
license = "MIT"
description = "Rust SDK for aster-box direct runtime-backed management APIs."

[features]
default = []
pipeline-cli = []

[dependencies]
aster-box-core = { version = "3.2", path = "../core" }
aster-box-runtime = { version = "3.2", path = "../runtime" }
base64 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

# Thin runner that bridges any agent (aster / Claude Code / Codex) to the
# pipeline API: a line-based spec on stdin -> JSON Report on stdout.
[[bin]]
name = "aster-box-ci"
path = "src/bin/aster-box-ci.rs"
required-features = ["pipeline-cli"]

[[example]]
name = "pipeline"
path = "examples/pipeline.rs"
required-features = ["pipeline-cli"]

[[test]]
name = "integration_kvm"
path = "tests/integration_kvm.rs"
required-features = ["pipeline-cli"]

[[test]]
name = "soak_kvm"
path = "tests/soak_kvm.rs"
required-features = ["pipeline-cli"]

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
