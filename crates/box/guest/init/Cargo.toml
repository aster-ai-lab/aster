[package]
name = "aster-box-guest-init"
version = "3.2.7"
edition = "2021"
license = "MIT"
description = "Guest init process for aster-box VM with namespace isolation"

[lib]
name = "aster_box_guest_init"
path = "src/lib.rs"

[[bin]]
name = "aster-box-guest-init"
path = "src/main.rs"

[dependencies]
aster-box-core = { path = "../../core" }
aster-transport = { workspace = true }
nix = { version = "0.29", features = ["process", "sched", "mount", "signal", "socket", "term", "fs"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
clap = { version = "4.4", features = ["derive"] }

# RA-TLS (Remote Attestation TLS)
rcgen = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }

# Sealed storage
ring = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
tar = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Keep fixed cgroup layout names, descriptors, and environment keys aligned
# with the native runtime's public SDK contract.
aster-oci-sdk = { workspace = true }

[features]
default = []

[dev-dependencies]
tempfile = { workspace = true }
serial_test = "3"
