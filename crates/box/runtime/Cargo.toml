[package]
name = "aster-box-runtime"
publish = false
version = "3.2.7"
edition = "2021"
license = "MIT"
description = "MicroVM runtime engine — VM lifecycle, OCI images, attestation, networking"

[lib]
name = "aster_box_runtime"
path = "src/lib.rs"

[[example]]
name = "managed-sandbox-smoke"
path = "examples/managed_sandbox_smoke.rs"
required-features = ["vm"]

[[example]]
name = "windows-whpx-oci-qualification"
path = "examples/windows_whpx_oci_qualification.rs"
required-features = ["vm"]

[[example]]
name = "linux-kvm-oci-qualification"
path = "examples/linux_kvm_oci_qualification.rs"
required-features = ["vm"]

[[example]]
name = "linux-native-live-session-qualification"
path = "examples/linux_native_live_session_qualification.rs"
required-features = ["vm"]

[[example]]
name = "linux-kvm-live-session-qualification"
path = "examples/linux_kvm_live_session_qualification.rs"
required-features = ["vm"]

[features]
default = ["vm", "pool", "scale", "compose", "operator", "build"]
vm = []
pool = ["vm"]
scale = ["dep:axum", "compose"]
compose = ["vm"]
operator = []
build = ["dep:aster-acl"]
# Downstream product qualification may inject a real-process execution backend
# and generation-fenced connector without enabling that seam in release builds.
runtime-provider-qualification = ["vm"]

[dependencies]
aster-box-core = { version = "3.2", path = "../core" }
aster-transport = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Cryptography
sha2 = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }

# Image signature verification
p256 = { workspace = true }
x509-cert = { workspace = true }
der = { workspace = true }
spki = { workspace = true }
base64 = { workspace = true }

# HTTP client
axum = { workspace = true, optional = true }
reqwest = { workspace = true }
url = { workspace = true }

# Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Concurrency
parking_lot = { workspace = true }
dashmap = { workspace = true }

# System
libc = { workspace = true }
sysinfo = { workspace = true }
dirs = { workspace = true }

# OCI image and bundle support
oci-spec = "0.10"
aster-oci-sdk = { workspace = true }
aster-oci-core = { path = "../../oci-runtime/crates/core" }
oci-distribution = { workspace = true }
tar = "0.4"
flate2 = "1.0"
zstd = "0.13"

# Build support
tempfile = { workspace = true }
aster-acl = { workspace = true, optional = true }

# Metrics
prometheus = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Hypervisor",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# Unix userspace network proxy and peer switch. macOS uses it as the full
# network backend; Linux multiplexes peer Ethernet frames alongside passt.
aster-box-netproxy = { version = "3.2", path = "../netproxy" }

# Filesystem Snapshot fidelity
filetime = "0.2"
xattr = "1.6"

# Guest-native rootfs artifact writer. The explicit package name makes the Aster
# fork available to crates.io consumers, while the direct path keeps Git and
# workspace consumers on the same audited source. Keep the exact version
# because a writer bump is a cache-schema migration rather than a routine
# dependency update. See third_party/mkext4/ASTER_PATCHES.md.
mkext4 = { package = "aster-box-mkext4", version = "=3.2.7", path = "../third_party/mkext4" }

# TEE attestation verification
p384 = { workspace = true }
ecdsa = { workspace = true }

# RA-TLS (Remote Attestation TLS)
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }

# Sealed storage
ring = { workspace = true }

# Typed OCI model and the versioned Aster control/workload cgroup contract.
aster-oci-sdk = { workspace = true }

# Extra Dockerfile ADD archive formats. These crates build C libraries, so they
# stay off Windows where .tar/.tar.gz remain supported without a C toolchain.
bzip2 = "0.5"
xz2 = "0.1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
aster-runtime = { workspace = true }

[dev-dependencies]
rand-legacy = { package = "rand", version = "0.8" }
aster-use = { path = "../../use", default-features = false, features = ["extensions"] }
rand = { workspace = true }
bytes = { workspace = true }
tokio-stream = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
# Registry fixture tests use an in-process HTTP server even when the optional
# `scale` feature (the production axum consumer) is disabled.
axum = { workspace = true }
