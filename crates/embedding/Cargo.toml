[package]
name = "aster-embedding"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
aster-core = { path = "../code/core" }
async-trait.workspace = true
tokio-util.workspace = true
model2vec-rs = "0.3.0"
hnsw_rs = "0.3.5"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = ["bundled-assets"]
# Compile-time `include_bytes!` of potion-code-16M-v2. CLI release builds turn
# this off and ship the same files under `<prefix>/embedding/` instead.
bundled-assets = []
