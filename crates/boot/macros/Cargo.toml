[package]
name = "aster-boot-macros"
version = "0.1.2"
edition = "2021"
authors = ["Aster"]
license = "MIT"
description = "Attribute macros for aster-boot"
repository = "https://github.com/aster-ai-lab/Boot"
documentation = "https://docs.rs/aster-boot"
keywords = ["web", "framework", "macro", "nest", "adapter"]
categories = ["web-programming", "asynchronous"]
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = {version = "2", features = ["full"]}
