[package]
name = "aster-boot"
version = "0.2.0"
edition = "2021"
authors = ["Aster"]
license = "MIT"
description = "Adapter-first modular Rust web framework for Aster inspired by Nest.js"
repository = "https://github.com/aster-ai-lab/Boot"
documentation = "https://docs.rs/aster-boot"
readme = "README.md"
keywords = ["web", "framework", "modular", "nest", "adapter"]
categories = ["web-programming", "asynchronous"]
publish = false

[lib]
name = "aster_boot"
path = "src/lib.rs"

[features]
default = ["axum", "macros", "shutdown-hooks"]
auth = []
axum = ["dep:axum", "dep:http-body-util", "dep:tokio"]
cache = []
compression = ["dep:flate2"]
config = ["dep:aster-acl"]
cqrs = []
database = []
events = ["dep:aster-event"]
file-upload = ["dep:bytes", "dep:multer"]
health = []
http-client = ["dep:reqwest", "dep:tokio", "request-context"]
ilink = [
    "dep:async-trait",
    "dep:base64",
    "dep:rand",
    "dep:reqwest",
    "dep:url",
    "dep:zeroize",
]
logging = []
macros = ["dep:aster-boot-macros"]
openapi-schemas = ["dep:schemars"]
queue = ["dep:aster-lane", "dep:chrono", "dep:tokio"]
queue-postgres = ["queue", "dep:aster-orm", "dep:uuid"]
request-context = ["dep:tokio"]
grpc-transport = ["dep:prost", "dep:tokio", "dep:tonic", "dep:tonic-prost"]
kafka-transport = ["dep:chrono", "dep:rskafka", "dep:tokio"]
mqtt-transport = ["dep:rumqttc", "dep:tokio"]
nats-transport = ["dep:async-nats", "dep:tokio"]
rabbitmq-transport = ["dep:lapin", "dep:tokio"]
redis-transport = ["dep:redis", "dep:tokio"]
schedule = ["dep:chrono", "dep:cron", "dep:tokio"]
security = ["dep:sha2"]
session = ["dep:getrandom"]
shutdown-hooks = ["dep:tokio", "tokio/macros", "tokio/signal"]
static = ["dep:tokio"]
tcp-transport = ["dep:tokio"]
etcd-discovery = ["dep:etcd-client", "dep:tokio"]

[dependencies]
async-trait = {version = "0.1", optional = true}
async-nats = {version = "0.49.1", default-features = false, optional = true}
axum = {version = "0.8", features = ["ws"], optional = true}
base64 = {version = "0.22", optional = true}
bytes = {version = "1", optional = true}
chrono = {version = "0.4", optional = true}
cron = {version = "0.17.0", optional = true}
etcd-client = {version = "0.20", default-features = false, optional = true}
flate2 = {version = "1", optional = true}
futures-core = "0.3"
futures-util = "0.3"
getrandom = {version = "0.2", optional = true}
http-body-util = {version = "0.1", optional = true}
lapin = {version = "4.10.0", default-features = false, features = ["tokio"], optional = true}
multer = {version = "3", optional = true}
percent-encoding = "2"
prost = {version = "0.14.4", optional = true}
rand = {version = "0.8", optional = true}
redis = {version = "1.3.0", default-features = false, features = ["tokio-comp"], optional = true}
reqwest = {version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true}
rskafka = {version = "0.6.0", default-features = false, optional = true}
rumqttc = {version = "0.25.1", default-features = false, optional = true}
schemars = {version = "1", optional = true}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = {version = "0.10", optional = true}
thiserror = "2"
tokio = {version = "1", features = ["fs", "io-util", "net", "rt", "sync", "time"], optional = true}
tonic = {version = "0.14.6", default-features = false, features = ["codegen", "transport"], optional = true}
tonic-prost = {version = "0.14.6", optional = true}
url = {version = "2", optional = true}
uuid = {version = "1", features = ["v4"], optional = true}
zeroize = {version = "1", features = ["derive"], optional = true}
aster-orm = {default-features = false, features = ["postgres"], optional = true, path = "../orm"}
aster-lane = {default-features = false, optional = true, path = "../lane"}
aster-event = {default-features = false, optional = true, path = "../event"}
aster-boot-macros = {path = "macros", optional = true}
aster-acl = {optional = true, path = "../acl"}

[dev-dependencies]
tokio = {version = "1", features = ["macros", "rt", "sync", "time"]}
tower = {version = "0.5", features = ["util"]}

[[example]]
name = "hello"
path = "examples/hello.rs"
required-features = ["axum"]
