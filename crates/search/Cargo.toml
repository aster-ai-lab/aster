[package]
name = "a3s-search"
version = "3.4.0"
repository = "https://github.com/A3S-Lab/Search"
description = "Embeddable metasearch library and CLI with browser, HTTP/RSS, and native API sources"
edition = "2021"
license = "MIT"
authors = ["A3S Lab Team"]
publish = false

[[bin]]
name = "a3s-search"
path = "src/main.rs"

[features]
default = ["headless"]
headless = ["dep:a3s-use-browser"]
# Named alias for hosts that select the default Moli renderer explicitly.
moli = ["headless"]
# Optional Lightpanda backend (native Linux/macOS; WSL2 only on Windows).
lightpanda = ["headless", "a3s-use-browser/lightpanda"]

[dependencies]
# Async runtime

# Serialization
sha2 = {workspace = true}

# Error handling

# Logging

# Async utilities
fastrand = "2"
dirs = "6"
fs2 = {workspace = true}

# HTTP client
reqwest = {version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "socks", "stream", "cookies"]}
httpdate = "1"

# HTML parsing
scraper = "0.22"

# XML parsing for Bing's stable RSS search endpoint
quick-xml = {version = "0.38", features = ["serialize"]}

# Main article content extraction (Readability.js port, pure Rust)
dom_smoothie = "0.18"

# URL handling
url = {workspace = true}
urlencoding = {workspace = true}
base64 = {workspace = true}

# Configuration file parsing

# Shared typed rendering contracts plus the explicit Chrome/Lightpanda backends
# are supplied by the independent A3S Browser repository. The default Moli
# adapter invokes Moli's standalone CLI through the same PageRenderer contract.

# Self-update

# CLI
clap = {version = "4", features = ["derive"]}

# Logging for CLI
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
tokio = {version = "1.35", features = ["full"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = {version = "1.0", features = ["float_roundtrip"]}
thiserror = {version = "1.0"}
anyhow = {version = "1.0"}
tracing = {workspace = true}
async-trait = {workspace = true}
futures = {workspace = true}
a3s-use-browser = {optional = true, path = "../browser"}
a3s-acl = {path = "../acl"}

[dev-dependencies]
tempfile = {workspace = true}

# =============================================================================
# Release Profile — optimized for binary size
# =============================================================================
# a3s-search is a CLI/library with optional A3S Browser rendering.
# I/O-bound workload — optimize for size over speed.
#
tokio-test = {version = "0.4"}
