[package]
name = "aster-core"
version = "9.2.2"
edition = "2021"
authors = ["Aster Team"]
license = "MIT"
repository = "https://github.com/aster-ai-lab/Code"
description = "Aster Code Core - Embeddable AI agent library with tool execution"
publish = false

[lib]
name = "aster_core"
path = "src/lib.rs"

[[example]]
name = "durable_memory_semantic_refresh_benchmark"
required-features = ["durable-memory-sqlite"]

[[example]]
name = "workspace_persistent_index_benchmark"
required-features = ["aster-vec-fts"]

[[example]]
name = "workspace_persistent_index_production"
required-features = ["aster-vec-fts"]

[[example]]
name = "memory_retention_benchmark"
required-features = ["aster-vec-fts"]

[dependencies]
aster-form-core = { workspace = true }
# Internal crates
# Pin the Search release so the browser-engine and Moli adapter APIs cannot
# drift underneath the Code runtime manager.
# Pure-Rust aster-vec FTS engine for the workspace lexical index. Optional so
# minimal builds keep the portable BM25 scorer without pulling the engine.
# Async runtime
tokio = {version = "1.35", features = [
    "rt-multi-thread", "sync", "time", "io-util",
    "process", "fs", "macros"
]}
tokio-stream = {version = "0.1", features = ["net", "time"]}
tokio-util = {version = "0.7.19", features = ["codec", "rt"]}

# Serialization
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
lsp-types = "=0.97.0"
url = "=2.5.8"
percent-encoding = "2.3"
# Full JSON Schema validation for structured model output. Remote/file
# resolvers stay disabled so an untrusted schema cannot trigger ambient I/O.
jsonschema = {version = "0.47", default-features = false}
serde_yaml = {workspace = true}
toml = "0.8"

# ACL config parsing

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging (tracing only — no OTel)
tracing = {workspace = true}
tracing-subscriber = {version = "0.3", features = ["env-filter", "json"]}

# Async utilities
futures = {workspace = true}
rayon = "1.10"
async-trait = {workspace = true}
async-stream = {workspace = true}

# HTTP client for LLM APIs
reqwest = {version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"]}

# File operations
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
glob = {workspace = true}
ignore = {workspace = true}
notify = {workspace = true}
aes-gcm = "0.10"

# Diff for edit tool
similar = "2.4"

# Home directory for project memory
dirs = {workspace = true}

# Regex for template substitution
regex = "1.10"

# SHA256 for security provider
sha256 = "1.5"
sha2 = {workspace = true}

# Shell argument parsing
shell-words = "1.1"

# HTML to text/markdown conversion (web_fetch)
html2text = "0.16"
htmd = "0.5"
# PDF text extraction for web_fetch (optional; enabled by local-code).
lopdf = {version = "0.42", optional = true}
# Moli browser archive unpack (headless-search only)
zip = {version = "0.6", default-features = false, features = ["deflate"], optional = true}
flate2 = {version = "1.0", optional = true}
tar = {workspace = true, optional = true}
tempfile = "3.10"
fs2 = {workspace = true}

# Base64 for image encoding
base64 = "0.21"

# Bytes for streaming
bytes = "1.5"

# Pin for futures
pin-project-lite = "0.2"

# UUID
uuid = {version = "1.6", features = ["v4", "serde"]}

# Time handling
chrono = {version = "0.4", features = ["serde"]}
rquickjs = {version = "0.11.0", features = ["futures"]}

aster-acl = {path = "../../acl"}
aster-okf = {path = "../../okf"}
aster-vec = {optional = true, path = "../../vec"}
aster-search = {default-features = false, path = "../../search"}
aster-lane = {path = "../../lane"}
aster-durable-memory = {path = "../../memory"}
aster-common = {path = "../../common"}
aster-effect = {path = "../../effect"}
# Process-isolation boundary for BashSandbox (Seatbelt / namespaces / AppContainer).
# Pinned public kense-labs/ksandbox — not kbox (MicroVM).
ksandbox = { git = "https://github.com/kense-labs/ksandbox.git", rev = "6c7c8bddc66325480342916e0387ab6580139316" }

[target.'cfg(unix)'.dependencies]
libc = {workspace = true}

[target.'cfg(windows)'.dependencies]
windows-sys = {version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"]}

[features]
# Thin coding-harness default (`HARNESS-CONV5`): agent loop, tools, identity,
# events, and aster-vec FTS. Browser search requires an explicit profile.
default = ["local-code"]
# ---------------------------------------------------------------------------
# Release profiles (KRN-10). Embedders select a profile instead of composing
# native/runtime dependencies by hand; each profile documents the surface it
# adds over `minimal`.
# ---------------------------------------------------------------------------
# Governed agent loop, workspace tools, identity/events — no browser or
# aster-vec FTS.
minimal = []
# Minimal plus the workspace persistent aster-vec FTS lexical path, in-tree
# trigram pruning for workspace `grep` candidates, and PDF text extraction
# for `web_fetch`.
local-code = ["aster-vec-fts", "grep-trigram", "web-fetch-pdf"]
# Local code plus durable SQLite memory vectors and browser-backed web search.
scientific = ["local-code", "durable-memory-sqlite", "headless-search"]
# Alias for scientific (kept for existing profile selectors).
full = ["scientific"]
# Enable the locally durable SQLite vector index for semantic-memory hosts.
durable-memory-sqlite = ["aster-durable-memory/sqlite"]
# Enable browser-backed search plus managed browser lifecycle
# APIs. Moli is the runtime default and is downloaded on first headless use when
# no packaged or user-provided executable is available; Chrome/Chromium remains
# selectable through configuration. HTTP/RSS and native API
# search remain available when default features are disabled.
headless-search = [
    "aster-search/moli",
    "dep:zip",
    "dep:flate2",
    "dep:tar",
]
# Compile the pure-Rust aster-vec FTS adapter for workspace lexical retrieval.
aster-vec-fts = ["dep:aster-vec"]
# Enable in-tree trigram pruning for workspace `grep` candidates (tgrep-style
# fail-open filter). Exact regex matching stays owned by Code; no crates.io
# git dep (`tgrep-core` is unpublished). Included in `local-code`.
grep-trigram = []
# Extract text from PDF responses in `web_fetch` (lopdf). Included in `local-code`.
web-fetch-pdf = ["dep:lopdf"]
# Every optional surface that is safe on Linux/Windows CI hosts.
# Prefer this over `--all-features` outside macOS.
ci-all = ["full"]
# Real-model deep-case lineage (`deep_e2e_live`) plus sdk_capabilities
# op-coverage assertions. Test-compile only behind this feature so no default
# `cargo test` run hits a provider, and no coverage claim hides in
# never-compiled source.
deep-live = ["headless-search"]

[dev-dependencies]
# Deterministically advance the exponential stream-retry backoff in async tests.
tokio = {version = "1.35", features = ["test-util"]}
# HTTP mocking for hermetic transport tests. Production code does not depend
# on wiremock.
wiremock = {workspace = true}
# Self-signed cert generation for mTLS happy-path tests. Production code does
# not depend on rcgen.
rcgen = "0.13"
async-trait = {workspace = true}
# Parses the core and ACP module graphs for the production unwrap ratchet.
syn = {version = "2", features = ["full", "visit"]}
