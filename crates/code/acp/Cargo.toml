[package]
name = "a3s-code-acp"
version = "9.1.4"
edition = "2021"
authors = ["A3S Lab Team"]
license = "MIT"
description = "ACP stdio agent bridging a3s-code-core 9.1.4 to the forked grok-build pager"
publish = false

[[bin]]
name = "a3s-code-acp"
path = "src/bin/a3s-code-acp.rs"

[dependencies]
agent-client-protocol = {workspace = true}
anyhow = "1"
async-trait = {workspace = true}
rusqlite = {workspace = true}
serde_json = {workspace = true}
serde = "1"
sha2 = {workspace = true}
tokio = {version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "process", "time"]}
tokio-util = {version = "0.7", features = ["compat"]}
tracing = {workspace = true}
tracing-subscriber = {version = "0.3", features = ["env-filter", "registry"]}
uuid = {version = "1", features = ["v4"]}
url = {workspace = true}
a3s-okf = {path = "../../okf"}
a3s-acl = {path = "../../acl"}
a3s-office = {path = "../../office/crates/core"}
a3s-code-mermaid = {path = "../../terminal/crates/codegen/a3s-code-mermaid"}
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
quick-xml = "0.38"
tempfile = {workspace = true}
a3s-use-reconcile = {path = "../../use/reconcile"}
a3s-use-bge = {path = "../../bge", default-features = false, features = ["bge-m3"]}
a3s-code-core = {default-features = true, features = ["headless-search"], path = "../core"}


[dev-dependencies]
tempfile = {workspace = true}
agent-client-protocol = {workspace = true}
portable-pty = {workspace = true}
tokio = {version = "1", features = ["rt-multi-thread", "macros", "time"]}
vt100 = "0.15"
