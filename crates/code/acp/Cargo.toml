[package]
name = "aster-acp"
version = "9.2.2"
edition = "2021"
authors = ["Aster Team"]
license = "MIT"
description = "ACP stdio agent over aster-core 9.2.2 for Aster desktop hosts"
publish = false

[[bin]]
name = "aster-acp"
path = "src/bin/aster-acp.rs"
required-features = ["svg-png", "account-import"]

[dependencies]
agent-client-protocol = {workspace = true}
anyhow = "1"
chrono = {workspace = true}
aster-embedding = { path = "../../embedding", default-features = false }
async-trait = {workspace = true}
base64 = {workspace = true}
rusqlite = {workspace = true, optional = true}
serde_json = {workspace = true}
serde = "1"
sha2 = {workspace = true}
tokio = {version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "process", "time"]}
tokio-util = {version = "0.7", features = ["compat"]}
tracing = {workspace = true}
tracing-subscriber = {version = "0.3", features = ["env-filter", "registry"]}
uuid = {version = "1", features = ["v4"]}
url = {workspace = true}
aster-okf = {path = "../../okf"}
aster-acl = {path = "../../acl"}
aster-office = {path = "../../office/crates/core"}
unicode-segmentation = {workspace = true}
aster-mermaid = {path = "../../terminal/crates/codegen/aster-mermaid", optional = true}
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
quick-xml = {version = "0.38", optional = true}
tempfile = {workspace = true}
aster-use-reconcile = {path = "../../use/reconcile"}
# Explicit local-code profile (same surface as aster-core's default). Keep
# features listed so CLI/Studio release matrices do not inherit silent default
# drift.
aster-core = { default-features = false, features = ["local-code"], path = "../core" }
aster-durable-memory = {path = "../../memory"}


[dev-dependencies]
tracing-appender = "0.2.5"
aster-effect = { path = "../../effect" }
aster-form-core = { path = "../../form-core" }
tempfile = {workspace = true}
agent-client-protocol = {workspace = true}
portable-pty = {workspace = true}
tokio = {version = "1", features = ["rt-multi-thread", "macros", "time", "net"]}
vt100 = "0.15"

[features]
# Dev/Studio default bundles the Model2Vec weights. CLI release-dist builds
# omit `bundled-embedding` and load `embedding/` next to the binary instead.
default = ["svg-png", "account-import", "bundled-embedding"]
headless-search = ["aster-core/headless-search"]
svg-png = ["dep:aster-mermaid", "dep:quick-xml"]
account-import = ["dep:rusqlite"]
bundled-embedding = ["aster-embedding/bundled-assets"]
