[package]
name = "aster-okf"
version = "0.1.0"
edition = "2021"
description = "OKF v0.2 compiler shared by the encyclopedia and the local wiki"
license = "MIT"
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
lopdf = "0.42"
pdf-inspector = "1"
sha2 = {workspace = true}
zip = {version = "7.2", default-features = false, features = ["deflate"]}
aster-use-core = {path = "../use/core"}

