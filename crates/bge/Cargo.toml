[package]
name = "aster-use-bge"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
authors = ["Aster"]
rust-version = "1.82"
description = "Local BGE embedding and reranker engines for Aster Use"
keywords = ["embeddings", "rerank", "onnx", "bge", "aster"]
categories = ["science", "text-processing"]

[lib]
name = "aster_use_bge"
path = "src/lib.rs"

[[bin]]
name = "aster-use-bge"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
bge-m3 = ["dep:ort", "dep:tokenizers"]
bge-reranker-v2-m3 = ["dep:ort", "dep:tokenizers"]
cli = ["dep:clap"]

[dependencies]
aster-use-core = { path = "../use/core" }
clap = { version = "4", features = ["derive"], optional = true }
fs2 = "0.4"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["copy-dylibs", "download-binaries", "ndarray", "std"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "0.21", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

# The examples drive the engines; default-feature builds must not compile them.
[[example]]
name = "smoke"
required-features = ["bge-m3", "bge-reranker-v2-m3"]

[[example]]
name = "inspect"
required-features = ["bge-m3", "bge-reranker-v2-m3"]
