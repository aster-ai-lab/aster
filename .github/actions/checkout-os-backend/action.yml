name: Check out private OS backend sources
description: Check out the api or cloud revision pinned by the parent gitlink.
inputs:
  path:
    description: Submodule path under the repository (apps/api or apps/cloud).
    required: true
  token:
    description: Read-only token for the aster-ai-lab repositories.
    required: true
runs:
  using: composite
  steps:
    - name: Require private repository access
      shell: bash
      env:
        BACKEND_READ_TOKEN: ${{ inputs.token }}
      run: |
        if [[ -z "$BACKEND_READ_TOKEN" ]]; then
          echo '::error::Configure STUDIO_READ_TOKEN with read access to the aster-ai-lab repositories.'
          exit 1
        fi
    - name: Resolve pinned revision
      id: revision
      shell: bash
      env:
        SUBMODULE_PATH: ${{ inputs.path }}
      run: |
        test "$(git ls-tree HEAD "$SUBMODULE_PATH" | cut -d ' ' -f 1)" = 160000
        echo "sha=$(git rev-parse "HEAD:$SUBMODULE_PATH")" >> "$GITHUB_OUTPUT"
        echo "repo=aster-ai-lab/$(basename "$SUBMODULE_PATH")" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: ${{ steps.revision.outputs.repo }}
        ref: ${{ steps.revision.outputs.sha }}
        path: ${{ inputs.path }}
        token: ${{ inputs.token }}
        persist-credentials: false
