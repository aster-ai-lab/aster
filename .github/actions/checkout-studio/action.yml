name: Check out pinned workspace submodules
description: Check out the desktop revision pinned by the parent gitlink.
inputs:
  token:
    description: Read-only token for aster-ai-lab/studio.
    required: true
runs:
  using: composite
  steps:
    - name: Require private repository access
      shell: bash
      env:
        STUDIO_READ_TOKEN: ${{ inputs.token }}
      run: |
        if [[ -z "$STUDIO_READ_TOKEN" ]]; then
          echo '::error::Configure STUDIO_READ_TOKEN with read access to aster-ai-lab/studio.'
          exit 1
        fi
    - name: Resolve pinned revision
      id: revision
      shell: bash
      run: |
        # Older container Git and later build scripts need this exact runner checkout.
        git config --global --add safe.directory "${GITHUB_WORKSPACE:?}"
        test "$(git -C "$GITHUB_WORKSPACE" ls-tree HEAD apps/studio | cut -d ' ' -f 1)" = 160000
        echo "sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD:apps/studio)" >> "$GITHUB_OUTPUT"
        # Power is vendored into the parent tree (not a gitlink).
        if git -C "$GITHUB_WORKSPACE" ls-files -s -- crates/power | grep -q '^160000 '; then
          echo '::error::crates/power must be a normal tree in the parent repository, not a gitlink.'
          exit 1
        fi
        test -f "${GITHUB_WORKSPACE}/crates/power/Cargo.toml"
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: aster-ai-lab/studio
        ref: ${{ steps.revision.outputs.sha }}
        path: apps/studio
        token: ${{ inputs.token }}
        persist-credentials: false
