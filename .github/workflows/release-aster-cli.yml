name: Release aster-cli

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Publish archives already uploaded by this run. Leave empty to build them.
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: aster-cli-v0.1.2
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.artifact_run_id == '' }}
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            asset: aster-cli-v0.1.2-macos.tar.gz
          - os: ubuntu-latest
            platform: linux
            asset: aster-cli-v0.1.2-linux.tar.gz
          - os: windows-latest
            platform: windows
            asset: aster-cli-v0.1.2-windows.zip
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install protobuf just coreutils e2fsprogs llvm jq xz gnu-tar
          rustup target add aarch64-unknown-linux-musl
      - name: Install Windows protoc
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "29.3"
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $dest = Join-Path $env:RUNNER_TEMP "protoc"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest "bin")
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Check sandbox delivery contracts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 tests/cli_pair_delivery.py
          python3 tests/cli_sandbox.py
          python3 tests/cli_sandbox_smoke_test.py
          python3 tests/cli_release_workflow.py
      - name: Build locked release
        shell: bash
        run: env -u GROK_VERSION cargo build --locked --release -p aster -p a3s-code-acp
      - name: Stage macOS sandbox companions
        if: runner.os == 'macOS'
        run: python3 scripts/aster_sandbox.py stage --profile release
      - name: Package aster-cli archive
        shell: bash
        run: |
          if [[ -n "${CARGO_TARGET_DIR:-}" ]]; then
            bin_dir="${CARGO_TARGET_DIR}/release"
          else
            bin_dir="target/release"
          fi
          bash scripts/package-aster-cli.sh "${{ matrix.platform }}" "$bin_dir" "${{ matrix.asset }}"
      - name: Verify Windows pair installation and rollback
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/cli_pair_delivery.ps1 -Archive "${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # The linux archive is built on ubuntu-latest, so its binaries need the glibc of
  # that release. Kylin V10 SP1 runs glibc 2.31 and cannot start them, so this job
  # builds the same pair inside the oldest still-supported glibc that Aster targets
  # and refuses the archive if a newer symbol slips in (scripts/check-glibc-symbols.py
  # runs from scripts/package-aster-cli.sh for the `kylin` platform).
  build-kylin:
    if: ${{ inputs.artifact_run_id == '' }}
    name: kylin
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: ubuntu:20.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install container build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config protobuf-compiler \
            python3 libssl-dev
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Confirm the container glibc
        run: |
          set -euo pipefail
          version="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          echo "container glibc ${version}"
          case "$version" in
            2.31) ;;
            *) echo "error: this job must build on glibc 2.31, found ${version}" >&2; exit 1 ;;
          esac
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          rustup show active-toolchain
      - name: Build locked release
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          env -u GROK_VERSION cargo build --locked --release -p aster -p a3s-code-acp
      - name: Package aster-cli archive
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          bin_dir="${CARGO_TARGET_DIR:-target}/release"
          bash scripts/package-aster-cli.sh kylin "$bin_dir" "aster-cli-v0.1.2-kylin.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-kylin
          path: aster-cli-v0.1.2-kylin.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, build-kylin]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.build-kylin.result == 'success' || needs.build-kylin.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install release verification tools
        run: brew install coreutils
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: aster-cli-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble draft aster-cli v0.1.2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [[ ${#files[@]} -ne 4 ]]; then
            echo "expected 4 release archives, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]:-}" >&2
            exit 1
          fi
          python3 tests/cli_sandbox_smoke.py dist/aster-cli-v0.1.2-macos.tar.gz --output-dir qualification
          macos_sha="$(sha256sum -b dist/aster-cli-v0.1.2-macos.tar.gz | cut -d' ' -f1)"
          linux_sha="$(sha256sum -b dist/aster-cli-v0.1.2-linux.tar.gz | cut -d' ' -f1)"
          kylin_sha="$(sha256sum -b dist/aster-cli-v0.1.2-kylin.tar.gz | cut -d' ' -f1)"
          windows_sha="$(sha256sum -b dist/aster-cli-v0.1.2-windows.zip | cut -d' ' -f1)"
          # Compact single-line manifest: scripts/install.sh parses this exact shape.
          printf '{"version":"0.1.2","tag":"aster-cli-v0.1.2","assets":{"macos":{"name":"aster-cli-v0.1.2-macos.tar.gz","sha256":"%s"},"linux":{"name":"aster-cli-v0.1.2-linux.tar.gz","sha256":"%s"},"kylin":{"name":"aster-cli-v0.1.2-kylin.tar.gz","sha256":"%s"},"windows":{"name":"aster-cli-v0.1.2-windows.zip","sha256":"%s"}}}\n' \
            "$macos_sha" "$linux_sha" "$kylin_sha" "$windows_sha" > dist/latest.json
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            built="$(gh api "repos/${GH_REPO}/actions/runs/${ARTIFACT_RUN_ID}" --jq .head_sha)"
          else
            built="$BUILD_SHA"
          fi
          cat > notes.md <<'EOF'
          aster-cli v0.1.2

          Self-update: `aster update` now discovers the newest release from this repository's channel manifest (latest.json), verifies the archive digest, and installs the aster + a3s-code-acp pair atomically. `aster update --check` reports without touching the binaries, and `aster update --version X.Y.Z` pins an exact release. Installs from aster-cli v0.1.1 cannot self-update (their updater predates the channel); reinstall with scripts/install.sh or scripts/install.ps1.

          Highlights since v0.1.1: long-run task survival (no implicit tool-round ceilings; explicit ACL limits only), read-only settlement and typed git-observation budgets, permission postures (default/plan/auto/yolo) as session modes with a read-only research policy, native terminal forms (a3s/form/request), first-run configuration guidance, Windows host repairs (shell discovery, environment, git discovery, 8 MiB stack reserve), goal/program/durable-memory fixes, and credential hygiene (no implicit Doubao search key).

          Each archive is a locked release build of aster 0.1.2 and a3s-code-acp from this repository.
          macOS, Linux, Windows, and Kylin each have one archive. The binaries are unsigned.

          glibc floor: the linux archive needs glibc 2.32 or newer. The kylin archive is the same
          x86_64 pair built against glibc 2.31 for Kylin V10 SP1, Ubuntu 20.04, and Debian 11;
          scripts/install.sh picks it automatically from the host's glibc, and `aster update`
          follows the same rule.
          This release is Aster, built from this repository. It is not an upstream Grok CLI.
          EOF
          printf 'Built from %s.\n' "$built" >> notes.md
          # GITHUB_TOKEN can create the tag only at the default branch tip.
          if gh release view aster-cli-v0.1.2 >/dev/null 2>&1; then
            test "$(gh release view aster-cli-v0.1.2 --json isDraft --jq .isDraft)" = true
            test "$(gh release view aster-cli-v0.1.2 --json targetCommitish --jq .targetCommitish)" = "$built"
            gh release upload aster-cli-v0.1.2 "${files[@]}" dist/latest.json --clobber
          else
            gh release create aster-cli-v0.1.2 \
              --draft --target "$built" \
              --title "aster-cli v0.1.2" \
              --notes-file notes.md \
              "${files[@]}" dist/latest.json
          fi
          gh release view aster-cli-v0.1.2
      - name: Retain installed archive qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-macos-qualification
          path: qualification/
          if-no-files-found: warn
