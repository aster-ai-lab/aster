name: Release aster-cli

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Republish archives from a previously qualified run without rebuilding them.
        required: true
        type: string
      qualified_runner:
        description: Optional macOS ARM64 runner label capable of booting the packaged sandbox. Otherwise build only and run the publisher on a qualified Mac.
        required: false
        type: string
        default: ""
  push:
    tags:
      - "aster-cli-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  actions: read

concurrency:
  group: aster-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check release governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tests/release_governance.py

  # Poll for branch qualification in parallel with the platform builds so a tag
  # pushed shortly before qualify finishes still overlaps compile time.
  qualified:
    name: Verify pre-merge qualification
    needs: preflight
    if: ${{ github.ref_type == 'tag' && inputs.artifact_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require successful branch qualification for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          # Hermetic tests set ASTER_QUALIFY_WAIT_SECONDS=0 for a single attempt.
          ASTER_QUALIFY_WAIT_SECONDS: "5400"
          ASTER_QUALIFY_POLL_SECONDS: "30"
        run: |
          set -euo pipefail
          # Read the package version without loading the workspace (studio may be
          # absent on this lightweight gate job).
          version="$(python3 - <<'PY'
          from pathlib import Path
          for line in Path("apps/aster/Cargo.toml").read_text().splitlines():
              if line.startswith("version = "):
                  print(line.split('"', 2)[1])
                  break
          else:
              raise SystemExit("apps/aster/Cargo.toml is missing version")
          PY
          )"
          if [[ "$RELEASE_TAG" != "aster-cli-v${version}" ]]; then
            echo "release tag $RELEASE_TAG does not match CLI $version" >&2
            exit 1
          fi
          wait_seconds="${ASTER_QUALIFY_WAIT_SECONDS:-5400}"
          poll_seconds="${ASTER_QUALIFY_POLL_SECONDS:-30}"
          deadline=$((SECONDS + wait_seconds))
          while true; do
            successful_runs="$(gh api "repos/${GH_REPO}/actions/workflows/qualify-aster-cli.yml/runs?head_sha=${RELEASE_SHA}&event=push&status=completed&per_page=100" --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .head_branch != \"${RELEASE_TAG}\")] | length")"
            if [[ "$successful_runs" -gt 0 ]]; then
              echo "found ${successful_runs} successful pre-merge qualification run(s) for ${RELEASE_SHA}"
              exit 0
            fi
            if [[ "$SECONDS" -ge "$deadline" ]]; then
              echo "refusing release: tagged commit $RELEASE_SHA has no successful pre-merge Aster CLI qualification run" >&2
              exit 1
            fi
            echo "waiting for qualify-aster-cli on ${RELEASE_SHA} (${successful_runs} so far); retry in ${poll_seconds}s"
            sleep "$poll_seconds"
          done

  build:
    needs: preflight
    if: ${{ github.ref_type == 'tag' && inputs.artifact_run_id == '' }}
    name: windows
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CLI_ASSET_NAME: ${{ github.ref_name }}-windows.zip
      CLI_PROFILE: release-dist
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install Windows protoc
        shell: pwsh
        run: |
          $version = "29.3"
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $dest = Join-Path $env:RUNNER_TEMP "protoc"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest "bin")
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Shorten Windows Cargo home
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"
      - name: Cache CLI release dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          shared-key: aster-cli-release-dist-windows
          save-if: "true"
      - name: Build locked release
        shell: bash
        run: |
          set -euo pipefail
          env -u GROK_VERSION cargo build --locked --profile "$CLI_PROFILE" -p aster
          # CLI omits bundled-embedding; package-aster-cli.sh ships embedding/.
          env -u GROK_VERSION cargo build --locked --profile "$CLI_PROFILE" -p aster-acp \
            --no-default-features --features svg-png,account-import
      - name: Package aster-cli archive
        shell: bash
        run: |
          if [[ -n "${CARGO_TARGET_DIR:-}" ]]; then
            bin_dir="${CARGO_TARGET_DIR}/${CLI_PROFILE}"
          else
            bin_dir="target/${CLI_PROFILE}"
          fi
          bash scripts/package-aster-cli.sh windows "$bin_dir" "$CLI_ASSET_NAME"
      - name: Verify Windows pair installation and rollback
        shell: pwsh
        run: ./tests/cli_pair_delivery.ps1 -Archive "${{ env.CLI_ASSET_NAME }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-windows
          path: ${{ env.CLI_ASSET_NAME }}
          if-no-files-found: error

  # macOS CLI binaries only. Process isolation is ksandbox-in-Core; no sandbox
  # companions ship inside aster-cli archives.
  build-macos-bins:
    needs: preflight
    if: ${{ github.ref_type == 'tag' && inputs.artifact_run_id == '' }}
    name: macos-bins
    runs-on: macos-latest
    # release-dist + thin LTO routinely exceeds 90m on GHA macos-latest cold caches.
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      CLI_PROFILE: release-dist
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install macOS build tools
        run: |
          set -euo pipefail
          packages=(protobuf)
          missing=()
          for package in "${packages[@]}"; do
            if ! brew list --versions "$package" >/dev/null 2>&1; then
              missing+=("$package")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            brew install "${missing[@]}"
          fi
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Cache CLI release dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          shared-key: aster-cli-release-dist-macos-bins
          save-if: "true"
      - name: Build locked release
        shell: bash
        run: |
          set -euo pipefail
          env -u GROK_VERSION cargo build --locked --profile "$CLI_PROFILE" -p aster
          env -u GROK_VERSION cargo build --locked --profile "$CLI_PROFILE" -p aster-acp \
            --no-default-features --features svg-png,account-import
      - name: Upload macOS CLI binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-macos-bins
          path: |
            target/${{ env.CLI_PROFILE }}/aster
            target/${{ env.CLI_PROFILE }}/aster-acp
          if-no-files-found: error

  build-macos:
    needs: [build-macos-bins]
    if: ${{ github.ref_type == 'tag' && inputs.artifact_run_id == '' && !cancelled() && needs.build-macos-bins.result == 'success' }}
    name: macos
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CLI_ASSET_NAME: ${{ github.ref_name }}-macos.tar.gz
      CLI_PROFILE: release-dist
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aster-cli-macos-bins
          path: target/${{ env.CLI_PROFILE }}
      - name: Package aster-cli archive
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 "target/${CLI_PROFILE}/aster" "target/${CLI_PROFILE}/aster-acp"
          bash scripts/package-aster-cli.sh macos "target/${CLI_PROFILE}" "$CLI_ASSET_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-macos
          path: ${{ env.CLI_ASSET_NAME }}
          if-no-files-found: error

  # Linux archives are split by arch; both keep the glibc 2.31 baseline.
  build-linux:
    needs: preflight
    if: ${{ github.ref_type == 'tag' && inputs.artifact_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs_on: ubuntu-latest
            platform: linux
            protoc_asset: protoc-29.3-linux-x86_64.zip
            protoc_sha256: 3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
            cache_key: aster-cli-release-dist-linux
          - name: linux-arm64
            runs_on: ubuntu-24.04-arm
            platform: linux-arm64
            protoc_asset: protoc-29.3-linux-aarch_64.zip
            protoc_sha256: 6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32
            cache_key: aster-cli-release-dist-linux-arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    container: ubuntu:20.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
      CLI_ASSET_NAME: ${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
      CLI_PROFILE: release-dist
      CLI_PLATFORM: ${{ matrix.platform }}
      PROTOC_ASSET: ${{ matrix.protoc_asset }}
      PROTOC_SHA256: ${{ matrix.protoc_sha256 }}
    steps:
      - name: Install container build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git pkg-config \
            python3 libssl-dev unzip
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Confirm the container glibc
        shell: bash
        run: |
          set -euo pipefail
          version="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          echo "container glibc ${version}"
          case "$version" in
            2.31) ;;
            *) echo "error: this job must build on glibc 2.31, found ${version}" >&2; exit 1 ;;
          esac
      - name: Install pinned protoc
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/${PROTOC_ASSET}"
          protoc_dir="${RUNNER_TEMP}/protoc-29.3"
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${PROTOC_ASSET}" -o "$archive"
          printf '%s  %s\n' "$PROTOC_SHA256" "$archive" | sha256sum --check -
          unzip -q "$archive" -d "$protoc_dir"
          "$protoc_dir/bin/protoc" --version
          echo "$protoc_dir/bin" >> "$GITHUB_PATH"
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          rustup show active-toolchain
      - name: Cache CLI release dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          shared-key: ${{ matrix.cache_key }}
          save-if: "true"
      - name: Build locked release
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          env -u GROK_VERSION cargo build --locked --profile "$CLI_PROFILE" -p aster
          env -u GROK_VERSION cargo build --locked --profile "$CLI_PROFILE" -p aster-acp \
            --no-default-features --features svg-png,account-import
      - name: Package aster-cli archive
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          bin_dir="${CARGO_TARGET_DIR:-target}/${CLI_PROFILE}"
          bash scripts/package-aster-cli.sh "$CLI_PLATFORM" "$bin_dir" "$CLI_ASSET_NAME"
      # Kylin V10 SP1 x86_64 gets its own named asset. It is a byte-identical
      # copy of the linux archive, never a second build: the two channels cannot
      # diverge in ABI, build identity, or checksum.
      - name: Derive the Kylin x86_64 named archive
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          cp -f "$CLI_ASSET_NAME" "${GITHUB_REF_NAME}-kylin-x86_64.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-${{ matrix.platform }}
          path: ${{ env.CLI_ASSET_NAME }}
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ matrix.platform == 'linux' }}
        with:
          name: aster-cli-kylin-x86_64
          path: ${{ github.ref_name }}-kylin-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    permissions:
      contents: write
      actions: read
    needs: [preflight, qualified, build, build-macos, build-linux]
    if: ${{ inputs.qualified_runner != '' && !cancelled() && needs.preflight.result == 'success' && (inputs.artifact_run_id != '' || (github.ref_type == 'tag' && needs.qualified.result == 'success' && needs.build.result == 'success' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success')) }}
    runs-on: ${{ inputs.qualified_runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install release verification tools
        run: brew install coreutils
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: aster-cli-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Keep only the release archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          # Intermediate bin/sandbox artifacts share the aster-cli-* prefix; drop them.
          find dist -mindepth 1 -maxdepth 1 ! -name 'aster-cli-v*-macos.tar.gz' \
            ! -name 'aster-cli-v*-linux.tar.gz' ! -name 'aster-cli-v*-linux-arm64.tar.gz' \
            ! -name 'aster-cli-v*-kylin-x86_64.tar.gz' \
            ! -name 'aster-cli-v*-windows.zip' -exec rm -rf {} +
          ls -la dist
      - name: Assemble draft aster-cli
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          bash scripts/publish-aster-cli.sh
      - name: Retain installed archive qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-macos-qualification
          path: qualification/
          if-no-files-found: warn
