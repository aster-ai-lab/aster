name: Release aster-cli

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Publish archives already uploaded by this run. Leave empty to build them.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: aster-cli-v0.1.5
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ inputs.artifact_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Check product formatting and delivery contracts
        run: |
          cargo fmt -p aster -p a3s-code-core -p a3s-code-acp -- --check
          python3 tests/workspace_dependencies.py
          python3 tests/studio_checkout.py
          python3 tests/cli_pair_delivery.py
          python3 tests/cli_sandbox.py
          python3 tests/cli_sandbox_smoke_test.py
          python3 tests/cli_pair_identity.py
          python3 tests/aster_cli_linux.py
          python3 tests/cli_release_workflow.py
          python3 tests/release_governance.py

  build:
    needs: preflight
    if: ${{ inputs.artifact_run_id == '' }}
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            asset: aster-cli-v0.1.5-macos.tar.gz
          - os: windows-latest
            platform: windows
            asset: aster-cli-v0.1.5-windows.zip
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install protobuf just coreutils e2fsprogs llvm jq xz gnu-tar
          rustup target add aarch64-unknown-linux-musl
      - name: Install Windows protoc
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "29.3"
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $dest = Join-Path $env:RUNNER_TEMP "protoc"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest "bin")
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Shorten Windows Cargo home
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"
      - name: Build locked release
        shell: bash
        run: env -u GROK_VERSION cargo build --locked --release -p aster -p a3s-code-acp
      - name: Stage macOS sandbox companions
        if: runner.os == 'macOS'
        run: python3 scripts/aster_sandbox.py stage --profile release
      - name: Package aster-cli archive
        shell: bash
        run: |
          if [[ -n "${CARGO_TARGET_DIR:-}" ]]; then
            bin_dir="${CARGO_TARGET_DIR}/release"
          else
            bin_dir="target/release"
          fi
          bash scripts/package-aster-cli.sh "${{ matrix.platform }}" "$bin_dir" "${{ matrix.asset }}"
      - name: Verify Windows pair installation and rollback
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/cli_pair_delivery.ps1 -Archive "${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # One Linux archive covers the supported glibc 2.31 baseline and newer loaders.
  build-linux:
    needs: preflight
    if: ${{ inputs.artifact_run_id == '' }}
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: ubuntu:20.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install container build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git pkg-config \
            python3 libssl-dev unzip
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Confirm the container glibc
        shell: bash
        run: |
          set -euo pipefail
          version="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          echo "container glibc ${version}"
          case "$version" in
            2.31) ;;
            *) echo "error: this job must build on glibc 2.31, found ${version}" >&2; exit 1 ;;
          esac
      - name: Install pinned protoc
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/protoc-29.3-linux-x86_64.zip"
          protoc_dir="${RUNNER_TEMP}/protoc-29.3"
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip" -o "$archive"
          printf '%s  %s\n' '3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a' "$archive" | sha256sum --check -
          unzip -q "$archive" -d "$protoc_dir"
          "$protoc_dir/bin/protoc" --version
          echo "$protoc_dir/bin" >> "$GITHUB_PATH"
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          rustup show active-toolchain
      - name: Build locked release
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          env -u GROK_VERSION cargo build --locked --release -p aster -p a3s-code-acp
      - name: Package aster-cli archive
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          bin_dir="${CARGO_TARGET_DIR:-target}/release"
          bash scripts/package-aster-cli.sh linux "$bin_dir" "aster-cli-v0.1.5-linux.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-linux
          path: aster-cli-v0.1.5-linux.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    permissions:
      contents: write
      actions: read
    needs: [preflight, build, build-linux]
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || inputs.artifact_run_id != '') && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install release verification tools
        run: brew install coreutils
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: aster-cli-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble draft aster-cli v0.1.5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [[ ${#files[@]} -ne 3 ]]; then
            echo "expected 3 release archives, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]:-}" >&2
            exit 1
          fi
          python3 tests/cli_sandbox_smoke.py dist/aster-cli-v0.1.5-macos.tar.gz --output-dir qualification
          python3 tests/cli_sandbox_smoke.py dist/aster-cli-v0.1.5-macos.tar.gz --mode yolo --output-dir qualification/yolo
          macos_sha="$(shasum -a 256 -b dist/aster-cli-v0.1.5-macos.tar.gz | cut -d' ' -f1)"
          linux_sha="$(shasum -a 256 -b dist/aster-cli-v0.1.5-linux.tar.gz | cut -d' ' -f1)"
          windows_sha="$(shasum -a 256 -b dist/aster-cli-v0.1.5-windows.zip | cut -d' ' -f1)"
          # Compact single-line manifest: scripts/install.sh parses this exact shape.
          printf '{"version":"0.1.5","tag":"aster-cli-v0.1.5","assets":{"macos":{"name":"aster-cli-v0.1.5-macos.tar.gz","sha256":"%s"},"linux":{"name":"aster-cli-v0.1.5-linux.tar.gz","sha256":"%s"},"windows":{"name":"aster-cli-v0.1.5-windows.zip","sha256":"%s"}}}\n' \
            "$macos_sha" "$linux_sha" "$windows_sha" > dist/latest.json
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            built="$(gh api "repos/${GH_REPO}/actions/runs/${ARTIFACT_RUN_ID}" --jq .head_sha)"
          else
            built="$BUILD_SHA"
          fi
          cat > notes.md <<'EOF'
          aster-cli v0.1.5 — Core / ACP 9.1.6

          Image and image-only prompts now reach image-capable models. Explicit text-only models reject images before admission.
          Model context limits follow configured or documented capacities and update when switching models. Unknown capacity remains unknown in the status bar.
          Raw reasoning is folded by default and remains available on demand. Progress follows the parent turn's language; internal subagent lifecycle events no longer appear as reasoning text.
          Subagent stop requests now reach their owning session and cancel the actual child. Failed stop requests remain retryable.

          macOS archives include the verified sandbox runtime with Aster and ACP. Installation and self-update reject incomplete archives. The final installed macOS archive must execute a real sandbox command before release assets can be created or uploaded.
          Each archive contains the locked release build of Aster 0.1.5 and ACP 9.1.6 from this repository, with their shared BUILD_ID and SHA256SUMS. The binaries are unsigned.
          The Linux archive uses x86_64 glibc 2.31. Linux and Windows runtime support is not qualified by the macOS sandbox probe.
          Update with `aster update`, or inspect with `aster update --check`, then restart the TUI to use the new pair.
          EOF
          printf 'Built from %s.\n' "$built" >> notes.md
          # A rerun may extend this draft, never replace published assets.
          if gh release view aster-cli-v0.1.5 >/dev/null 2>&1; then
            test "$(gh release view aster-cli-v0.1.5 --json isDraft --jq .isDraft)" = true
            test "$(gh release view aster-cli-v0.1.5 --json targetCommitish --jq .targetCommitish)" = "$built"
            gh release upload aster-cli-v0.1.5 "${files[@]}" dist/latest.json --clobber
          else
            gh release create aster-cli-v0.1.5 \
              --draft --target "$built" \
              --title "aster-cli v0.1.5" \
              --notes-file notes.md \
              "${files[@]}" dist/latest.json
          fi
          gh release view aster-cli-v0.1.5
      - name: Retain installed archive qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-macos-qualification
          path: qualification/
          if-no-files-found: warn
