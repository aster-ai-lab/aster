name: Release aster-cli

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Republish archives from a previously qualified run without rebuilding them.
        required: true
        type: string
  push:
    tags:
      - "aster-cli-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  actions: read

concurrency:
  group: aster-cli-v0.1.4
  cancel-in-progress: false

jobs:
  qualified:
    name: Verify pre-merge qualification
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful branch qualification for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          successful_runs="$(gh api "repos/${GH_REPO}/actions/workflows/qualify-aster-cli.yml/runs?head_sha=${RELEASE_SHA}&event=push&status=completed&per_page=100" --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .head_branch != \"${RELEASE_TAG}\")] | length")"
          if [[ "$successful_runs" -eq 0 ]]; then
            echo "refusing release: tagged commit $RELEASE_SHA has no successful pre-merge Aster CLI qualification run" >&2
            exit 1
          fi

  build:
    needs: qualified
    if: ${{ github.ref_type == 'tag' }}
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            asset: aster-cli-v0.1.4-macos.tar.gz
          - os: windows-latest
            platform: windows
            asset: aster-cli-v0.1.4-windows.zip
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install protobuf just
      - name: Install Windows protoc
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "29.3"
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $dest = Join-Path $env:RUNNER_TEMP "protoc"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest "bin")
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Shorten Windows Cargo home
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"
      - name: Cache CLI release dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          shared-key: aster-cli-release-${{ matrix.platform }}
          save-if: "true"
      - name: Build locked release
        shell: bash
        run: env -u GROK_VERSION cargo build --locked --release -p aster -p a3s-code-acp
      - name: Package aster-cli archive
        shell: bash
        run: |
          if [[ -n "${CARGO_TARGET_DIR:-}" ]]; then
            bin_dir="${CARGO_TARGET_DIR}/release"
          else
            bin_dir="target/release"
          fi
          bash scripts/package-aster-cli.sh "${{ matrix.platform }}" "$bin_dir" "${{ matrix.asset }}"
      - name: Verify Windows pair installation and rollback
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/cli_pair_delivery.ps1 -Archive "${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # One Linux archive covers the supported glibc 2.31 baseline and newer loaders.
  build-linux:
    needs: qualified
    if: ${{ github.ref_type == 'tag' }}
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: ubuntu:20.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install container build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git pkg-config \
            python3 libssl-dev unzip
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Confirm the container glibc
        shell: bash
        run: |
          set -euo pipefail
          version="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          echo "container glibc ${version}"
          case "$version" in
            2.31) ;;
            *) echo "error: this job must build on glibc 2.31, found ${version}" >&2; exit 1 ;;
          esac
      - name: Install pinned protoc
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/protoc-29.3-linux-x86_64.zip"
          protoc_dir="${RUNNER_TEMP}/protoc-29.3"
          curl -fsSL --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip" -o "$archive"
          printf '%s  %s\n' '3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a' "$archive" | sha256sum --check -
          unzip -q "$archive" -d "$protoc_dir"
          "$protoc_dir/bin/protoc" --version
          echo "$protoc_dir/bin" >> "$GITHUB_PATH"
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          rustup show active-toolchain
      - name: Cache CLI release dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          shared-key: aster-cli-release-linux
          save-if: "true"
      - name: Build locked release
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          env -u GROK_VERSION cargo build --locked --release -p aster -p a3s-code-acp
      - name: Package aster-cli archive
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          bin_dir="${CARGO_TARGET_DIR:-target}/release"
          bash scripts/package-aster-cli.sh linux "$bin_dir" "aster-cli-v0.1.4-linux.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-linux
          path: aster-cli-v0.1.4-linux.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    permissions:
      contents: write
      actions: read
    needs: [qualified, build, build-linux]
    if: ${{ !cancelled() && (inputs.artifact_run_id != '' || (github.ref_type == 'tag' && needs.qualified.result == 'success' && needs.build.result == 'success' && needs.build-linux.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: aster-cli-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble draft aster-cli v0.1.4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [[ ${#files[@]} -ne 3 ]]; then
            echo "expected 3 release archives, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]:-}" >&2
            exit 1
          fi
          macos_sha="$(sha256sum -b dist/aster-cli-v0.1.4-macos.tar.gz | cut -d' ' -f1)"
          linux_sha="$(sha256sum -b dist/aster-cli-v0.1.4-linux.tar.gz | cut -d' ' -f1)"
          windows_sha="$(sha256sum -b dist/aster-cli-v0.1.4-windows.zip | cut -d' ' -f1)"
          # Compact single-line manifest: scripts/install.sh parses this exact shape.
          printf '{"version":"0.1.4","tag":"aster-cli-v0.1.4","assets":{"macos":{"name":"aster-cli-v0.1.4-macos.tar.gz","sha256":"%s"},"linux":{"name":"aster-cli-v0.1.4-linux.tar.gz","sha256":"%s"},"windows":{"name":"aster-cli-v0.1.4-windows.zip","sha256":"%s"}}}\n' \
            "$macos_sha" "$linux_sha" "$windows_sha" > dist/latest.json
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            built="$(gh api "repos/${GH_REPO}/actions/runs/${ARTIFACT_RUN_ID}" --jq .head_sha)"
          else
            built="$BUILD_SHA"
          fi
          cat > notes.md <<'EOF'
          aster-cli v0.1.4 — Core / ACP 9.1.6

          ACP now rejects image, audio, embedded resource, and resource-link prompt blocks with invalid_params instead of silently dropping them. Unsupported prompts fail before any model call, and initialization no longer advertises embedded-context prompt support.

          The embeddable SDK remains Rust-only and local to this workspace. Optional workflow features remain disabled in the default CLI/ACP build.

          Qualification covers scripted ACP conformance, including proof that unsupported content never reaches the model, plus paired CLI/ACP delivery contracts. It does not claim whole-workspace qualification or real-model Terminal Bench speed and token savings.

          Each archive contains the locked release build of aster 0.1.4 and a3s-code-acp 9.1.6 from this repository, plus their shared BUILD_ID and SHA256SUMS. The binaries are unsigned.
          The Linux archive uses one x86_64, glibc 2.31 compatibility baseline.
          Update with `aster update`, or use `aster update --check` to inspect first. Installations predating the paired updater can use scripts/install.sh or scripts/install.ps1.
          EOF
          printf 'Built from %s.\n' "$built" >> notes.md
          # A rerun may extend this draft, never replace published assets.
          if gh release view aster-cli-v0.1.4 >/dev/null 2>&1; then
            test "$(gh release view aster-cli-v0.1.4 --json isDraft --jq .isDraft)" = true
            test "$(gh release view aster-cli-v0.1.4 --json targetCommitish --jq .targetCommitish)" = "$built"
            gh release upload aster-cli-v0.1.4 "${files[@]}" dist/latest.json --clobber
          else
            gh release create aster-cli-v0.1.4 \
              --draft --target "$built" \
              --title "aster-cli v0.1.4" \
              --notes-file notes.md \
              "${files[@]}" dist/latest.json
          fi
          gh release view aster-cli-v0.1.4
