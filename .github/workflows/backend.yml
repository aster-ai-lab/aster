# Backend services CI: the OS service plane carried in this workspace
# (api, auth, billing, config, cloud, gateway, runner) plus their shared
# crates. Layered per the development standards: hermetic suites run in
# parallel, the Postgres/S3 campaigns run serially against disposable
# databases on real service containers.

name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1
  A3S_CLOUD_TEST_POSTGRES_URL: postgres://a3s_test:a3s_test@127.0.0.1:5432/postgres
  A3S_CLOUD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
  A3S_CLOUD_TEST_S3_REGION: us-east-1
  A3S_CLOUD_TEST_S3_BUCKET: a3s-test
  A3S_CLOUD_TEST_S3_ACCESS_KEY_ID: a3s-test
  A3S_CLOUD_TEST_S3_SECRET_ACCESS_KEY: a3s-test-secret

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/checkout-source
        with:
          path: apps/work
          owner: aster-ai-lab
          repository: work
          app-id: ${{ secrets.CI_SOURCE_APP_ID }}
          private-key: ${{ secrets.CI_SOURCE_APP_PRIVATE_KEY }}
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt && rustup default 1.97.1
      - run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/checkout-source
        with:
          path: apps/work
          owner: aster-ai-lab
          repository: work
          app-id: ${{ secrets.CI_SOURCE_APP_ID }}
          private-key: ${{ secrets.CI_SOURCE_APP_PRIVATE_KEY }}
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt && rustup default 1.97.1
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  hermetic:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: a3s-api
            manifest: apps/api/Cargo.toml
            source: api
            repository: api
          - package: a3s-cloud-contracts
            manifest: apps/cloud/Cargo.toml
            source: cloud
            repository: cloud
          - package: a3s-cloud-node-agent
            manifest: apps/cloud/Cargo.toml
            source: cloud
            repository: cloud
          - package: a3s-cloud-sdk
            manifest: apps/cloud/Cargo.toml
            source: cloud
            repository: cloud
          - package: a3s-auth
            manifest: Cargo.toml
          - package: a3s-billing
            manifest: Cargo.toml
          - package: a3s-config
            manifest: Cargo.toml
          - package: a3s-gateway
            manifest: Cargo.toml
          - package: a3s-gateway-runtime
            manifest: Cargo.toml
          - package: a3s-runner
            manifest: Cargo.toml
          - package: a3s-sms
            manifest: Cargo.toml
          - package: a3s-form-core
            manifest: Cargo.toml
          - package: a3s-box-runtime
            manifest: Cargo.toml
          - package: a3s-use-core
            manifest: Cargo.toml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/checkout-source
        if: matrix.source == ''
        with:
          path: apps/work
          owner: aster-ai-lab
          repository: work
          app-id: ${{ secrets.CI_SOURCE_APP_ID }}
          private-key: ${{ secrets.CI_SOURCE_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/checkout-source
        if: matrix.source != ''
        with:
          path: apps/${{ matrix.source }}
          owner: kense-labs
          repository: ${{ matrix.repository }}
          app-id: ${{ secrets.CI_SOURCE_APP_ID }}
          private-key: ${{ secrets.CI_SOURCE_APP_PRIVATE_KEY }}
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt && rustup default 1.97.1
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --manifest-path ${{ matrix.manifest }} -p ${{ matrix.package }}

  campaigns:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: a3s_test
          POSTGRES_PASSWORD: a3s_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U a3s_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      s3:
        # Archived fixture, pinned for disposable CI; never a production deployment.
        image: bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        env:
          MINIO_ROOT_USER: a3s-test
          MINIO_ROOT_PASSWORD: a3s-test-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/ready"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/checkout-source
        with:
          path: apps/api
          owner: kense-labs
          repository: api
          app-id: ${{ secrets.CI_SOURCE_APP_ID }}
          private-key: ${{ secrets.CI_SOURCE_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/checkout-source
        with:
          path: apps/cloud
          owner: kense-labs
          repository: cloud
          app-id: ${{ secrets.CI_SOURCE_APP_ID }}
          private-key: ${{ secrets.CI_SOURCE_APP_PRIVATE_KEY }}
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt && rustup default 1.97.1
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Create the campaign bucket
        run: |
          docker run --rm --network host --entrypoint /bin/bash \
            bitnamilegacy/minio-client@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158 \
            -ec "mc alias set gate $A3S_CLOUD_TEST_S3_ENDPOINT a3s-test a3s-test-secret; mc mb --ignore-existing gate/$A3S_CLOUD_TEST_S3_BUCKET"
      - name: Serial Postgres/S3 campaigns (api, node-agent, control-plane)
        run: |
          cargo test --locked --manifest-path apps/cloud/Cargo.toml -p a3s-cloud-control-plane -- --test-threads=1
          cargo test --locked --manifest-path apps/cloud/Cargo.toml -p a3s-cloud-node-agent -- --test-threads=1
          cargo test --locked --manifest-path apps/api/Cargo.toml -p a3s-api -- --test-threads=1
