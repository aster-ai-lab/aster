# Backend services CI: the OS service plane carried in this workspace
# (api, auth, billing, config, cloud, gateway, runner) plus their shared
# crates. Layered per the development standards: hermetic suites run in
# parallel, the Postgres/S3 campaigns run serially against disposable
# databases on real service containers.

name: backend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1
  A3S_CLOUD_TEST_POSTGRES_URL: postgres://a3s_test:a3s_test@127.0.0.1:5432/postgres
  A3S_CLOUD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
  A3S_CLOUD_TEST_S3_REGION: us-east-1
  A3S_CLOUD_TEST_S3_BUCKET: a3s-test
  A3S_CLOUD_TEST_S3_ACCESS_KEY_ID: a3s-test
  A3S_CLOUD_TEST_S3_SECRET_ACCESS_KEY: a3s-test-secret

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Check out pinned backend sources (api)
        uses: ./.github/actions/checkout-os-backend
        with:
          path: apps/api
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Check out pinned backend sources (cloud)
        uses: ./.github/actions/checkout-os-backend
        with:
          path: apps/cloud
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler cmake pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  hermetic:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Submodule workspaces: the package lives in apps/api or apps/cloud,
          # which keep their own Cargo workspaces and lockfiles.
          # a3s-api is deliberately absent: its suite carries live PostgreSQL
          # proofs (tobot_memory, git_store) that panic when the service is
          # unreachable, so it runs only in the campaigns job with real
          # PostgreSQL/S3 under --test-threads=1. a3s-cloud-control-plane is
          # absent for the same reason.
          - package: a3s-cloud-contracts
            submodule: apps/cloud
            test_args: --manifest-path apps/cloud/Cargo.toml -p a3s-cloud-contracts
          - package: a3s-cloud-node-agent
            submodule: apps/cloud
            test_args: --manifest-path apps/cloud/Cargo.toml -p a3s-cloud-node-agent
          - package: a3s-cloud-sdk
            submodule: apps/cloud
            test_args: --manifest-path apps/cloud/Cargo.toml -p a3s-cloud-sdk
          # Root workspace members.
          - package: a3s-auth
            test_args: -p a3s-auth
          - package: a3s-billing
            test_args: -p a3s-billing
          - package: a3s-config
            test_args: -p a3s-config
          - package: a3s-gateway
            test_args: -p a3s-gateway
          - package: a3s-gateway-runtime
            test_args: -p a3s-gateway-runtime
          - package: a3s-runner
            test_args: -p a3s-runner
          - package: a3s-sms
            test_args: -p a3s-sms
          - package: a3s-form-core
            test_args: -p a3s-form-core
          - package: a3s-box-runtime
            test_args: -p a3s-box-runtime
          - package: a3s-use-core
            test_args: -p a3s-use-core
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Check out pinned backend sources
        if: matrix.submodule
        uses: ./.github/actions/checkout-os-backend
        with:
          path: ${{ matrix.submodule }}
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler cmake pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.submodule && format('{0}/Cargo.toml', matrix.submodule) || '' }}
      - run: cargo test --locked ${{ matrix.test_args }}

  campaigns:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: a3s_test
          POSTGRES_PASSWORD: a3s_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U a3s_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler cmake pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
      - name: Check out pinned backend sources (api)
        uses: ./.github/actions/checkout-os-backend
        with:
          path: apps/api
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Check out pinned backend sources (cloud)
        uses: ./.github/actions/checkout-os-backend
        with:
          path: apps/cloud
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/api/Cargo.toml
            apps/cloud/Cargo.toml
      - name: Start the campaign object store and create its bucket
        run: |
          docker run -d --name a3s-s3 --network host \
            -e RUSTFS_ACCESS_KEY="$A3S_CLOUD_TEST_S3_ACCESS_KEY_ID" \
            -e RUSTFS_SECRET_KEY="$A3S_CLOUD_TEST_S3_SECRET_ACCESS_KEY" \
            -e RUSTFS_ADDRESS=:9000 -e RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs:1.0.0 /data
          for attempt in {1..60}; do
            if curl --fail --silent "$A3S_CLOUD_TEST_S3_ENDPOINT/health" >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs a3s-s3
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID="$A3S_CLOUD_TEST_S3_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$A3S_CLOUD_TEST_S3_SECRET_ACCESS_KEY" \
            -e AWS_MAX_ATTEMPTS=10 \
            amazon/aws-cli --endpoint-url "$A3S_CLOUD_TEST_S3_ENDPOINT" s3 mb "s3://$A3S_CLOUD_TEST_S3_BUCKET"
      - name: Serial Postgres/S3 campaigns (api, node-agent, control-plane)
        run: |
          cargo test --locked --manifest-path apps/cloud/Cargo.toml -p a3s-cloud-control-plane -- --test-threads=1
          cargo test --locked --manifest-path apps/cloud/Cargo.toml -p a3s-cloud-node-agent -- --test-threads=1
          cargo test --locked --manifest-path apps/api/Cargo.toml -p a3s-api -- --test-threads=1
      - name: Stop the campaign object store
        if: always()
        run: docker rm -f a3s-s3
