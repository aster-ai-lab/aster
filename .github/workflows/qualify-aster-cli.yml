name: Qualify aster-cli

on:
  push:
    branches: ["**"]
    paths:
      - "apps/aster/**"
      - "crates/code/**"
      - "crates/terminal/**"
      - "crates/oci-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/aster_sandbox.py"
      - "scripts/package-aster-cli.sh"
      - "scripts/publish-aster-cli.sh"
      - ".github/workflows/qualify-aster-cli.yml"
      - ".github/workflows/release-aster-cli.yml"
      - "tests/aster_cli_linux.py"
      - "tests/cli_*.py"
      - "tests/release_governance.py"
      - "tests/studio_checkout.py"
      - "tests/workspace_dependencies.py"
  pull_request:
    paths:
      - "apps/aster/**"
      - "crates/code/**"
      - "crates/terminal/**"
      - "crates/oci-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/aster_sandbox.py"
      - "scripts/package-aster-cli.sh"
      - "scripts/publish-aster-cli.sh"
      - ".github/workflows/qualify-aster-cli.yml"
      - ".github/workflows/release-aster-cli.yml"
      - "tests/aster_cli_linux.py"
      - "tests/cli_*.py"
      - "tests/release_governance.py"
      - "tests/studio_checkout.py"
      - "tests/workspace_dependencies.py"

permissions:
  contents: read

concurrency:
  group: qualify-aster-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux alone gates release tags. Host CLI coverage comes from the release
  # archive build plus the operator's pre-publish checks; a second debug
  # build+test matrix lane only added wall time without gating distribution.
  test:
    name: Aster CLI tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev bubblewrap
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Cache CLI qualification dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          shared-key: aster-cli-qualify-ubuntu-latest
          save-if: "true"
      - name: Check CLI formatting and delivery contracts
        shell: bash
        run: |
          cargo fmt -p aster -p aster-core -p aster-acp -- --check
          python3 tests/workspace_dependencies.py
          python3 tests/studio_checkout.py
          python3 tests/cli_pair_delivery.py
          python3 tests/cli_sandbox.py
          python3 tests/cli_sandbox_smoke_test.py
          python3 tests/cli_pair_identity.py
          python3 tests/aster_cli_linux.py
          python3 tests/cli_release_workflow.py
          python3 tests/release_governance.py
      - name: Build the CLI and ACP companion pair
        shell: bash
        run: cargo build --locked -p aster -p aster-acp
      - name: Test Aster CLI
        shell: bash
        run: cargo test --locked -p aster --bin aster -- --test-threads=4
