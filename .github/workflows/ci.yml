name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install protobuf just
      - name: Desktop launcher
        if: runner.os == 'macOS'
        run: python3 tests/just_work.py
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Internal dependency boundary
        run: python3 tests/workspace_dependencies.py
      - name: CLI pair delivery
        run: |
          python3 tests/cli_pair_delivery.py
          python3 tests/cli_sandbox.py
          python3 tests/cli_sandbox_smoke_test.py
          python3 tests/cli_release_workflow.py
      - name: Kylin CLI glibc baseline and channel selection
        run: python3 tests/aster_cli_kylin.py
      - name: Kylin input method launcher
        run: |
          python3 tests/kylin_input_method.py
          python3 tests/progress_bench.py
          python3 apps/studio/scripts/kylin-flatpak/test_delivery.py
      - name: Desktop package generation contracts
        run: |
          python3 -m unittest apps/studio/scripts/tests/studio_delivery_test.py apps/studio/scripts/tests/studio_product_test.py apps/studio/scripts/tests/test_document_assets.py apps/studio/scripts/tests/sandbox_assets_test.py
          python3 tests/desktop_channel_manifest.py
      - name: App icon ladder and desktop identity
        run: python3 tests/app_icon_assets.py
      - name: Shared-crate drift ratchet
        # Visibly skipped when the private submodules are not checked out;
        # enforces everywhere they are (self-hosted, credentialed runners).
        if: hashFiles('apps/api/crates/**/Cargo.toml') != '' && hashFiles('apps/cloud/crates/**/Cargo.toml') != ''
        run: python3 tests/crate_drift_report.py --baseline tests/crate_drift_baseline.json
      - name: Compile workspace and tests
        run: cargo check --locked --workspace --all-targets
      - name: Check optional harness contracts
        run: cargo check --locked -p a3s-code-core --features advanced-harness,deep-live
      - name: Build product and companion
        run: |
          cargo build --locked -p aster -p a3s-code-acp -p a3s-office-cli
      - name: Build and test desktop product identities
        run: |
          for tenant in aster toyou; do
            export A3S_TENANT_SLUG="$tenant"
            TAURI_CONFIG="$(python3 apps/studio/scripts/studio_product.py "$tenant" tauri-config)"
            export TAURI_CONFIG
            feature="$(python3 apps/studio/scripts/studio_product.py "$tenant" feature)"
            cargo build --locked -p a3s-studio --no-default-features --features "$feature"
            cargo test --locked -p a3s-studio --lib --no-default-features --features "$feature" tenant:: -- --test-threads=1
            cargo test --locked -p a3s-studio --lib --no-default-features --features "$feature" app_updater:: -- --test-threads=1
            cargo test --locked -p a3s-studio --lib --no-default-features --features "$feature" bundled_skills:: -- --test-threads=1
          done
      - name: Product and runtime tests
        run: cargo test --locked -p aster -p a3s-acl -p a3s-effect
      - name: Studio native contracts
        run: cargo test --locked -p a3s-studio-data-sqlite -p a3s-studio-desktop-contract
      - name: ACP integration
        run: cargo test --locked -p a3s-code-acp --test v912_seam
      - name: Workspace retrieval contracts
        run: |
          cargo test --locked -p a3s-code-core --lib -- tools::builtin::search workspace::retrieval::tests::hybrid_query agent_api::retrieval_tests permissions:: --test-threads=4
          cargo test --locked -p a3s-code-acp --lib -- local_embedding retrieval_seam session_setup execution_capabilities --test-threads=4
          cargo test --locked -p a3s-code-acp --test shipped_tui_e2e retrieval::shipped_retrieval_stdio -- --test-threads=1
      - name: Logo cache and rendering
        run: cargo test --locked -p a3s-code-pager --lib views::welcome
      - name: Current memory-retention contracts
        run: cargo test --locked -p a3s-code-core --lib memory_retention_tests
      - name: macOS native execution boundary
        if: runner.os == 'macOS'
        run: cargo test --locked -p a3s-code-core --lib sandbox::native::lifetime_tests

  desktop-frontend:
    strategy:
      fail-fast: false
      matrix:
        tenant: [aster, toyou]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.12.0"
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: A3S_TENANT_SLUG=${{ matrix.tenant }} STUDIO_RENDERER_DIST=.studio-package pnpm exec rsbuild build
      - name: Studio launcher contracts
        run: pnpm exec vitest run --project scripts scripts/__tests__/studioDev.test.ts scripts/__tests__/check-dependency-lockstep.test.ts
