name: Rust

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Fetch the pinned AIX test fixture
        env:
          GH_TOKEN: ${{ secrets.STUDIO_READ_TOKEN }}
        run: |
          set -euo pipefail
          ref="$(git ls-tree HEAD apps/api | awk '{print $3}')"
          test -n "$ref"
          mkdir -p apps/api/vendor/web/public/cases
          gh api "repos/kense-labs/api/contents/vendor/web/public/cases/acp-cloud-agent.aix?ref=${ref}" \
            --jq .content \
            | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' \
            > apps/api/vendor/web/public/cases/acp-cloud-agent.aix
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install protobuf just lld
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Desktop launcher
        if: runner.os == 'macOS'
        run: python3 tests/just_work.py
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: product-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install static guest targets
        run: rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl
      - name: Static guest linker hardening
        run: python3 tests/musl_linker_flags.py
      - name: Compile current static guest agents
        run: |
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          rust_lld="$(rustc --print sysroot)/lib/rustlib/$rust_host/bin/rust-lld"
          test -x "$rust_lld"
          for guest_target in aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$rust_lld" \
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="$rust_lld" \
              cargo build --locked --release --target "$guest_target" -p a3s-oci-agent --bin a3s-oci-agent
          done
      - name: Internal dependency boundary
        run: python3 tests/workspace_dependencies.py
      - name: Pinned Studio checkout ownership
        run: python3 tests/studio_checkout.py
      - name: CLI pair delivery
        run: |
          python3 tests/cli_pair_delivery.py
          python3 tests/cli_sandbox.py
          python3 tests/cli_sandbox_smoke_test.py
          python3 tests/cli_pair_identity.py
      - name: Release tag and channel governance
        run: python3 tests/release_governance.py
      - name: Linux CLI glibc baseline and installer
        run: python3 tests/aster_cli_linux.py
      - name: Kylin input method launcher
        run: |
          python3 tests/kylin_input_method.py
          python3 tests/progress_bench.py
          python3 apps/studio/scripts/kylin-flatpak/test_delivery.py
      - name: Desktop package generation contracts
        run: |
          python3 -m unittest apps/studio/scripts/tests/studio_delivery_test.py apps/studio/scripts/tests/studio_product_test.py apps/studio/scripts/tests/test_document_assets.py
          python3 tests/desktop_channel_manifest.py
      - name: App icon ladder and desktop identity
        run: python3 tests/app_icon_assets.py
      - name: Shared-crate drift ratchet
        # Visibly skipped when the private submodules are not checked out;
        # enforces everywhere they are (self-hosted, credentialed runners).
        if: hashFiles('apps/api/crates/**/Cargo.toml') != '' && hashFiles('apps/cloud/crates/**/Cargo.toml') != ''
        run: python3 tests/crate_drift_report.py --baseline tests/crate_drift_baseline.json
      - name: Compile workspace and tests
        run: cargo check --locked --workspace --all-targets
      - name: Check optional harness contracts
        run: cargo check --locked -p a3s-code-core --features advanced-harness,deep-live
      - name: Build product and companion
        run: |
          cargo build --locked -p aster -p a3s-code-acp -p a3s-office-cli
      - name: Build and test desktop product identities
        run: |
          for tenant in aster toyou; do
            export A3S_TENANT_SLUG="$tenant"
            TAURI_CONFIG="$(python3 apps/studio/scripts/studio_product.py "$tenant" tauri-config)"
            export TAURI_CONFIG
            target_dir="$(cargo metadata --locked --offline --no-deps --format-version 1 | python3 -c 'import sys,json;print(json.load(sys.stdin)["target_directory"])')"
            TAURI_CONFIG="$(python3 apps/studio/scripts/studio_product.py "$tenant" tauri-config --target-dir "$target_dir")"
            export TAURI_CONFIG STUDIO_COMPANIONS_STAGED=1
            feature="$(python3 apps/studio/scripts/studio_product.py "$tenant" feature)"
            build_args=(build --locked -p a3s-studio -p a3s-code-acp -p a3s-office-cli --no-default-features --features "a3s-studio/$feature,a3s-code-acp/default,a3s-code-acp/headless-search,a3s-office-cli/default")
            cargo "${build_args[@]}" --bin a3s-code-acp --bin a3s-office
            python3 apps/studio/scripts/studio_product.py "$tenant" stage-companions
            cargo "${build_args[@]}" --bin Studio
            cargo test --locked -p a3s-studio --lib --no-default-features --features "$feature" tenant:: -- --test-threads=1
            cargo test --locked -p a3s-studio --lib --no-default-features --features "$feature" providers:: -- --test-threads=1
            cargo test --locked -p a3s-studio --lib --no-default-features --features "$feature" agent_plane::computer_use_tests:: -- --test-threads=1
            cargo test --locked -p a3s-studio --lib --no-default-features --features "$feature" app_updater:: -- --test-threads=1
            cargo test --locked -p a3s-studio --lib --no-default-features --features "$feature" bundled_skills:: -- --test-threads=1
          done
      - name: Product and runtime tests
        run: cargo test --locked -p aster -p a3s-acl -p a3s-effect
      - name: Shell bounded continuation contracts
        run: env -u GROK_LENGTH_SALVAGE cargo test --locked -p a3s-code-shell --lib length_salvage -- --test-threads=1
      - name: Studio native contracts
        run: cargo test --locked -p a3s-studio-data-sqlite -p a3s-studio-desktop-contract
      - name: ACP integration
        run: cargo test --locked -p a3s-code-acp --test v912_seam
      - name: Local Git queries and Codex account discovery
        run: |
          cargo test --locked -p a3s-code-core --test git_read_queries
          cargo test --locked -p a3s-code-acp --test codex_account_stdio
      - name: Core long-task ownership and consent contracts
        run: |
          cargo test --locked -p a3s-code-core --lib -- agent_api::goal_facade::tests fact_control:: goal_control:: hitl:: tool_confirmation:: --test-threads=4
      - name: ACP long-task foundation contracts
        run: |
          cargo test --locked -p a3s-code-acp --test long_horizon_contracts --test long_horizon_preflight --test long_horizon_real_llm --test long_horizon_rust_stdio
          cargo test --locked -p a3s-code-acp --features headless-search --test long_horizon_contracts --test long_horizon_preflight --test long_horizon_real_llm --test long_horizon_rust_stdio
      - name: macOS ACP wire conformance
        if: runner.os == 'macOS'
        run: cargo test --locked -p a3s-code-acp --test acp_conformance_stdio
      - name: Search feature contracts
        run: |
          cargo test --locked -p a3s-code-core --lib tools::builtin::web_search::tests
          cargo test --locked -p a3s-code-core --features headless-search --lib tools::builtin::web_search::tests
      - name: Workspace retrieval contracts
        run: |
          cargo test --locked -p a3s-code-core --lib -- tools::builtin::search workspace::retrieval::tests::hybrid_query agent_api::retrieval_tests permissions:: --test-threads=4
          cargo test --locked -p a3s-code-acp --lib -- local_embedding retrieval_seam session_setup execution_capabilities host_context registration_cleanup --test-threads=4
          cargo test --locked -p a3s-code-acp --test shipped_tui_e2e retrieval::shipped_retrieval_stdio -- --test-threads=1
      - name: Logo cache and rendering
        run: cargo test --locked -p a3s-code-pager --lib views::welcome
      - name: Current memory-retention contracts
        run: cargo test --locked -p a3s-code-core --lib memory_retention_tests
      - name: macOS native execution boundary
        if: runner.os == 'macOS'
        run: cargo test --locked -p a3s-code-core --lib sandbox::native::lifetime_tests

  desktop-frontend:
    strategy:
      fail-fast: false
      matrix:
        tenant: [aster, toyou]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.12.0"
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: A3S_TENANT_SLUG=${{ matrix.tenant }} STUDIO_RENDERER_DIST=.studio-package pnpm exec rsbuild build
      - name: Studio launcher contracts
        run: pnpm exec vitest run --project scripts scripts/__tests__/studioDev.test.ts scripts/__tests__/check-dependency-lockstep.test.ts
