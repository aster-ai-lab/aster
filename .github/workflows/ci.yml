name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/checkout-source
        with:
          path: apps/work
          owner: aster-ai-lab
          repository: work
          app-id: ${{ secrets.CI_SOURCE_APP_ID }}
          private-key: ${{ secrets.CI_SOURCE_APP_PRIVATE_KEY }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install protobuf just
      - name: Work launcher
        if: runner.os == 'macOS'
        run: python3 tests/just_work.py
      - name: Install pinned toolchain
        run: rustup component add rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Private source pin contract
        run: python3 tests/ci_source_checkout.py
      - name: Internal dependency boundary
        run: python3 tests/workspace_dependencies.py
      - name: CLI pair delivery
        run: python3 tests/cli_pair_delivery.py
      - name: Desktop updater release boundary
        run: python3 tests/desktop_update.py
      - name: Kylin input method launcher
        run: |
          python3 tests/kylin_input_method.py
          python3 tests/kylin_onefile.py
          bash apps/work/scripts/kylin-flatpak/install-on-kylin.sh --self-test
      - name: Shared-crate drift ratchet
        # Visibly skipped when the private submodules are not checked out;
        # enforces everywhere they are (self-hosted, credentialed runners).
        if: hashFiles('apps/api/crates/**/Cargo.toml') != '' && hashFiles('apps/cloud/crates/**/Cargo.toml') != ''
        run: python3 tests/crate_drift_report.py --baseline tests/crate_drift_baseline.json
      - name: Compile workspace and tests
        run: cargo check --locked --workspace --all-targets
      - name: Check optional harness contracts
        run: cargo check --locked -p a3s-code-core --features advanced-harness,deep-live
      - name: Build product and companion
        run: |
          cargo build --locked -p aster -p a3s-code-acp -p a3s-office-cli
          cargo build --locked -p a3s-studio
      - name: Product and runtime tests
        run: cargo test --locked -p aster -p a3s-acl -p a3s-effect
      - name: Real CLI and ACP lifecycle
        run: python3 tests/cli_acp_lifecycle.py --phase after --binaries target/debug --evidence "$RUNNER_TEMP/headless-lifecycle"
      - name: Studio native contracts
        run: cargo test --locked -p a3s-studio-data-sqlite -p a3s-studio-desktop-contract
      - name: ACP integration
        run: cargo test --locked -p a3s-code-acp --test v912_seam
      - name: HTTP and startup lifecycle regressions
        run: |
          cargo test --locked -p a3s-code-core --lib llm::http::
          cargo test --locked -p a3s-code-pager --lib headless::tests::
          cargo test --locked -p a3s-code-pager --lib acp::startup_deadline_tests::
      - name: Work native artifact delivery through ACP
        run: cargo test --locked -p aster-dream --lib real_acp_program_code_profile_delivers_nested_native_artifact_and_saved_bytes -- --ignored --test-threads=1
      - name: Logo cache and rendering
        run: cargo test --locked -p a3s-code-pager --lib views::welcome
      - name: Current memory-retention contracts
        run: cargo test --locked -p a3s-code-core --lib memory_retention_tests
      - name: macOS native execution boundary
        if: runner.os == 'macOS'
        run: cargo test --locked -p a3s-code-core --lib sandbox::native::lifetime_tests

  work-frontend:
    strategy:
      fail-fast: false
      matrix:
        app: [work, studio]
    runs-on: ubuntu-latest
    env:
      OFFICE_KERNEL_REQUIRED: "1"
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/checkout-source
        with:
          path: apps/work
          owner: aster-ai-lab
          repository: work
          app-id: ${{ secrets.CI_SOURCE_APP_ID }}
          private-key: ${{ secrets.CI_SOURCE_APP_PRIVATE_KEY }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.12.0"
      - run: npm install --global pnpm@12.6.0
      - name: Install Office kernel target
        run: rustup target add wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:web
        if: matrix.app == 'work'
      - run: STUDIO_RENDERER_DIST=.studio-package pnpm exec rsbuild build
      - name: Studio launcher contracts
        if: matrix.app == 'studio'
        run: pnpm exec vitest run --project scripts scripts/__tests__/studioDev.test.ts scripts/__tests__/check-dependency-lockstep.test.ts
