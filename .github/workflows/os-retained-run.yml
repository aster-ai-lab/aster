# OS retained green run — self-hosted leg (specs/005 T018/T025 pre-positioned).
#
# Workflow_dispatch only: nothing runs automatically until the self-hosted
# runner (label `aster-os`) registers — that pending state is the designed
# pre-position, not a skip. Machine-side deploy keys read the aster-ai-lab
# submodules; no STUDIO_READ_TOKEN is used or required. Private submodules
# that fail to check out fail this run by name; checkout is never skipped.
# Retention: logs and the workspace check log are uploaded as artifacts so
# the run itself is the retained evidence (T018) and the self-hosted runner
# equivalently satisfies the FN0 residual revision (T026 proposal).

name: os-retained-run

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  retained-green:
    runs-on: [self-hosted, aster-os]
    timeout-minutes: 90
    steps:
      - name: Check out the parent repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check out pinned submodules with machine deploy keys (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::retained-run submodule checkout failed: $1"; exit 1; }
          for sub in apps/api apps/cloud; do
            mode="$(git ls-tree HEAD "$sub" | cut -d ' ' -f 1)"
            [[ "$mode" = "160000" ]] || fail "$sub is not a gitlink (mode $mode)"
            sha="$(git rev-parse "HEAD:$sub")"
            repo="aster-ai-lab/$(basename "$sub")"
            echo "Checking out $repo@$sha into $sub"
            rm -rf "$sub"
            git clone --quiet "git@github.com:$repo.git" "$sub" \
              || fail "machine key cannot clone $repo (register the deploy key on the runner)"
            git -C "$sub" checkout --quiet "$sha" \
              || fail "pinned revision $sha not found in $repo"
          done

      - name: Pin the workspace toolchain
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Format gate
        run: cargo fmt --all -- --check

      - name: Workspace check (all targets)
        run: |
          mkdir -p .retained-logs
          cargo check --locked --workspace --all-targets 2>&1 | tee .retained-logs/workspace-check.log
          cargo check --locked --manifest-path apps/control-plane/Cargo.toml --workspace --all-targets 2>&1 | tee .retained-logs/control-plane-check.log

      - name: Hermetic package tests (the service-free set)
        run: |
          set -euo pipefail
          run_tests() {
            local label="$1"; shift
            echo "== $label"
            cargo test --locked "$@" 2>&1 | tee ".retained-logs/tests-$label.log"
          }
          # aster-api and aster-cloud-control-plane are deliberately absent: their
          # suites carry live PostgreSQL proofs that panic when the service is
          # unreachable (and the api tobot pair additionally requires
          # --test-threads=1). They need the campaigns shape (real
          # PostgreSQL/S3, serial) which this pipeline does not provide.
          run_tests cloud-contracts --manifest-path apps/cloud/Cargo.toml -p aster-cloud-contracts
          run_tests cloud-node-agent --manifest-path apps/cloud/Cargo.toml -p aster-cloud-node-agent
          run_tests cloud-sdk --manifest-path apps/cloud/Cargo.toml -p aster-cloud-sdk
          run_tests auth --manifest-path apps/control-plane/Cargo.toml -p aster-auth

      - name: Workspace dependency guard
        run: python3 tests/workspace_dependencies.py

      - name: Retain run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-run-${{ github.run_id }}
          path: .retained-logs/
          retention-days: 90
