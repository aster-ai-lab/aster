name: Release aster-desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version to publish (x.y.z); assets attach to the desktop-stable channel release"
        required: true
        type: string
      notes_en:
        description: "Required English notes under ## New Features, ## Improvements, and ## Bug Fixes"
        required: true
        type: string
      notes_zh_cn:
        description: "Required Simplified Chinese notes under ## 新功能, ## 改进, and ## 错误修复"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: aster-desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: darwin-aarch64
    runs-on: macos-14
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      ASTER_TENANT_SLUG: aster
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install macOS build tools
        run: |
          brew install protobuf just coreutils e2fsprogs llvm jq xz gnu-tar
          rustup target add aarch64-unknown-linux-musl
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Studio engines.node requires >=24.12.0; macos-14 defaults are older.
          node-version: "24.12.0"
      - name: Install pnpm
        shell: bash
        # Root packageManager is bun; activate the Studio-pinned pnpm without
        # letting corepack read the repository root specification.
        run: |
          set -euo pipefail
          npm install -g pnpm@12.6.0
          cd apps/studio
          pnpm --version
          node --version
      - name: Build the sealed desktop bundle
        shell: bash
        env:
          DESKTOP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd apps/studio
          pnpm install --frozen-lockfile
          pnpm package:host
          target_dir="$(cargo metadata --locked --offline --no-deps --format-version 1 | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>process.stdout.write(JSON.parse(s).target_directory))')"
          asset="Aster-darwin-aarch64-v${DESKTOP_VERSION}.zip"
          cp "$target_dir/release/bundle/macos/Aster.zip" "../../$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-desktop-darwin-aarch64
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop validation sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: aster-desktop-*
          merge-multiple: true
          path: dist
          github-token: ${{ github.token }}
      - name: Regenerate the channel manifest with regression refusal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESKTOP_VERSION: ${{ inputs.version }}
          DESKTOP_NOTES_EN: ${{ inputs.notes_en }}
          DESKTOP_NOTES_ZH_CN: ${{ inputs.notes_zh_cn }}
        run: |
          set -euo pipefail
          asset="Aster-darwin-aarch64-v${DESKTOP_VERSION}.zip"
          test -f "dist/$asset"
          # The currently published manifest gates the regression refusal.
          gh release download desktop-stable --pattern desktop-latest.json --output current.json --clobber
          python3 scripts/desktop_release_manifest.py check --manifest current.json
          existing_args=(--existing current.json)
          printf '%s' "$DESKTOP_NOTES_EN" > notes-en.txt
          printf '%s' "$DESKTOP_NOTES_ZH_CN" > notes-zh-cn.txt
          notes_args=(--notes-en notes-en.txt --notes-zh-cn notes-zh-cn.txt)
          python3 scripts/desktop_release_manifest.py generate \
            --zip "dist/$asset" \
            --asset "$asset" \
            --version "$DESKTOP_VERSION" \
            --out dist/desktop-latest.json \
            "${existing_args[@]}" "${notes_args[@]}"
          python3 scripts/desktop_release_manifest.py check --manifest dist/desktop-latest.json
      - name: Publish to the desktop-stable channel release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DESKTOP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          asset="Aster-darwin-aarch64-v${DESKTOP_VERSION}.zip"
          if gh release view desktop-stable >/dev/null 2>&1; then
            gh release upload desktop-stable "dist/$asset" dist/desktop-latest.json --clobber
          else
            gh release create desktop-stable \
              --title "Aster desktop stable channel" \
              --notes "Rolling channel release. The manifest desktop-latest.json names the current version; historical archives stay attached." \
              --latest=false \
              "dist/$asset" dist/desktop-latest.json
          fi
          gh release view desktop-stable --json assets --jq '.assets[].name'
