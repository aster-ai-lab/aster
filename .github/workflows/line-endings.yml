name: Cross-platform text

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  line-endings:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Git checkout and immutable-byte contracts
        run: python tests/line_endings.py
