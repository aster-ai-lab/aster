name: Release aster

# Core/ACP only. Aster CLI and Desktop use separate product namespaces.
on:
  workflow_dispatch:
  push:
    tags:
      - "aster-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  actions: read

concurrency:
  group: aster-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualified:
    name: Verify pre-merge qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful branch qualification for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          successful_runs="$(gh api "repos/${GH_REPO}/actions/workflows/qualify-code.yml/runs?head_sha=${RELEASE_SHA}&event=push&status=completed&per_page=100" --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .head_branch != \"${RELEASE_TAG}\")] | length")"
          if [[ "$successful_runs" -eq 0 ]]; then
            echo "refusing release: tagged commit $RELEASE_SHA has no successful pre-merge Aster Code qualification run" >&2
            exit 1
          fi

  build:
    name: ACP release (${{ matrix.platform }})
    needs: qualified
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned workspace sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install protobuf just
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev
      - name: Install Windows protoc
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "29.3"
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $dest = Join-Path $env:RUNNER_TEMP "protoc"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest "bin")
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Shorten Windows Cargo home
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"
      - name: Cache Core/ACP release dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          shared-key: code-release-${{ matrix.platform }}
          save-if: "true"
      - name: Build locked ACP release
        shell: bash
        run: cargo build --locked --release -p aster-acp --bin aster-acp
      - name: Package ACP binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/code/acp/Cargo.toml", "rb"))["package"]["version"])')"
          tar -czf "aster-acp-v${version}-${{ matrix.platform }}.tar.gz" -C target/release aster-acp
      - name: Package ACP binary for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = Get-Content "crates/code/acp/Cargo.toml" -Raw
          if ($manifest -notmatch '(?m)^version = "([^"]+)"') { throw "ACP version missing" }
          Compress-Archive -Path "target/release/aster-acp.exe" -DestinationPath "aster-acp-v$($Matches[1])-windows.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-acp-${{ matrix.platform }}
          path: aster-acp-v*
          if-no-files-found: error

  publish:
    name: Publish Core/ACP source release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'aster-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: aster-acp-*
          merge-multiple: true
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#aster-v}"
          acp_version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/code/acp/Cargo.toml", "rb"))["package"]["version"])')"
          core_version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/code/core/Cargo.toml", "rb"))["package"]["version"])')"
          if ! test "$version" = "$acp_version"; then
            echo "release tag version $version does not match ACP $acp_version" >&2
            exit 1
          fi
          if ! test "$version" = "$core_version"; then
            echo "release tag version $version does not match Core $core_version" >&2
            exit 1
          fi
          notes="crates/code/manual/RELEASE_${version}.md"
          if [[ ! -f "$notes" ]]; then
            echo "release notes missing: $notes" >&2
            exit 1
          fi
          shopt -s nullglob
          files=(dist/*)
          if [[ ${#files[@]} -ne 3 ]]; then
            echo "expected 3 ACP release archives, found ${#files[@]}" >&2
            exit 1
          fi
          for asset in "aster-acp-v${version}-macos.tar.gz" "aster-acp-v${version}-linux.tar.gz" "aster-acp-v${version}-windows.zip"; do
            if [[ ! -f "dist/$asset" ]]; then
              echo "missing ACP release archive: $asset" >&2
              exit 1
            fi
          done
          (cd dist && sha256sum ./* > SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --latest=false \
            --title "Aster Code / ACP v${version}" \
            --notes-file "$notes" \
            "${files[@]}" dist/SHA256SUMS
          gh release view "${GITHUB_REF_NAME}"
