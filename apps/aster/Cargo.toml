[package]
name = "aster"
version = "0.3.0"
license = "MIT"
authors = ["Aster"]
default-run = "aster"

# Composition-root binary for Aster. This package links both the pager
# library and the optional `aster-pager-minimal` render mode: `minimal`
# depends on `aster-pager`, so the pager library cannot depend back on it
# (cargo cycle). The binary installs the minimal-mode IoC hooks at startup.
edition = "2024"
description = "Aster terminal coding agent"
publish = false
[[bin]]
name = "aster"
path = "src/main.rs"

[dependencies]
# The pager library (all application logic + the public API main.rs drives).
# Optional scrollback-native render mode, wired in via the fn-pointer seam.

# Agent runtime + leader/stdio/headless entry points.

# Async runtime + misc.
flate2 = {workspace = true}
reqwest = {workspace = true}
sha2 = {workspace = true}
tar = {workspace = true}
tokio = {version = "1", features = ["full", "sync", "rt", "macros", "rt-multi-thread", "signal", "io-util", "io-std"]}
zip = {workspace = true}
tokio-util = {version = "0.7", features = ["rt", "compat"]}
anyhow = {workspace = true}
crossterm = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true}
serde_json = {workspace = true}
dunce = {workspace = true}
semver = {workspace = true}

aster-extra-ca = {path = "../../crates/terminal/crates/codegen/aster-extra-ca"}
aster-use = {path = "../../crates/use"}
aster-confine = {default-features = false, path = "../../crates/terminal/crates/codegen/aster-confine"}
aster-config = {path = "../../crates/terminal/crates/codegen/aster-config"}
aster-tty-utils = {path = "../../crates/terminal/crates/codegen/aster-tty-utils"}
aster-acp-lib = {path = "../../crates/terminal/crates/codegen/aster-acp-lib"}
aster-crash-handler = {path = "../../crates/terminal/crates/codegen/aster-crash-handler"}
aster-workspace = {default-features = false, path = "../../crates/terminal/crates/codegen/aster-workspace"}
aster-telemetry = {path = "../../crates/terminal/crates/codegen/aster-telemetry"}
aster-version = {path = "../../crates/terminal/crates/codegen/aster-version"}
aster-update = {path = "../../crates/terminal/crates/codegen/aster-update"}
aster-shell = {path = "../../crates/terminal/crates/codegen/aster-shell"}
aster-login = {path = "../../crates/terminal/crates/codegen/aster-login"}
aster-pager-minimal = {path = "../../crates/terminal/crates/codegen/aster-pager-minimal"}
aster-pager = {path = "../../crates/terminal/crates/codegen/aster-pager"}

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(unix)'.dependencies]
libc = {workspace = true}
# Default allocator on Unix; gated by the `jemalloc` feature (see main.rs
# `#[global_allocator]`, cfg(all(feature = "jemalloc", unix))).
# `stats` is binary-scoped only (not workspace-wide) so this CLI jemalloc
# link gets --enable-stats for stats.allocated / stats.resident mallctl.
# Shipped CLI keeps jemalloc + stats (memory trace / arena purge) but not
# `profiling`: the prof heap-dump path is opt-in via `jemalloc-profiling` so
# release-dist does not link jemalloc's profiler by default.
tikv-jemallocator = {version = "0.7", features = ["unprefixed_malloc_on_supported_platforms", "stats"], optional = true}
# Raw mallctl for the memory-cliff arena purge hook (see
# `purge_jemalloc_retained_pages` + the `install_release_hook` call in
# main.rs). Same version family as the
# allocator; adds no new build units beyond what tikv-jemallocator pulls in.
tikv-jemalloc-sys = {version = "0.7", optional = true}
# Heap-profile / stats mallctl helpers (prof.active, prof.dump, epoch, stats.*).
tikv-jemalloc-ctl = {version = "0.7", optional = true, features = ["stats", "use_std"]}

[dev-dependencies]
aster-use-tool-acquire = {path = "../../crates/use/tool-acquire"}
serde = {workspace = true}
aster-acl = {path = "../../crates/acl"}
aster-core = {path = "../../crates/code/core"}
aster-markdown = {path = "../../crates/terminal/crates/codegen/aster-markdown"}
tempfile = {workspace = true}
uuid = {version = "1", features = ["v4"]}
vt100 = "0.15"
portable-pty = {workspace = true}
serial_test = {workspace = true}
# `PagerArgs::try_parse_from` in the CLI-parsing unit tests (needs the
# `clap::Parser` trait in scope).
clap = {workspace = true}

[features]
default = [
    "jemalloc",
    "confine-noop",
    ]
default-bazel = [
    "jemalloc",
    "confine-noop",
    "local-workspace",
    ]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "dep:tikv-jemalloc-ctl"]
# Opt-in jemalloc heap profiler (prof.active / prof.dump). Not part of
# `default` or `release-dist`; enable locally when collecting heap dumps.
jemalloc-profiling = ["jemalloc", "tikv-jemallocator/profiling"]
# Propagate the aster-confine stub feature through pager and workspace.
confine-noop = ["aster-pager/confine-noop", "aster-workspace/confine-noop"]
local-workspace = ["aster-pager/local-workspace"]
# Test-only, prod-inert seam: lets the e2e harness install a TEST-signed managed-policy key the
# spawned pager trusts. Double locked out of production: absent from `default`, `default-bazel`, and
# `release-dist`, and the install hook is additionally gated on `debug_assertions` (off in shipped
# `-c opt`/release builds). Never add this to a shipped feature set.
test-seams = []
release-dist = [
    "aster-pager/release-dist",
    ]
