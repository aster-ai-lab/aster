[package]
name = "aster"
version = "0.1.1"
license = "Apache-2.0"
authors = ["A3S Lab"]
default-run = "aster"

# Composition-root binary for Aster. This package links both the pager
# library and the optional `a3s-code-pager-minimal` render mode: `minimal`
# depends on `a3s-code-pager`, so the pager library cannot depend back on it
# (cargo cycle). The binary installs the minimal-mode IoC hooks at startup.
edition = "2024"
description = "Aster terminal coding agent"
publish = false
[[bin]]
name = "aster"
path = "src/main.rs"

[dependencies]
# The pager library (all application logic + the public API main.rs drives).
# Optional scrollback-native render mode, wired in via the fn-pointer seam.

# Agent runtime + leader/stdio/headless entry points.

# Async runtime + misc.
flate2 = {workspace = true}
reqwest = {workspace = true}
sha2 = {workspace = true}
tar = {workspace = true}
tokio = {version = "1", features = ["full", "sync", "rt", "macros", "rt-multi-thread", "signal", "io-util", "io-std"]}
zip = {workspace = true}
tokio-util = {version = "0.7", features = ["rt", "compat"]}
anyhow = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true}
serde_json = {workspace = true}
dunce = {workspace = true}
semver = {workspace = true}

a3s-code-extra-ca = {path = "../../crates/terminal/crates/codegen/a3s-code-extra-ca"}
a3s-code-sandbox = {default-features = false, path = "../../crates/terminal/crates/codegen/a3s-code-sandbox"}
a3s-code-config = {path = "../../crates/terminal/crates/codegen/a3s-code-config"}
a3s-tty-utils = {path = "../../crates/terminal/crates/codegen/a3s-tty-utils"}
a3s-acp-lib = {path = "../../crates/terminal/crates/codegen/a3s-acp-lib"}
a3s-crash-handler = {path = "../../crates/terminal/crates/codegen/a3s-crash-handler"}
a3s-code-workspace = {default-features = false, path = "../../crates/terminal/crates/codegen/a3s-code-workspace"}
a3s-code-telemetry = {path = "../../crates/terminal/crates/codegen/a3s-code-telemetry"}
a3s-code-version = {path = "../../crates/terminal/crates/codegen/a3s-code-version"}
a3s-code-update = {path = "../../crates/terminal/crates/codegen/a3s-code-update"}
a3s-code-shell = {path = "../../crates/terminal/crates/codegen/a3s-code-shell"}
a3s-code-login = {path = "../../crates/terminal/crates/codegen/a3s-code-login"}
a3s-code-pager-minimal = {path = "../../crates/terminal/crates/codegen/a3s-code-pager-minimal"}
a3s-code-pager = {path = "../../crates/terminal/crates/codegen/a3s-code-pager"}

[target.'cfg(target_os = "linux")'.dependencies]

[target.'cfg(unix)'.dependencies]
libc = {workspace = true}
# Default allocator on Unix; gated by the `jemalloc` feature (see main.rs
# `#[global_allocator]`, cfg(all(feature = "jemalloc", unix))).
# `stats` is binary-scoped only (not workspace-wide) so this CLI jemalloc
# link gets --enable-stats for stats.allocated / stats.resident mallctl.
tikv-jemallocator = {version = "0.7", features = ["profiling", "unprefixed_malloc_on_supported_platforms", "stats"], optional = true}
# Raw mallctl for the memory-cliff arena purge hook (see
# `purge_jemalloc_retained_pages` + the `install_release_hook` call in
# main.rs). Same version family as the
# allocator; adds no new build units beyond what tikv-jemallocator pulls in.
tikv-jemalloc-sys = {version = "0.7", optional = true}
# Heap-profile / stats mallctl helpers (prof.active, prof.dump, epoch, stats.*).
tikv-jemalloc-ctl = {version = "0.7", optional = true, features = ["stats", "use_std"]}

[dev-dependencies]
portable-pty = {workspace = true}
serial_test = {workspace = true}
# `PagerArgs::try_parse_from` in the CLI-parsing unit tests (needs the
# `clap::Parser` trait in scope).
clap = {workspace = true}

[features]
default = [
    "jemalloc",
    "sandbox-enforce",
    ]
default-bazel = [
    "jemalloc",
    "sandbox-enforce",
    "local-workspace",
    ]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "dep:tikv-jemalloc-ctl"]
# a3s-code-workspace no longer enables sandbox-enforce by default, so enable it here.
sandbox-enforce = ["a3s-code-pager/sandbox-enforce", "a3s-code-workspace/sandbox-enforce"]
local-workspace = ["a3s-code-pager/local-workspace"]
# Test-only, prod-inert seam: lets the e2e harness install a TEST-signed managed-policy key the
# spawned pager trusts. Double locked out of production: absent from `default`, `default-bazel`, and
# `release-dist`, and the install hook is additionally gated on `debug_assertions` (off in shipped
# `-c opt`/release builds). Never add this to a shipped feature set.
test-seams = []
release-dist = [
    "a3s-code-pager/release-dist",
    ]
