[package]
name = "aster-auth"
version = "0.1.0"
edition = "2021"
publish = false
description = "Aster OS human proof service — passwords, sessions, OIDC, forward-auth"

[[bin]]
name = "aster-auth"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# Domain types + HttpAuthClient / ProofClient (for api and other HTTP callers).
client = []
# Process binary: stores, argon2, Boot HTTP surface.
server = [
  "client",
  "dep:argon2",
  "dep:password-hash",
  "dep:aster-boot",
  "dep:aster-orm",
  "dep:axum",
  "dep:http",
  "dep:http-body-util",
  "dep:hyper",
  "dep:hyper-util",
  "dep:tower",
  "dep:rsa",
  "dep:signature",
  "dep:rustls",
  "dep:rustls-pemfile",
  "dep:tokio-rustls",
  "dep:serde_urlencoded",
  "dep:url",
]

[dependencies]
# Always available to `client` consumers (domain crypto + HTTP client).
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
rand_core = { version = "0.6", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

# Server / process-only.
argon2 = { version = "0.5", features = ["std"], optional = true }
aster-boot = { path = "../../../crates/boot", features = ["macros", "etcd-discovery"], optional = true }
aster-orm = { path = "../../../crates/orm", default-features = false, features = ["postgres", "sqlite"], optional = true }
axum = { version = "0.8", optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"], optional = true }
password-hash = { version = "0.5", optional = true }
rsa = { version = "0.9", features = ["sha2", "pem"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
signature = { version = "2", optional = true }
tokio-rustls = { version = "0.26", optional = true }
tower = { version = "0.5", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
rcgen = "0.13"
tower = { version = "0.5", features = ["util"] }
