[package]
name = "aster-config"
version = "0.1.0"
edition = "2021"
publish = false
description = "Aster OS distributed config service — PG authority + Iggy fan-out"

[[bin]]
name = "aster-config"
path = "src/main.rs"

[lib]
name = "aster_config"
path = "src/lib.rs"

[dependencies]
aster-boot = { path = "../../../crates/boot", features = ["macros", "health", "etcd-discovery"] }
aster-orm = { path = "../../../crates/orm", default-features = false, features = ["postgres", "sqlite"] }
async-trait = "0.1"
bytes = "1"
dotenvy = "0.15"
regex = "1"
iggy = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
http = "1"
tower = { version = "0.5", features = ["util"] }
