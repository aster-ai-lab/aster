[package]
name = "aster-runner"
version = "0.1.0"
edition = "2021"
publish = false
description = "Self-hosted Aster pipeline runner: claims jobs and runs each step in an aster-box MicroVM"

[[bin]]
name = "aster-runner"
path = "src/main.rs"

[dependencies]
aster-acl = { path = "../../../crates/acl" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
