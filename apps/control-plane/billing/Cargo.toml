[package]
name = "aster-billing"
version = "0.1.0"
edition = "2021"
publish = false
description = "Aster OS billing — usage events, hybrid plans, and period invoices"

[[bin]]
name = "aster-billing"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
client = []
server = [
  "client",
  "dep:aster-boot",
  "dep:aster-orm",
  "dep:axum",
]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["serde", "v4"] }

aster-boot = { path = "../../../crates/boot", features = ["macros", "etcd-discovery"], optional = true }
aster-orm = { path = "../../../crates/orm", default-features = false, features = ["postgres", "sqlite"], optional = true }
axum = { version = "0.8", optional = true }

[dev-dependencies]
http = "1"
tower = { version = "0.5", features = ["util"] }
