[package]
name = "aster-gateway-runtime"
version = "0.1.0"
edition = "2021"
publish = false
description = "Aster OS Gateway /v1 data-plane runtime"

[[bin]]
name = "aster-gateway-runtime"
path = "src/main.rs"

[lib]
name = "aster_gateway_runtime"
path = "src/lib.rs"

[dependencies]
aster-event = { path = "../../../crates/event", default-features = false, features = ["nats"] }
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
