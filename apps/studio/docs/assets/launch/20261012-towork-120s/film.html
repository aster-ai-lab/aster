    function reveal(name, r, k, bg = '#fff') {
      erase(r, bg)
      if (k <= 0) return
      g.save()
      g.beginPath()
      g.rect(r.x, r.y, r.w * clamp(k, 0, 1), r.h)
      g.clip()
      g.drawImage(surface(name), 0, 0, 1440, 920)
      g.restore()
    }
    function product(t) {
      const name = stateAt(t)
      g.drawImage(surface(name), 0, 0, 1440, 920)
      if (name === '02-task-draft') {
        const k = clamp(OM.seg(t, 10.8, 16.1), 0, 1),
          a = { x: 514, y: 428, w: 721, h: 17 },
          b = { x: 514, y: 448, w: 235, h: 17 }
        reveal(name, a, k * 1.32)
        reveal(name, b, (k - 0.76) / 0.24)
        if (t < 10.8) erase({ x: 1217, y: 512, w: 32, h: 31 }, '#fff')
      }
      if (name === '13-automation-draft') {
        reveal(name, { x: 397, y: 255, w: 126, h: 20 }, OM.seg(t, 87.4, 88.5), '#f5f5f5')
        reveal(name, { x: 398, y: 345, w: 442, h: 20 }, OM.seg(t, 89.2, 92.7))
      }
    }
    function planeAt(t) {
      if (t < 7) return OM.morphRect(t, 3.8, 6.9, ICON, P, { curve: OM.ease.expoInOut })
      if (t >= 111.2) return OM.morphRect(t, 111.2, 113.4, P, ICON, { curve: OM.ease.expoInOut })
      return P
    }

      const p = planeAt(t)
      g.save()
      rect({ ...p, r: 20 }, '#fff')
      g.beginPath()
      g.roundRect(p.x, p.y, p.w, p.h, 20)
      g.clip()
      g.translate(p.x, p.y)
      g.scale(p.w / 1440, p.h / 920)

      track('workspace', p, t < 113.4 ? 1 : 0)

        g.globalAlpha = 1 - phase(t, 4.3, 6.4)
        g.fillStyle = C.ground
        g.fillRect(p.x, p.y, p.w, p.h)

        g.fillRect(p.x, p.y, p.w, p.h)

      const h = OM.cursor(t, HAND, CLICKS)
      let i = 0
      while (i < HAND.length - 2 && t > HAND[i + 1].t) i++

        b = HAND[i + 1],

      if (t < 7.4 || t > 111.2) return

      g.translate(h.x, h.y)
      g.scale(h.s / z, h.s / z)

      g.fill()
      g.strokeStyle = '#fff'

      g.stroke()

      track('hand', { x: h.x, y: h.y, w: 24 / z, h: 34 / z }, fade)

        hb = OM.project(OM.view(cb), h1.x, h1.y)
      const opening = (t) => OM.maskRise(Math.min(t, 2.3), 0.45, 0, { dist: 30, zeta: 0.8, omega: 20 }).y,
        closing = (t) => OM.maskRise(Math.min(t, 115.7), 113.4, 0, { dist: 28, zeta: 0.85, omega: 24 }).y
      return Math.max(
        OM.screenTravel(ca, cb, cm),
        Math.abs(pa.x - pb.x) + Math.abs(pa.w - pb.w),
        Math.abs(pa.y - pb.y) + Math.abs(pa.h - pb.h),
        Math.hypot(ha[0] - hb[0], ha[1] - hb[1]),
        34 * Math.abs(h0.s - h1.s),
        Math.abs(opening(a) - opening(b)),
        Math.abs(closing(a) - closing(b)),
        ...[
          [19.2, 26.5],
          [27.3, 32.1],
          [33, 37.5],
          [50.5, 57.6]
        ].map(([t]) => 50 * Math.abs(phase(a, t, t + 0.3, OM.ease.expoOut) - phase(b, t, t + 0.3, OM.ease.expoOut)))
      )
    }

    window.__ready = Promise.all([
      LOOK.ready,
      ...SOURCES.map(
        (name) =>
          new Promise((resolve, reject) => {

      if (q.has('play')) {

          seek(((performance.now() - start) / 1000) % DUR)

        }
