[package]
name = "a3s-studio-data-sqlite"
version = "0.1.0"
edition = "2021"
publish = false
description = "Database statement runner for the Studio data page, on a3s-orm drivers"

[dependencies]
a3s-orm = { path = "../../../../crates/orm", default-features = false, features = ["postgres", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "data-sqlite"
path = "src/main.rs"
