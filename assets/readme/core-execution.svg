<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1392" viewBox="0 0 1200 1392" role="img" aria-labelledby="execution-title execution-desc">
  <title id="execution-title">Aster Core 的执行、恢复与完成</title>
  <desc id="execution-desc">会话入口先取得运行准入，绑定身份、权限、能力代际和取消。FactRun 从事实日志恢复并驱动模型和工具。运行结束时，完成判定核对变更摘要、验证报告、宿主豁免和未决义务。取消需要结算原运行与工具终态。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Menlo, "SFMono-Regular", Consolas, "PingFang SC", "Microsoft YaHei", monospace; fill: #141413; font-weight: 400; }
      .title { font-size: 36px; font-weight: 500; }
      .heading { font-size: 26px; font-weight: 500; }
      .body { font-size: 22px; }
      .note { font-size: 20px; fill: #7A756C; }
      .light { fill: #FDFCF9; }
      .panel { fill: #FDFCF9; stroke: #141413; stroke-width: 1.2; }
      .soft { fill: #FDFCF9; stroke: #DCD6C8; stroke-width: 1.2; }
      .line { fill: none; stroke: #141413; stroke-width: 1.6; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="1392" rx="14" fill="#F8F6F0"/>
  <text class="title" x="56" y="66">执行、恢复与完成</text>
  <text x="56" y="108" font-size="24">同一个原运行拥有模型、工具、日志和取消</text>

  <rect class="panel" x="260" y="150" width="680" height="74" rx="6"/>
  <text x="600" y="196" font-size="24" text-anchor="middle">AgentSession.send / stream / resume</text>
  <path class="line" d="M600 224V264" marker-end="url(#arrow)"/>
  <g id="admission">
    <rect class="panel" x="56" y="264" width="1088" height="140" rx="8"/>
    <path d="M64 264H1136Q1144 264 1144 272V314H56V272Q56 264 64 264Z" fill="#141413"/>
    <text class="heading light" x="80" y="298">运行准入</text>
    <text class="body" x="80" y="352">Session 单运行 / 运行身份 / 权限快照 / 能力代际</text>
    <text class="body" x="80" y="383">共享调度配额 / 原运行所有权 / 取消令牌</text>
  </g>
  <path class="line" d="M600 404V430H783V458" marker-end="url(#arrow)"/>

  <g id="fact-runtime">
    <rect class="panel" x="56" y="458" width="320" height="158" rx="8"/>
    <path d="M64 458H368Q376 458 376 466V508H56V466Q56 458 64 458Z" fill="#141413"/>
    <text class="heading light" x="216" y="492" text-anchor="middle">事实日志</text>
    <text class="body" x="216" y="548" text-anchor="middle">输入 / 模型 / 工具回执</text>
    <text class="body" x="216" y="584" text-anchor="middle">恢复过滤已提交动作</text>
    <rect class="panel" x="422" y="458" width="722" height="158" rx="8"/>
    <path d="M430 458H1136Q1144 458 1144 466V508H422V466Q422 458 430 458Z" fill="#141413"/>
    <text class="heading light" x="783" y="492" text-anchor="middle">FactRun / Meta Harness</text>
    <text class="body" x="783" y="548" text-anchor="middle">system → tools → budget → compact → infer</text>
    <text x="783" y="584" font-size="24" text-anchor="middle">读取事实 → 选择动作 → 记录结果</text>
    <path class="line" d="M376 537H422" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <path class="line" d="M587 616V674" marker-end="url(#arrow)"/>
  <path class="line" d="M979 616V674" marker-end="url(#arrow)"/>
  <g id="effects" text-anchor="middle">
    <rect class="panel" x="422" y="674" width="330" height="140" rx="6"/>
    <text class="heading" x="587" y="713">模型调用</text>
    <text class="body" x="587" y="751">上下文 / 预算 / 并发池</text>
    <text class="body" x="587" y="785">流式输出 / 结构化结果</text>
    <rect class="panel" x="814" y="674" width="330" height="140" rx="6"/>
    <text class="heading" x="979" y="713">工具调用</text>
    <text class="body" x="979" y="751">权限 → 审批 → 沙箱</text>
    <text class="body" x="979" y="785">结果回执 / 取消终态</text>
    <path class="line" d="M752 744H814" marker-end="url(#arrow)"/>
  </g>
  <path class="line" d="M1144 744H1168V537H1144" marker-end="url(#arrow)"/>
  <path class="line" d="M587 814V840H979V814"/>
  <path class="line" d="M600 840V866" marker-end="url(#arrow)"/>

  <g id="evidence">
    <rect class="panel" x="56" y="866" width="1088" height="144" rx="8"/>
    <text class="heading" x="80" y="908">完成证据</text>
    <g text-anchor="middle">
      <rect class="soft" x="80" y="930" width="320" height="56" rx="6"/>
      <text x="240" y="966" font-size="24">当前变更摘要</text>
      <rect class="soft" x="440" y="930" width="320" height="56" rx="6"/>
      <text class="body" x="600" y="966">验证报告 / 宿主豁免</text>
      <rect class="soft" x="800" y="930" width="320" height="56" rx="6"/>
      <text class="body" x="960" y="966">未决效果 / 未收尾任务</text>
    </g>
  </g>
  <path class="line" d="M600 1010V1060" marker-end="url(#arrow)"/>
  <rect x="326" y="1060" width="548" height="78" rx="6" fill="#141413"/>
  <text x="600" y="1109" font-size="30" fill="#FDFCF9" style="fill:#FDFCF9" text-anchor="middle">CompletionGate</text>
  <path class="line" d="M600 1138V1160 M292 1160H908"/>
  <path class="line" d="M292 1160V1190" marker-end="url(#arrow)"/>
  <path class="line" d="M908 1160V1190" marker-end="url(#arrow)"/>
  <g text-anchor="middle">
    <rect x="56" y="1190" width="472" height="76" rx="6" fill="#FDFCF9" stroke="#4E60FF" stroke-width="1.4"/>
    <text x="292" y="1236" font-size="24">通过：无变更 / 验证 / 豁免</text>
    <rect class="panel" x="672" y="1190" width="472" height="76" rx="6"/>
    <text x="908" y="1236" font-size="24">未完成：保留义务与诊断</text>
    <rect x="56" y="1310" width="1088" height="44" rx="6" fill="#4E60FF"/>
    <text class="body light" x="600" y="1339">取消与收尾由原运行负责，事件流结束不代表任务成功</text>
  </g>
</svg>
