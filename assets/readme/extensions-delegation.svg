<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="extensions-title extensions-desc">
  <title id="extensions-title">Aster 的扩展与子运行</title>
  <desc id="extensions-desc">父运行固定权限、沙箱、预算、取消与工作策略。Skill 返回指令或启动受限子运行，Task 执行独立子任务，MCP 投影外部工具，PTC 执行模板和脚本。嵌套调用保留作用域与回执，结果和后台效果进入父运行的观察与完成判定。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Menlo, "SFMono-Regular", Consolas, "PingFang SC", "Microsoft YaHei", monospace; fill: #141413; font-weight: 400; }
      .title { font-size: 36px; font-weight: 500; }
      .heading { font-size: 26px; font-weight: 500; }
      .body { font-size: 22px; }
      .light { fill: #FDFCF9; }
      .panel { fill: #FDFCF9; stroke: #141413; stroke-width: 1.2; }
      .line { fill: none; stroke: #141413; stroke-width: 1.6; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="1080" rx="14" fill="#F8F6F0"/>
  <text class="title" x="56" y="66">扩展与子运行</text>
  <text x="56" y="108" font-size="24">执行方式各异，父级边界随调用继承</text>

  <g id="parent">
    <rect class="panel" x="56" y="150" width="1088" height="148" rx="8"/>
    <path d="M64 150H1136Q1144 150 1144 158V200H56V158Q56 150 64 150Z" fill="#141413"/>
    <text class="heading light" x="80" y="184">父运行 · 已准入的能力快照</text>
    <text x="600" y="257" font-size="24" text-anchor="middle">权限 / 沙箱 / 共享预算 / 取消 / 工作策略</text>
  </g>
  <path class="line" d="M600 298V330 M180 330H1020"/>
  <path class="line" d="M180 330V368" marker-end="url(#arrow)"/>
  <path class="line" d="M460 330V368" marker-end="url(#arrow)"/>
  <path class="line" d="M740 330V368" marker-end="url(#arrow)"/>
  <path class="line" d="M1020 330V368" marker-end="url(#arrow)"/>

  <g id="execution-modes" text-anchor="middle">
    <rect class="panel" x="56" y="368" width="248" height="164" rx="6"/>
    <text class="heading" x="180" y="414">Skill</text>
    <text class="body" x="180" y="460">指令返回 / 子运行</text>
    <text class="body" x="180" y="499">按声明工具收窄</text>
    <rect class="panel" x="336" y="368" width="248" height="164" rx="6"/>
    <text class="heading" x="460" y="414">Task</text>
    <text class="body" x="460" y="460">独立上下文</text>
    <text class="body" x="460" y="499">并行 / 后台任务</text>
    <rect class="panel" x="616" y="368" width="248" height="164" rx="6"/>
    <text class="heading" x="740" y="414">MCP</text>
    <text class="body" x="740" y="460">服务器工具投影</text>
    <text x="740" y="499" font-size="20">stdio / HTTP / SSE</text>
    <rect x="896" y="368" width="248" height="164" rx="6" fill="#FDFCF9" stroke="#4E60FF" stroke-width="1.4"/>
    <text class="heading" x="1020" y="414">PTC</text>
    <text class="body" x="1020" y="460">模板 / QuickJS</text>
    <text class="body" x="1020" y="499">受限工具目录</text>
  </g>
  <path class="line" d="M180 532V562H1020V532 M460 532V562 M740 532V562"/>
  <path class="line" d="M600 562V592" marker-end="url(#arrow)"/>

  <g id="scopes">
    <rect class="panel" x="56" y="592" width="1088" height="150" rx="8"/>
    <path d="M64 592H1136Q1144 592 1144 600V642H56V600Q56 592 64 592Z" fill="#141413"/>
    <text class="heading light" x="80" y="626">调用与子运行归属</text>
    <text x="600" y="682" font-size="24" text-anchor="middle">Session → Run → Subtask → Turn</text>
    <text class="body" x="600" y="719" text-anchor="middle">嵌套工具保留权限、取消、预算和效果回执</text>
  </g>
  <path class="line" d="M600 742V774 M315 774H885"/>
  <path class="line" d="M315 774V806" marker-end="url(#arrow)"/>
  <path class="line" d="M885 774V806" marker-end="url(#arrow)"/>
  <g text-anchor="middle">
    <rect class="panel" x="56" y="806" width="518" height="128" rx="6"/>
    <text class="heading" x="315" y="853">前台结果 / 后台跟踪</text>
    <text class="body" x="315" y="898">运行状态 / 子任务终态 / 变更</text>
    <rect x="626" y="806" width="518" height="128" rx="6" fill="#141413"/>
    <text class="heading light" x="885" y="853">父运行完成判定</text>
    <text class="body light" x="885" y="898">观察子任务效果后结算</text>
    <path class="line" d="M574 870H626" marker-end="url(#arrow)"/>
    <rect x="56" y="990" width="1088" height="44" rx="6" fill="#4E60FF"/>
    <text class="body light" x="600" y="1019">委派拆分上下文与工作，不扩大已准入权限和共享预算</text>
  </g>
</svg>
