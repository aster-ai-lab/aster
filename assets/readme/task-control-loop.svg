  <text x="38" y="106" fill="#555" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" letter-spacing="0">模型提出下一步；Core 判定权限；工具产生结果；事实日志驱动后续状态。</text>
