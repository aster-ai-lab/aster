<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="edit-title edit-desc">
  <title id="edit-title">内容块编辑与修改后的验证</title>
  <desc id="edit-desc">编辑工具读取内容和版本，检查内容锚点、整组替换、换行和数量，再通过工作区后端检查版本并写入。匹配歧义或冲突时返回诊断并重新读取。写入后记录变更摘要，通过项目检查收集完成证据；编辑本身不保证语法通过。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Menlo, "SFMono-Regular", Consolas, "PingFang SC", "Microsoft YaHei", monospace; fill: #141413; font-weight: 400; }
      .title { font-size: 36px; font-weight: 500; }
      .heading { font-size: 26px; font-weight: 500; }
      .body { font-size: 22px; }
      .light { fill: #FDFCF9; }
      .panel { fill: #FDFCF9; stroke: #141413; stroke-width: 1.2; }
      .line { fill: none; stroke: #141413; stroke-width: 1.6; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="1020" rx="14" fill="#F8F6F0"/>
  <text class="title" x="56" y="66">文件编辑与验证</text>
  <text x="56" y="108" font-size="24">先确定改动位置，再核对修改后的结果</text>

  <rect class="panel" x="260" y="154" width="680" height="90" rx="6"/>
  <text class="heading" x="600" y="191" text-anchor="middle">read_for_edit</text>
  <text class="body" x="600" y="224" text-anchor="middle">当前内容 + 文件版本</text>
  <path class="line" d="M600 244V270H759V294" marker-end="url(#arrow)"/>

  <g id="staged-edit">
    <rect class="panel" x="374" y="294" width="770" height="220" rx="8"/>
    <path d="M382 294H1136Q1144 294 1144 302V344H374V302Q374 294 382 294Z" fill="#141413"/>
    <text class="heading light" x="398" y="328">内存中完成整组编辑</text>
    <text class="body" x="398" y="383">1. old_string 唯一匹配</text>
    <text class="body" x="398" y="420">2. edits 依次合成内存副本</text>
    <text class="body" x="398" y="457">3. 换行与替换数量校验</text>
    <text class="body" x="398" y="494">replace_all 显式允许多处替换</text>
  </g>
  <path class="line" d="M374 414H316" marker-end="url(#arrow)"/>
  <rect x="56" y="348" width="260" height="132" rx="6" fill="#FDFCF9" stroke="#4E60FF" stroke-width="1.4"/>
  <text class="heading" x="186" y="387" text-anchor="middle">拒绝本次编辑</text>
  <text class="body" x="186" y="425" text-anchor="middle">未命中 / 多处命中</text>
  <text class="body" x="186" y="459" text-anchor="middle">数量或版本不符</text>
  <path class="line" d="M186 348V200H260" marker-end="url(#arrow)"/>
  <text x="78" y="292" font-size="20" fill="#7A756C" style="fill:#7A756C">重新读取</text>

  <path class="line" d="M759 514V554" marker-end="url(#arrow)"/>
  <rect class="panel" x="374" y="554" width="770" height="112" rx="6"/>
  <text class="heading" x="759" y="599" text-anchor="middle">write_for_edit</text>
  <text class="body" x="759" y="636" text-anchor="middle">读取版本检查 → 写入工作区</text>
  <path class="line" d="M374 610H338V448H316" marker-end="url(#arrow)"/>
  <path class="line" d="M759 666V690H240V714" marker-end="url(#arrow)"/>

  <g id="verification" text-anchor="middle">
    <rect class="panel" x="80" y="714" width="320" height="154" rx="6"/>
    <text class="heading" x="240" y="756">变更摘要</text>
    <text class="body" x="240" y="799">记录最后一次修改</text>
    <text class="body" x="240" y="837">effect_digest</text>
    <rect class="panel" x="440" y="714" width="320" height="154" rx="6"/>
    <text class="heading" x="600" y="756">项目检查</text>
    <text class="body" x="600" y="799">诊断 / 编译 / 测试</text>
    <text class="body" x="600" y="837">验证绑定当前效果</text>
    <rect x="800" y="714" width="320" height="154" rx="6" fill="#141413"/>
    <text class="heading light" x="960" y="756">完成判定</text>
    <text class="body light" x="960" y="799">核对验证与未决义务</text>
    <text class="body light" x="960" y="837">证据不足返回诊断</text>
  </g>
  <path class="line" d="M400 790H440" marker-end="url(#arrow)"/>
  <path class="line" d="M760 790H800" marker-end="url(#arrow)"/>
  <rect x="56" y="936" width="1088" height="44" rx="6" fill="#4E60FF"/>
  <text class="body light" x="600" y="965" text-anchor="middle">编辑写入成功不等于语法正确，验证证据在修改后收集</text>
</svg>
