<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Aster Meta Harness 组件装配</title>
  <desc id="desc">宿主配方、注册表和装配器生成组件图，五个默认组件共享一份不可变事实日志，权限和完成门禁由 Core 保留。</desc>
