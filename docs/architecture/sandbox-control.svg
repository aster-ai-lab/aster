text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#17263d}
.title{font-size:36px;font-weight:750;letter-spacing:-.5px}.section{font-size:25px;font-weight:700}.heading{font-size:23px;font-weight:700}.body{font-size:20px;fill:#42536c}.small{font-size:17px;fill:#52647e}.white{fill:#fff}
.link{fill:none;stroke:#52647e;stroke-width:2.4;marker-end:url(#arrow);stroke-linejoin:round}.policy{fill:none;stroke:#af7a32;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#policyArrow);stroke-linejoin:round}
</style>
