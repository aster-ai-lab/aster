 .white {fill:#fff}
 .link {fill:none;stroke:#52647e;stroke-width:2.4;marker-end:url(#arrow);stroke-linejoin:round}
 .duplex {marker-start:url(#arrow)}
 .feedback {fill:none;stroke:#5b4bd9;stroke-width:3;marker-end:url(#violetArrow);stroke-linejoin:round}
 .policy {fill:none;stroke:#af7a32;stroke-width:2;stroke-dasharray:6 5;marker-start:url(#policyArrow);marker-end:url(#policyArrow)}
</style>
