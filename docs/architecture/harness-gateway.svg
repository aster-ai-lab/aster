<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1805" viewBox="0 0 2240 1805" role="img" aria-labelledby="title desc">
<title id="title">多 Harness 协作架构</title>
<desc id="desc">品牌无关的 DDD 架构设计。桌面、Web、终端和主 Agent 通过 REST 与 SSE 访问协作网关。网关以统一 Harness Adapter 接口接入 ACP、HTTP/gRPC、原生 SDK、CLI/进程和 A2A。执行运行时层管理执行节点、进程、工作区、凭据、产物和沙箱，并统一提供日志、记忆、MCP、Skill 与数据兼容。纵向授权策略层覆盖各层的身份、授权、执行约束、审计和撤权。</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52647e"/></marker>
 <marker id="violetArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b4bd9"/></marker>
 <marker id="policyArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#af7a32"/></marker>
 <linearGradient id="coordinator" x1="0" x2="1"><stop stop-color="#353277"/><stop offset="1" stop-color="#5144ce"/></linearGradient>
</defs>
<style>
