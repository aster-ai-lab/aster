<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1740" viewBox="0 0 1920 1740" role="img" aria-labelledby="title desc">
<title id="title">Aster current system architecture, source checked on 2026-11-02</title>
<desc id="desc">Studio and terminal hosts use ACP; Rust embedders call AgentSession directly. Admission composes the harness and binds capabilities. FactRun drives an effect actor, model and tool ports, and a non-bypassable completion gate. The fact log feeds replay; live events and the run store are projections. Provider, host tool and optional cloud services have separate boundaries.</desc>
