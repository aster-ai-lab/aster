<text x="60" y="96" class="small">2026-11-02 工作区快照 · Core / ACP 9.1.7 · aster CLI 0.1.6 · 包含未提交的并行工作，详见配套源码清单</text>
<text x="60" y="126" class="tiny">实线 = 模块级调用或事实流    虚线框 = 责任边界    底部卡片 = 端口对接的系统    本图不是逐函数调用图</text>
