 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52647e"/></marker>
 <marker id="violetArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b4bd9"/></marker>
 <linearGradient id="actor" x1="0" x2="1"><stop stop-color="#353277"/><stop offset="1" stop-color="#5144ce"/></linearGradient>
</defs>
