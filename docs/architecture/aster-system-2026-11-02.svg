<text x="103" y="605" class="heading">Session / Run Admission</text>
<text x="103" y="636" class="body">Session 单飞准入；绑定能力快照与版本</text>
<text x="103" y="663" class="body">Run → Turn → Subtask → Turn；取消与清理随所有权</text>
<text x="103" y="690" class="body">显式后台任务提升到 Run，不能延长父作用域</text>
<rect x="665" y="570" width="550" height="135" rx="16" fill="#fff" stroke="#c8d2e2" stroke-width="1.6"/>
<text x="688" y="605" class="heading">Meta Harness · 准入时组装</text>
<text x="688" y="636" class="body">stock / host:&lt;id&gt;；Rust 宿主也可提供完整组装器</text>
<text x="688" y="663" class="body">有序 Moore 组件 → HarnessGraph → Actor</text>
<text x="688" y="690" class="body">KernelPolicy 常驻；组装器不能关闭内核治理</text>
<rect x="1250" y="570" width="550" height="135" rx="16" fill="#fff" stroke="#c8d2e2" stroke-width="1.6"/>
<text x="1273" y="605" class="heading">上下文与策略输入</text>
<text x="1273" y="636" class="body">Prompt slots / WorkPolicy / skills / host context</text>
<text x="1273" y="663" class="body">ContextProvider：保留最新、去重、排序、token 预算</text>
<text x="1273" y="690" class="body">上下文装配提供输入；不产生第二套执行控制器</text>
<path d="M355 705V745" class="link"/>
<path d="M945 705V745" class="link"/>
<path d="M1535 705V745" class="link"/>
