<text x="940" y="789" class="heading white" text-anchor="middle">FactRun + aster-effect Actor</text>
<text x="940" y="822" class="body white" text-anchor="middle">append fact → fold log → choose transition → execute effect → append result</text>
<rect x="335" y="845" width="226" height="42" rx="11" fill="#eeedff" stroke="#eeedff" stroke-width="1.6"/>
<text x="448" y="873" class="body" text-anchor="middle">system</text>
<rect x="581" y="845" width="226" height="42" rx="11" fill="#eeedff" stroke="#eeedff" stroke-width="1.6"/>
<text x="694" y="873" class="body" text-anchor="middle">tools</text>
<rect x="827" y="845" width="226" height="42" rx="11" fill="#eeedff" stroke="#eeedff" stroke-width="1.6"/>
<text x="940" y="873" class="body" text-anchor="middle">budget</text>
<rect x="1073" y="845" width="226" height="42" rx="11" fill="#eeedff" stroke="#eeedff" stroke-width="1.6"/>
<text x="1186" y="873" class="body" text-anchor="middle">compact</text>
<rect x="1319" y="845" width="226" height="42" rx="11" fill="#eeedff" stroke="#eeedff" stroke-width="1.6"/>
<text x="1432" y="873" class="body" text-anchor="middle">infer</text>
<text x="940" y="937" class="small" text-anchor="middle">停等 ≠ 结束：确认 / 用户补充写入新事实后 resume；steer 写入新 user.message；取消单独传播</text>
<path d="M335 905V977" class="link"/>
<path d="M930 905V977" class="link"/>
<path d="M1540 905V977" class="link"/>
<rect x="80" y="977" width="510" height="157" rx="16" fill="#edf4ff" stroke="#a9c5ec" stroke-width="1.6"/>
<text x="103" y="1012" class="heading">LiveCompletion · 模型端口</text>
<text x="103" y="1043" class="body">LlmClient / provider 适配；结构化输出与流式事件</text>
<text x="103" y="1070" class="body">task scheduler + generation pool（支持时）</text>
<text x="103" y="1097" class="body">分开管理：模型容量、token、quiet gap、运行时长</text>
<rect x="625" y="977" width="610" height="157" rx="16" fill="#edf8f2" stroke="#a6ceb6" stroke-width="1.6"/>
<text x="648" y="1012" class="heading">Tool Runtime · 执行前授权</text>
<text x="648" y="1043" class="body">PermissionPolicy：Allow / Ask / Deny → ToolRunner</text>
<text x="648" y="1070" class="body">ToolExecutor / Registry；内置、MCP、Skill、Task</text>
<text x="648" y="1097" class="body">workspace / sandbox / artifacts；超时与协作取消</text>
<rect x="1270" y="977" width="530" height="157" rx="16" fill="#fff6e9" stroke="#e4c18b" stroke-width="1.6"/>
<text x="1293" y="1012" class="heading">Completion Gate · 唯一完成裁决</text>
<text x="1293" y="1043" class="body">mutation ledger + reports / waiver + effect digest</text>
<text x="1293" y="1070" class="body">Allow 才写 turn.complete；未满足则拒绝完成</text>
<text x="1293" y="1097" class="body">Narrative / Verified / Waived / Distinct</text>
<text x="1293" y="1124" class="body">forced_stop 独立标记中断原因</text>
<path d="M1235 1057H1270" class="link"/>
<text x="940" y="1167" class="small" text-anchor="middle">模型响应、工具结果与完成证据由执行内核纳入事实链</text>
<path d="M335 1134V1190" class="link"/>
<path d="M930 1134V1190" class="link"/>
<path d="M1540 1134V1190" class="link"/>
<rect x="210" y="1190" width="1590" height="91" rx="14" fill="#fff6ec" stroke="#dfaa62" stroke-width="1.6"/>
<text x="1005" y="1224" class="heading" text-anchor="middle">Append-only Fact Log / 共享 FileLog · 运行决策与恢复的权威历史</text>
<text x="1005" y="1256" class="small" text-anchor="middle">user.message · model.turn · tool.result · confirmation / question answers · turn.complete · durable source / evidence</text>
<path d="M210 1234H65V825H210" class="feedback"/>
<text x="87" y="1174" class="small">fold / replay</text>
<path d="M1005 1281V1314" class="link"/>
<rect x="210" y="1314" width="1590" height="62" rx="13" fill="#eff2f7" stroke="#cbd4df" stroke-width="1.6"/>
<text x="1005" y="1353" class="body" text-anchor="middle">checkpoint 绑定 durable source；RunStore / AgentEvent 是执行投影；最终完成状态服从 Completion Gate</text>
<text x="60" y="1456" class="section">端口、宿主服务与可选部署</text>
<rect x="60" y="1481" width="540" height="141" rx="16" fill="#edf4ff" stroke="#a9c5ec" stroke-width="1.6"/>
<text x="83" y="1516" class="heading">模型 / Provider 后端</text>
<text x="83" y="1547" class="body">远程 API 或配置的模型后端；由 LlmClient 适配</text>
<text x="83" y="1574" class="body">可选 Gateway 路由；并非每次运行的必经节点</text>
<text x="83" y="1601" class="body">Studio 辅助模型调用使用自己的调用与校验路径</text>
<rect x="630" y="1481" width="570" height="141" rx="16" fill="#edf8f2" stroke="#a6ceb6" stroke-width="1.6"/>
<text x="653" y="1516" class="heading">工具与数据服务</text>
<text x="653" y="1547" class="body">宿主工具 / MCP；Office / Browser / Capture</text>
<text x="653" y="1574" class="body">本机 sandbox companion；文件、产物与检索后端</text>
<text x="653" y="1601" class="body">租户、成员记忆与索引有各自的数据与信任边界</text>
<rect x="1230" y="1481" width="630" height="141" rx="16" fill="#fff" stroke="#c8d2e2" stroke-width="1.6"/>
<text x="1253" y="1516" class="heading">可选控制面与高级能力</text>
<text x="1253" y="1547" class="body">Cloud / API / Control plane 使用独立工作区</text>
<text x="1253" y="1574" class="body">local-code 默认；advanced-harness 由 feature 开启</text>
<text x="1253" y="1601" class="body">可组合 Harness ≠ 默认自动改写 / 评估自身 Harness</text>
<text x="60" y="1666" class="small">原图核心主线成立：事件驱动执行、权限前置、事实回放与完成门槛。修正了 ACP 必经、Meta Harness 方向和线性 End 的误导。</text>
<text x="60" y="1698" class="tiny">源码依据与局限：aster-system-2026-11-02.md / .sources.json    ·    独立存储并不都归入 Fact Log    ·    本图不等于发布包或跨平台实测证明</text>
</svg>
