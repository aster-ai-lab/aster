<path d="M800 281V310" class="link"/>
<rect x="60" y="310" width="920" height="70" rx="16" fill="#eef1ff" stroke="#b9b5ed" stroke-width="1.6"/>
<text x="83" y="345" class="heading">aster-acp · ACP JSON-RPC / stdio</text>
<text x="944" y="353" class="small" text-anchor="end">处理 Session 请求、事件、审批和恢复</text>
<text x="1189" y="332" class="small">SDK 调用</text>
<rect x="45" y="418" width="1830" height="995" rx="24" fill="#fbfcff" stroke="#9baac1" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="70" y="451" class="section">aster-core · 执行内核</text>
<rect x="80" y="470" width="1720" height="65" rx="14" fill="#eef1ff" stroke="#b9b5ed" stroke-width="1.6"/>
<text x="110" y="510" class="heading">AgentSession API</text>
<text x="395" y="510" class="body">send / stream · confirm_tool_use · steer / resume_run · cancel / close</text>
<path d="M520 380V470" class="link"/>
<path d="M1175 281V470" class="link"/>
<path d="M355 535V570" class="link"/>
<path d="M945 535V570" class="link"/>
<path d="M1535 535V570" class="link"/>
<rect x="80" y="570" width="550" height="135" rx="16" fill="#fff" stroke="#c8d2e2" stroke-width="1.6"/>
<text x="103" y="605" class="heading">Session / Run · 运行准备</text>
<text x="103" y="636" class="body">同一会话一次只运行一个请求；固定能力及版本</text>
<text x="103" y="663" class="body">Run → Turn → Subtask → Turn</text>
<text x="103" y="690" class="body">子任务随父级结束；后台任务由 Run 管理</text>
<rect x="665" y="570" width="550" height="135" rx="16" fill="#fff" stroke="#c8d2e2" stroke-width="1.6"/>
<text x="688" y="605" class="heading">Meta Harness · 组装执行图</text>
<text x="688" y="636" class="body">使用 stock / host:&lt;id&gt;；宿主也可自行组装</text>
<text x="688" y="663" class="body">按顺序组合 Moore 组件，生成 Actor</text>
<text x="688" y="690" class="body">KernelPolicy：权限检查和完成检查不能关闭</text>
<rect x="1250" y="570" width="550" height="135" rx="16" fill="#fff" stroke="#c8d2e2" stroke-width="1.6"/>
<text x="1273" y="605" class="heading">上下文与规则</text>
<text x="1273" y="636" class="body">Prompt slots / WorkPolicy / skills / host context</text>
<text x="1273" y="663" class="body">ContextProvider：取最新结果、去重、排序、限制 token</text>
<text x="1273" y="690" class="body">整理后交给模型；执行流程由 FactRun 控制</text>
<path d="M355 705V745" class="link"/>
<path d="M945 705V745" class="link"/>
<path d="M1535 705V745" class="link"/>
<rect x="210" y="745" width="1460" height="160" rx="22" fill="url(#actor)" stroke="#454099" stroke-width="1.6"/>
<text x="940" y="789" class="heading white" text-anchor="middle">FactRun + aster-effect Actor</text>
<text x="940" y="822" class="body white" text-anchor="middle">append fact → fold log → choose transition → execute effect → append result</text>
<rect x="335" y="845" width="226" height="42" rx="11" fill="#eeedff" stroke="#eeedff" stroke-width="1.6"/>
<text x="448" y="873" class="body" text-anchor="middle">system</text>
<rect x="581" y="845" width="226" height="42" rx="11" fill="#eeedff" stroke="#eeedff" stroke-width="1.6"/>
<text x="694" y="873" class="body" text-anchor="middle">tools</text>
<rect x="827" y="845" width="226" height="42" rx="11" fill="#eeedff" stroke="#eeedff" stroke-width="1.6"/>
<text x="940" y="873" class="body" text-anchor="middle">budget</text>
<rect x="1073" y="845" width="226" height="42" rx="11" fill="#eeedff" stroke="#eeedff" stroke-width="1.6"/>
<text x="1186" y="873" class="body" text-anchor="middle">compact</text>
<rect x="1319" y="845" width="226" height="42" rx="11" fill="#eeedff" stroke="#eeedff" stroke-width="1.6"/>
<text x="1432" y="873" class="body" text-anchor="middle">infer</text>
<text x="940" y="937" class="small" text-anchor="middle">需要确认时暂停，收到答复后继续；steer 写入新消息；取消请求传给当前任务</text>
<path d="M335 905V977" class="link"/>
<path d="M930 905V977" class="link"/>
<path d="M1540 905V977" class="link"/>
<rect x="80" y="977" width="510" height="157" rx="16" fill="#edf4ff" stroke="#a9c5ec" stroke-width="1.6"/>
<text x="103" y="1012" class="heading">LiveCompletion · 调用模型</text>
<text x="103" y="1043" class="body">LlmClient / provider：模型返回文本或工具调用</text>
<text x="103" y="1070" class="body">任务调度；客户端支持时限制模型生成并发</text>
<text x="103" y="1097" class="body">分别限制并发、token、无响应时间和运行时长</text>
<rect x="625" y="977" width="610" height="157" rx="16" fill="#edf8f2" stroke="#a6ceb6" stroke-width="1.6"/>
<text x="648" y="1012" class="heading">Tool Runtime · 执行工具</text>
<text x="648" y="1043" class="body">PermissionPolicy 先检查权限：Allow / Ask / Deny</text>
<text x="648" y="1070" class="body">ToolExecutor / Registry：内置工具、MCP、Skill、Task</text>
<text x="648" y="1097" class="body">工作区限制、沙箱、输出文件、超时和取消</text>
<rect x="1270" y="977" width="530" height="157" rx="16" fill="#fff6e9" stroke="#e4c18b" stroke-width="1.6"/>
<text x="1293" y="1012" class="heading">Completion Gate · 检查能否结束</text>
<text x="1293" y="1043" class="body">核对修改记录、检查结果、豁免和 effect digest</text>
<text x="1293" y="1070" class="body">通过后写 turn.complete；否则不能完成</text>
<text x="1293" y="1097" class="body">Narrative / Verified / Waived / Distinct</text>
<text x="1293" y="1124" class="body">forced_stop 记录中断原因</text>
<path d="M1235 1057H1270" class="link"/>
<text x="940" y="1167" class="small" text-anchor="middle">模型响应、工具结果和结束状态写入日志</text>
<path d="M335 1134V1190" class="link"/>
<path d="M930 1134V1190" class="link"/>
<path d="M1540 1134V1190" class="link"/>
<rect x="210" y="1190" width="1590" height="91" rx="14" fill="#fff6ec" stroke="#dfaa62" stroke-width="1.6"/>
<text x="1005" y="1224" class="heading" text-anchor="middle">Fact Log / FileLog · 只追加，恢复时以日志为准</text>
<text x="1005" y="1256" class="small" text-anchor="middle">user.message · model.turn · tool.result · confirmation / question answers · turn.complete · durable source / evidence</text>
<path d="M210 1234H65V825H210" class="feedback"/>
<text x="87" y="1174" class="small">fold / replay</text>
<path d="M1005 1281V1314" class="link"/>
<rect x="210" y="1314" width="1590" height="62" rx="13" fill="#eff2f7" stroke="#cbd4df" stroke-width="1.6"/>
<text x="1005" y="1353" class="body" text-anchor="middle">RunStore 查询状态，AgentEvent 通知事件；checkpoint 引用原始日志；Completion Gate 决定是否完成</text>
<text x="60" y="1456" class="section">模型、工具和服务</text>
<rect x="60" y="1481" width="540" height="141" rx="16" fill="#edf4ff" stroke="#a9c5ec" stroke-width="1.6"/>
<text x="83" y="1516" class="heading">模型服务</text>
<text x="83" y="1547" class="body">LlmClient 连接远程 API 或配置的模型服务</text>
<text x="83" y="1574" class="body">可配置 Gateway 转发模型请求</text>
<text x="83" y="1601" class="body">Studio 单独发起的调用自行检查结果</text>
<rect x="630" y="1481" width="570" height="141" rx="16" fill="#edf8f2" stroke="#a6ceb6" stroke-width="1.6"/>
<text x="653" y="1516" class="heading">工具与数据服务</text>
<text x="653" y="1547" class="body">宿主工具 / MCP；Office / Browser / Capture</text>
<text x="653" y="1574" class="body">本机 sandbox companion；文件和检索服务</text>
<text x="653" y="1601" class="body">租户数据、成员记忆和索引分别存储、控制访问</text>
<rect x="1230" y="1481" width="630" height="141" rx="16" fill="#fff" stroke="#c8d2e2" stroke-width="1.6"/>
<text x="1253" y="1516" class="heading">可选服务与功能</text>
<text x="1253" y="1547" class="body">Cloud / API / Control plane 使用独立工作区</text>
<text x="1253" y="1574" class="body">默认启用 local-code；按需开启 advanced-harness</text>
<text x="1253" y="1601" class="body">默认不会自动修改或评估自己的 Harness</text>
<text x="60" y="1666" class="small">图中展开 TUI、Studio、ACP 和 Core；模型、工具及其他服务只列入口。</text>
<text x="60" y="1698" class="tiny">源码位置与核对记录：aster-system-2026-11-02.md / .sources.json</text>
</svg>
