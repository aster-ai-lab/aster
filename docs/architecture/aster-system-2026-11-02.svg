<text x="58" y="61" class="title">Aster 系统架构</text>
<text x="60" y="96" class="small">2026-11-02 · Core / ACP 9.1.7 · aster CLI 0.1.6 · 含工作区未提交改动</text>
<text x="60" y="126" class="tiny">箭头：调用或数据流    虚线框：模块范围    下方三组：模型、工具和可选服务</text>
<rect x="60" y="165" width="530" height="116" rx="16" fill="#fff" stroke="#c8d2e2" stroke-width="1.6"/>
<text x="83" y="200" class="heading">Studio · React + Tauri</text>
<text x="83" y="231" class="body">Agent Plane：桌面交互、租户和会话管理</text>
<text x="83" y="258" class="body">提供 Office / Browser / Capture 和文件预览</text>
<rect x="620" y="165" width="360" height="116" rx="16" fill="#fff" stroke="#c8d2e2" stroke-width="1.6"/>
<text x="643" y="200" class="heading">aster · Terminal TUI</text>
<text x="643" y="231" class="body">Pager、终端交互、ACP 事件展示</text>
<text x="643" y="258" class="body">校验并启动配套 aster-acp</text>
<rect x="1010" y="165" width="330" height="116" rx="16" fill="#fff" stroke="#c8d2e2" stroke-width="1.6"/>
<text x="1033" y="200" class="heading">Rust SDK Host</text>
<text x="1033" y="231" class="body">嵌入 aster-core</text>
<text x="1033" y="258" class="body">直接调用 AgentSession</text>
<rect x="1370" y="165" width="490" height="206" rx="16" fill="#edf4ff" stroke="#a9c5ec" stroke-width="1.6"/>
<text x="1393" y="200" class="heading">Studio 单独调用模型</text>
<text x="1393" y="231" class="body">例：workbench 独立审查</text>
<text x="1393" y="258" class="body">通过 Provider / ModelControl 调用</text>
<text x="1393" y="285" class="body">不使用工具，按提供的证据检查结果</text>
<text x="1393" y="312" class="body">调用过程不经过 ACP</text>
